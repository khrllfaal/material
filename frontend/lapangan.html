<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Input Bahan — Material & Stok</title>
<link rel="stylesheet" href="vendor/tailwind.css">
<script src="vendor/icons.js"></script>
<style>
  body{font-family:'Inter',ui-sans-serif,system-ui,sans-serif;}
  #app{max-width:520px;margin:0 auto;}
  ::-webkit-scrollbar{display:none;}
  .tab-scroll::-webkit-scrollbar{display:none;}
</style>
</head>
<body class="bg-slate-100 text-slate-800">
<div id="app" class="min-h-screen bg-slate-100 flex flex-col">

  <div id="loginScreen" class="flex-1 flex items-center justify-center p-6">
    <div class="bg-white rounded-3xl shadow-lg shadow-slate-200 p-8 w-full max-w-sm">
      <div class="w-12 h-12 rounded-2xl bg-emerald-600 text-white flex items-center justify-center mb-5">
        <i data-lucide="smartphone" class="w-6 h-6"></i>
      </div>
      <h1 class="text-xl font-extrabold text-slate-800">Input Bahan Lapangan</h1>
      <p class="text-slate-500 text-sm mt-1 mb-6">Material Masuk &amp; Pemakaian per proyek</p>
      <div id="loginErr" class="hidden bg-red-50 text-red-700 border border-red-200 rounded-xl px-3.5 py-2.5 text-sm mb-4"></div>
      <form id="loginForm" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1.5">Email</label>
          <input type="email" id="loginEmail" autocomplete="username" required
            class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-[15px] focus:outline-none focus:ring-2 focus:ring-emerald-100 focus:border-emerald-500">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1.5">Password</label>
          <input type="password" id="loginPassword" autocomplete="current-password" required
            class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-[15px] focus:outline-none focus:ring-2 focus:ring-emerald-100 focus:border-emerald-500">
        </div>
        <button class="w-full bg-emerald-600 hover:bg-emerald-700 active:scale-[.98] transition text-white font-bold py-3.5 rounded-xl text-[15px] disabled:opacity-60" id="loginSubmit" type="submit">Masuk</button>
      </form>
    </div>
  </div>

  <div id="appRoot" class="hidden flex-1 flex flex-col">
    <div class="bg-white border-b border-slate-200 px-5 py-4 flex items-center justify-between sticky top-0 z-10">
      <div>
        <div class="font-bold text-[15px] leading-tight" id="whoName">—</div>
        <div class="text-xs text-slate-400" id="whoRole">—</div>
      </div>
      <button id="btnLogout" class="text-slate-400 hover:text-red-600 transition flex items-center gap-1 text-xs font-semibold">
        <i data-lucide="log-out" class="w-4 h-4"></i> Keluar
      </button>
    </div>

    <div id="projSel" class="px-5 pt-4"></div>

    <div id="tabs" class="flex gap-2 px-5 pt-4 pb-1 overflow-x-auto tab-scroll"></div>

    <div id="content" class="flex-1 px-5 pb-10 pt-2"></div>
  </div>

</div>
<div id="toastWrap"></div>
<script src="backend-config.js"></script>
<script>
/* ============================================================
   Mobile field-admin app. Same PHP+MySQL session/API as
   frontend/admin.html — different, much lighter UI built for
   one-handed use on a phone in the field.
   ============================================================ */
var STATE = { user:null, projects:[], materials:[], pekerjaan:[], projectId:null, tab:'masuk' };
var TAB_ICONS = {masuk:'truck', pakai:'hammer', stok:'layers', riwayat:'history'};

function apiFetch(path, opts){
  opts = opts || {};
  opts.credentials = 'include';
  opts.headers = Object.assign({'Content-Type':'application/json'}, opts.headers||{});
  return fetch((window.API_BASE_URL||'') + path, opts).then(async function(res){
    var data = {}; try{ data = await res.json(); }catch(e){}
    if(!res.ok) throw new Error(data.error || ('HTTP '+res.status));
    return data;
  });
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function fmtNum(n){ return Number(n||0).toLocaleString('id-ID', {maximumFractionDigits:2}); }
function uid(p){ return p + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function today(){ return new Date().toISOString().slice(0,10); }
function fv(id){ var e=document.getElementById(id); return e?String(e.value||'').trim():''; }
function icons(){ if(window.lucide) lucide.createIcons(); }
function toast(msg, danger){
  var d=document.createElement('div');
  d.className='fixed left-4 right-4 bottom-5 max-w-[488px] mx-auto text-white text-sm px-4 py-3.5 rounded-2xl shadow-lg z-50 '+(danger?'bg-red-600':'bg-slate-900');
  d.textContent = msg;
  document.getElementById('toastWrap').appendChild(d);
  setTimeout(function(){ d.remove(); }, 2800);
}

/* ---------------- auth ---------------- */
document.getElementById('loginForm').addEventListener('submit', function(e){
  e.preventDefault();
  var email = document.getElementById('loginEmail').value.trim();
  var password = document.getElementById('loginPassword').value;
  var btn = document.getElementById('loginSubmit');
  var err = document.getElementById('loginErr');
  err.classList.add('hidden');
  btn.disabled = true; btn.textContent = 'Memproses…';
  apiFetch('/auth_login.php', {method:'POST', body:JSON.stringify({email:email, password:password})})
    .then(function(res){ boot(res.user); })
    .catch(function(e){ err.textContent = e.message || 'Login gagal.'; err.classList.remove('hidden'); })
    .finally(function(){ btn.disabled = false; btn.textContent = 'Masuk'; });
});
document.getElementById('btnLogout').onclick = function(){
  apiFetch('/auth_logout.php', {method:'POST'}).catch(function(){}).finally(function(){
    STATE.user = null;
    document.getElementById('appRoot').classList.add('hidden');
    document.getElementById('loginScreen').classList.remove('hidden');
  });
};

apiFetch('/auth_me.php').then(function(res){
  if(res.user) boot(res.user);
}).catch(function(){});

function boot(user){
  STATE.user = user;
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('appRoot').classList.remove('hidden');
  document.getElementById('whoName').textContent = user.nama;
  var roleLabel = {admin:'Admin Pusat', owner:'Owner', lapangan:'Admin Lapangan'}[user.role] || user.role;
  document.getElementById('whoRole').textContent = roleLabel;

  Promise.all([
    apiFetch('/projects.php'),
    apiFetch('/materials.php'),
    apiFetch('/pekerjaan.php'),
  ]).then(function(r){
    var allProjects = r[0], allPekerjaan = r[2];
    STATE.materials = r[1];
    if(user.role === 'lapangan' && Array.isArray(user.projectIds)){
      var scope = user.projectIds;
      STATE.projects = allProjects.filter(function(p){ return scope.indexOf(p.id) > -1; });
    } else {
      STATE.projects = allProjects;
    }
    STATE.pekerjaanAll = allPekerjaan;
    if(!STATE.projects.length){
      document.getElementById('projSel').innerHTML =
        '<div class="bg-white rounded-2xl p-6 text-center text-sm text-slate-400 shadow-sm border border-slate-200">Belum ada proyek yang ditugaskan ke akun Anda.<br>Hubungi Admin Pusat.</div>';
      return;
    }
    STATE.projectId = STATE.projects[0].id;
    renderProjSel();
    renderTabs();
    renderTab();
  }).catch(function(e){ toast('Gagal memuat data: ' + e.message, true); });
}

function renderProjSel(){
  var el = document.getElementById('projSel');
  if(STATE.projects.length <= 1){
    el.innerHTML = STATE.projects.length ?
      '<div class="bg-white rounded-2xl px-4 py-3 shadow-sm border border-slate-200 flex items-center gap-2.5">'+
      '<i data-lucide="building-2" class="w-4 h-4 text-emerald-600"></i>'+
      '<span class="font-bold text-[15px]">'+esc(STATE.projects[0].nama)+'</span></div>' : '';
    icons();
    return;
  }
  el.innerHTML =
    '<div class="relative">'+
    '<select id="projPick" class="w-full appearance-none bg-white border border-slate-200 rounded-2xl px-4 py-3.5 pr-10 font-bold text-[15px] shadow-sm focus:outline-none focus:ring-2 focus:ring-emerald-100">'+
    STATE.projects.map(function(p){ return '<option value="'+esc(p.id)+'"'+(p.id===STATE.projectId?' selected':'')+'>'+esc(p.nama)+'</option>'; }).join('') +
    '</select>'+
    '<i data-lucide="chevron-down" class="w-4 h-4 text-slate-400 absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none"></i>'+
    '</div>';
  document.getElementById('projPick').onchange = function(e){ STATE.projectId = e.target.value; renderTab(); };
  icons();
}

function pekerjaanForProject(){
  return (STATE.pekerjaanAll||[]).filter(function(pk){ return pk.project_id === STATE.projectId; });
}

/* ---------------- tabs ---------------- */
var TABS = [
  {id:'masuk', label:'Bahan Masuk'},
  {id:'pakai', label:'Pemakaian'},
  {id:'stok', label:'Stok'},
  {id:'riwayat', label:'Riwayat'},
];
function renderTabs(){
  document.getElementById('tabs').innerHTML = TABS.map(function(t){
    var on = t.id===STATE.tab;
    return '<button data-tab="'+t.id+'" class="flex-none flex items-center gap-1.5 px-4 py-2.5 rounded-full text-[13px] font-bold whitespace-nowrap transition-colors '+
      (on ? 'bg-emerald-600 text-white shadow-sm shadow-emerald-200' : 'bg-white text-slate-500 border border-slate-200') + '">'+
      '<i data-lucide="'+TAB_ICONS[t.id]+'" class="w-3.5 h-3.5"></i>'+esc(t.label)+'</button>';
  }).join('');
  document.querySelectorAll('[data-tab]').forEach(function(b){
    b.onclick = function(){ STATE.tab = b.getAttribute('data-tab'); renderTabs(); renderTab(); };
  });
  icons();
}

function renderTab(){
  var c = document.getElementById('content');
  if(STATE.tab === 'masuk') return renderInputForm(c, 'masuk');
  if(STATE.tab === 'pakai') return renderInputForm(c, 'pakai');
  if(STATE.tab === 'stok') return renderStok(c);
  if(STATE.tab === 'riwayat') return renderRiwayat(c);
}

/* ---------------- shared card/field helpers ---------------- */
function card(inner, extraCls){ return '<div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200 mb-3.5 '+(extraCls||'')+'">'+inner+'</div>'; }
function fieldWrap(label, inputHtml){
  return '<div class="mb-4"><label class="block text-xs font-bold text-slate-500 mb-1.5">'+esc(label)+'</label>'+inputHtml+'</div>';
}
var inputCls = "w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-[15px] focus:outline-none focus:ring-2 focus:ring-emerald-100 focus:border-emerald-500";

/* ---------------- input forms ---------------- */
function materialOptions(selected, query){
  var list = STATE.materials;
  if(query) list = list.filter(function(m){ return (m.nama+' '+m.kode).toLowerCase().indexOf(query.toLowerCase())>-1; });
  if(!list.length) return '<option value="">— Tidak ditemukan —</option>';
  return list.map(function(m){
    return '<option value="'+esc(m.id)+'"'+(m.id===selected?' selected':'')+'>'+esc(m.nama)+' ('+esc(m.satuan)+')</option>';
  }).join('');
}
function pekerjaanOptions(selected){
  var list = pekerjaanForProject();
  if(!list.length) return '<option value="">— Tidak ada pekerjaan terdaftar —</option>';
  return '<option value="">— Pilih pekerjaan (opsional) —</option>' + list.map(function(pk){
    return '<option value="'+esc(pk.id)+'"'+(pk.id===selected?' selected':'')+'>'+esc(pk.nama)+'</option>';
  }).join('');
}

function renderInputForm(c, mode){
  var isMasuk = mode === 'masuk';
  var accent = isMasuk ? 'emerald' : 'amber';
  if(!STATE.materials.length){
    c.innerHTML = card('<div class="text-center text-sm text-slate-400 py-4">Belum ada Master Material.<br>Hubungi Admin Pusat untuk menambahkan.</div>');
    return;
  }
  c.innerHTML = card(
    '<div class="flex items-center gap-2.5 mb-5">'+
      '<div class="w-9 h-9 rounded-xl bg-'+accent+'-50 text-'+accent+'-600 flex items-center justify-center"><i data-lucide="'+(isMasuk?'truck':'hammer')+'" class="w-4.5 h-4.5"></i></div>'+
      '<h3 class="font-bold text-[15px]">'+(isMasuk?'Catat Bahan Masuk':'Catat Pemakaian Bahan')+'</h3>'+
    '</div>'+
    fieldWrap('Tanggal', '<input type="date" id="f_tgl" value="'+today()+'" class="'+inputCls+'">')+
    fieldWrap('Material', '<input type="text" id="f_material_q" placeholder="Ketik untuk mencari bahan…" class="'+inputCls+' mb-2">'+
      '<select id="f_material" class="'+inputCls+'">'+materialOptions()+'</select>')+
    (isMasuk ? '' : fieldWrap('Pekerjaan (untuk analisis RAP)', '<select id="f_pekerjaan" class="'+inputCls+'">'+pekerjaanOptions()+'</select>'))+
    fieldWrap('Jumlah (Qty)', '<input type="number" id="f_qty" inputmode="decimal" min="0" step="any" placeholder="0" class="'+inputCls+'">')+
    (isMasuk ? fieldWrap('No. Surat Jalan / Nota', '<input type="text" id="f_ref" placeholder="Opsional" class="'+inputCls+'">') : '')+
    (isMasuk ? fieldWrap('Harga Satuan (opsional)', '<input type="number" id="f_harga" inputmode="decimal" min="0" step="any" placeholder="0" class="'+inputCls+'">') : '')+
    fieldWrap('Keterangan', '<input type="text" id="f_ket" placeholder="Opsional" class="'+inputCls+'">')+
    '<button id="f_save" class="w-full bg-'+accent+'-600 hover:bg-'+accent+'-700 active:scale-[.98] transition text-white font-bold py-3.5 rounded-xl text-[15px] mt-1">'+
      (isMasuk?'Simpan Bahan Masuk':'Simpan Pemakaian')+'</button>'
  );
  icons();
  document.getElementById('f_save').onclick = function(){ submitInput(mode); };
  document.getElementById('f_material_q').addEventListener('input', function(e){
    var sel = document.getElementById('f_material');
    var current = sel.value;
    sel.innerHTML = materialOptions(current, e.target.value);
  });
}

function submitInput(mode){
  var qty = parseFloat(document.getElementById('f_qty').value);
  var materialId = document.getElementById('f_material').value;
  if(!materialId){ toast('Pilih material.', true); return; }
  if(!qty || qty <= 0){ toast('Isi jumlah (qty) yang valid.', true); return; }

  var btn = document.getElementById('f_save');
  btn.disabled = true; btn.textContent = 'Menyimpan…';

  var payload, endpoint;
  if(mode === 'masuk'){
    payload = {
      id: uid('mr_'), project_id: STATE.projectId, material_id: materialId,
      tgl: document.getElementById('f_tgl').value || today(),
      qty: qty, harga_satuan: parseFloat(document.getElementById('f_harga').value) || 0,
      no_referensi: document.getElementById('f_ref').value || '',
      ket: document.getElementById('f_ket').value || '',
    };
    endpoint = '/material_receipts.php';
  } else {
    payload = {
      id: uid('mu_'), project_id: STATE.projectId, material_id: materialId,
      pekerjaan_id: document.getElementById('f_pekerjaan').value || null,
      tgl: document.getElementById('f_tgl').value || today(),
      qty: qty, ket: document.getElementById('f_ket').value || '',
    };
    endpoint = '/material_usage.php';
  }

  apiFetch(endpoint, {method:'POST', body:JSON.stringify(payload)})
    .then(function(){
      toast('Tersimpan.');
      renderTab();
    })
    .catch(function(e){ toast('Gagal menyimpan: ' + e.message, true); })
    .finally(function(){ if(btn){ btn.disabled=false; btn.textContent = mode==='masuk'?'Simpan Bahan Masuk':'Simpan Pemakaian'; } });
}

/* ---------------- stok ---------------- */
function statusBadge(status){
  var map = {
    AMAN:['bg-emerald-50 text-emerald-700','Aman'],
    MENIPIS:['bg-amber-50 text-amber-700','Perlu Dikirim'],
    HABIS:['bg-red-50 text-red-700','Stok Habis'],
    MELEBIHI:['bg-red-50 text-red-700','Melebihi RAP'],
    HAMPIR_HABIS:['bg-amber-50 text-amber-700','Hampir Habis RAP'],
    DATA_TIDAK_LENGKAP:['bg-slate-100 text-slate-500','Data Tidak Lengkap'],
  };
  var m = map[status] || ['bg-slate-100 text-slate-500', status];
  return '<span class="text-[11px] font-bold px-2.5 py-1 rounded-full whitespace-nowrap '+m[0]+'">'+esc(m[1])+'</span>';
}

function renderStok(c){
  c.innerHTML = card('<div class="text-center text-sm text-slate-400 py-4">Memuat stok…</div>');
  apiFetch('/material_stock.php').then(function(rows){
    var mine = rows.filter(function(r){ return r.project_id === STATE.projectId; });
    if(!mine.length){ c.innerHTML = card('<div class="text-center text-sm text-slate-400 py-4">Belum ada data bahan masuk/pemakaian untuk proyek ini.</div>'); return; }
    c.innerHTML = mine.map(function(r){
      return card(
        '<div class="flex items-start justify-between gap-3">'+
          '<div><div class="font-bold text-[15px]">'+esc(r.material_nama)+'</div>'+
          '<div class="text-xs text-slate-400 mt-0.5">Masuk '+fmtNum(r.total_masuk)+' · Keluar '+fmtNum(r.total_keluar)+' '+esc(r.satuan)+'</div></div>'+
          statusBadge(r.status)+
        '</div>'+
        '<div class="text-2xl font-extrabold mt-3">'+fmtNum(r.stok)+' <span class="text-sm font-medium text-slate-400">'+esc(r.satuan)+'</span></div>'
      );
    }).join('');
  }).catch(function(e){ c.innerHTML = card('<div class="text-center text-sm text-red-500 py-4">Gagal memuat: '+esc(e.message)+'</div>'); });
}

/* ---------------- riwayat ---------------- */
function renderRiwayat(c){
  c.innerHTML = card('<div class="text-center text-sm text-slate-400 py-4">Memuat riwayat…</div>');
  Promise.all([apiFetch('/material_receipts.php'), apiFetch('/material_usage.php')]).then(function(r){
    var matName = function(id){ var m = STATE.materials.find(function(x){ return x.id===id; }); return m ? m.nama : id; };
    var allMasuk = r[0].filter(function(x){ return x.project_id === STATE.projectId; });
    var allPakai = r[1].filter(function(x){ return x.project_id === STATE.projectId; });

    c.innerHTML =
      card(
        '<div class="mb-1"><input type="text" id="rw_q" placeholder="Cari nama bahan…" class="'+inputCls+' mb-2.5"></div>'+
        '<div class="grid grid-cols-2 gap-2.5">'+
          '<div><label class="block text-[11px] font-bold text-slate-500 mb-1">Dari Tanggal</label><input type="date" id="rw_from" class="'+inputCls+' text-sm">' +
          '</div>'+
          '<div><label class="block text-[11px] font-bold text-slate-500 mb-1">Sampai Tanggal</label><input type="date" id="rw_to" class="'+inputCls+' text-sm"></div>'+
        '</div>'
      ) +
      '<div id="rw_masuk_wrap"></div><div id="rw_pakai_wrap"></div>';

    function rowHtml(x, sign, kind){
      return '<div class="flex items-center justify-between py-3 border-b border-slate-100 last:border-0">'+
        '<div><div class="font-semibold text-[14px]">'+esc(matName(x.material_id))+'</div>'+
        '<div class="text-xs text-slate-400">'+esc(x.tgl)+(x.no_referensi?' · '+esc(x.no_referensi):'')+'</div></div>'+
        '<div class="flex items-center gap-3">'+
          '<span class="font-bold '+(sign>0?'text-emerald-600':'text-amber-600')+'">'+(sign>0?'+':'−')+fmtNum(x.qty)+'</span>'+
          '<button data-del="'+kind+'" data-id="'+esc(x.id)+'" class="text-slate-300 hover:text-red-600 transition"><i data-lucide="trash-2" class="w-4 h-4"></i></button>'+
        '</div></div>';
    }
    function applyFilter(list){
      var q=fv('rw_q').toLowerCase(), from=fv('rw_from'), to=fv('rw_to');
      return list.filter(function(x){
        if(from && x.tgl<from) return false;
        if(to && x.tgl>to) return false;
        if(q && matName(x.material_id).toLowerCase().indexOf(q)===-1) return false;
        return true;
      });
    }
    function draw(){
      var masuk = applyFilter(allMasuk).slice(0, 30);
      var pakai = applyFilter(allPakai).slice(0, 30);
      document.getElementById('rw_masuk_wrap').innerHTML =
        card('<h3 class="font-bold text-[15px] mb-1 flex items-center gap-2"><i data-lucide="truck" class="w-4 h-4 text-emerald-600"></i>Bahan Masuk</h3>'+
          (masuk.length ? masuk.map(function(x){ return rowHtml(x, 1, 'masuk'); }).join('') : '<div class="text-center text-sm text-slate-400 py-4">Tidak ada data.</div>'));
      document.getElementById('rw_pakai_wrap').innerHTML =
        card('<h3 class="font-bold text-[15px] mb-1 flex items-center gap-2"><i data-lucide="hammer" class="w-4 h-4 text-amber-600"></i>Pemakaian</h3>'+
          (pakai.length ? pakai.map(function(x){ return rowHtml(x, -1, 'pakai'); }).join('') : '<div class="text-center text-sm text-slate-400 py-4">Tidak ada data.</div>'));
      icons();
      c.querySelectorAll('[data-del]').forEach(function(b){
        b.onclick = function(){
          if(!confirm('Hapus data ini?')) return;
          var endpoint = b.getAttribute('data-del') === 'masuk' ? '/material_receipts.php' : '/material_usage.php';
          apiFetch(endpoint + '?id=' + encodeURIComponent(b.getAttribute('data-id')), {method:'DELETE'})
            .then(function(){ toast('Data dihapus.'); renderRiwayat(c); })
            .catch(function(e){ toast('Gagal menghapus: ' + e.message, true); });
        };
      });
    }
    icons();
    draw();
    document.getElementById('rw_q').addEventListener('input', draw);
    document.getElementById('rw_from').addEventListener('change', draw);
    document.getElementById('rw_to').addEventListener('change', draw);
  }).catch(function(e){ c.innerHTML = card('<div class="text-center text-sm text-red-500 py-4">Gagal memuat: '+esc(e.message)+'</div>'); });
}
</script>
</body>
</html>
