<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Material & Stok</title>
<link rel="stylesheet" href="vendor/tailwind.css">
<script src="vendor/icons.js"></script>
<style>
  body{font-family:'Inter',ui-sans-serif,system-ui,sans-serif;}
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:8px;}
  table{border-collapse:collapse;}
  #mobileShell{max-width:560px;margin:0 auto;}
  .tab-scroll::-webkit-scrollbar{display:none;}
</style>
</head>
<body class="bg-slate-50 text-slate-800">

<!-- ============== LOGIN (shared — role is only known after login) ============== -->
<div id="loginScreen" class="min-h-screen flex items-center justify-center p-6">
  <div class="bg-white rounded-3xl shadow-lg shadow-slate-200 p-9 w-full max-w-sm">
    <div class="w-12 h-12 rounded-2xl bg-blue-600 text-white flex items-center justify-center mb-5">
      <i data-lucide="boxes" class="w-6 h-6"></i>
    </div>
    <h1 class="text-xl font-extrabold text-slate-800">Material & Stok</h1>
    <p class="text-slate-500 text-sm mt-1 mb-6">Input bahan &amp; pantau stok proyek</p>
    <div id="loginErr" class="hidden bg-red-50 text-red-700 border border-red-200 rounded-xl px-3.5 py-2.5 text-sm mb-4"></div>
    <form id="loginForm" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-500 mb-1.5">Username</label>
        <input type="text" id="loginEmail" autocomplete="username" autocapitalize="none" autocorrect="off" required class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-100 focus:border-blue-500">
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-500 mb-1.5">Password</label>
        <input type="password" id="loginPassword" autocomplete="current-password" required class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-100 focus:border-blue-500">
      </div>
      <button class="w-full bg-blue-600 hover:bg-blue-700 active:scale-[.98] transition text-white font-bold py-3 rounded-xl text-sm disabled:opacity-60" id="loginSubmit" type="submit">Masuk</button>
    </form>
  </div>
</div>

<!-- ============== DESKTOP SHELL (admin / owner) ============== -->
<div id="desktopShell" class="hidden">
  <div id="sidebarBackdrop" class="hidden fixed inset-0 bg-slate-900/50 z-30 lg:hidden"></div>
  <div id="sidebar" class="w-64 bg-slate-900 text-slate-300 fixed top-0 bottom-0 left-0 overflow-y-auto flex flex-col z-40 transform -translate-x-full transition-transform duration-200 lg:translate-x-0 lg:w-60">
    <div class="px-5 py-5 flex items-center gap-2.5 border-b border-white/10">
      <div class="w-8 h-8 rounded-lg bg-blue-600 text-white flex items-center justify-center shrink-0"><i data-lucide="boxes" class="w-4.5 h-4.5"></i></div>
      <span class="font-extrabold text-white text-[15px] tracking-tight">Material & Stok</span>
      <button id="btnCloseSidebar" class="ml-auto text-slate-400 hover:text-white lg:hidden"><i data-lucide="x" class="w-5 h-5"></i></button>
    </div>
    <div class="px-5 py-3.5 text-xs text-slate-400 border-b border-white/10" id="whoInfo">—</div>
    <div id="navList" class="py-2 flex-1"></div>
    <a id="btnLogout" class="lg:hidden mx-3 mb-4 mt-2 flex items-center gap-2 px-3 py-2.5 rounded-xl text-sm text-slate-400 hover:bg-white/5 hover:text-white cursor-pointer transition-colors">
      <i data-lucide="log-out" class="w-4 h-4"></i> Keluar
    </a>
  </div>
  <div id="topbarMobile" class="lg:hidden sticky top-0 z-20 bg-white border-b border-slate-200 px-4 py-3.5 flex items-center gap-3">
    <button id="btnOpenSidebar" class="text-slate-600"><i data-lucide="menu" class="w-6 h-6"></i></button>
    <span class="font-extrabold text-slate-800 text-[15px]">Material & Stok</span>
  </div>
  <div class="lg:ml-60">
    <div id="topbarDesktop" class="hidden lg:flex items-center justify-end gap-3 sticky top-0 z-20 bg-white/90 backdrop-blur border-b border-slate-200 px-8 py-3">
      <div class="text-right leading-tight">
        <div class="text-sm font-semibold text-slate-700" id="topbarName">—</div>
        <div class="text-xs text-slate-400" id="topbarRole">—</div>
      </div>
      <div class="w-9 h-9 rounded-full bg-blue-50 text-blue-600 flex items-center justify-center font-bold text-sm shrink-0" id="topbarAvatar">—</div>
      <button id="btnLogoutTop" title="Keluar" class="ml-1 w-9 h-9 flex items-center justify-center rounded-full text-slate-400 hover:bg-red-50 hover:text-red-600 transition-colors shrink-0">
        <i data-lucide="log-out" class="w-4.5 h-4.5"></i>
      </button>
    </div>
    <div class="p-5 lg:p-8 max-w-6xl"><div id="content"></div></div>
  </div>
</div>

<!-- ============== MOBILE SHELL (admin lapangan) ============== -->
<div id="mobileShell" class="hidden min-h-screen bg-slate-100 flex-col">
  <div class="bg-white border-b border-slate-200 px-5 py-4 flex items-center justify-between sticky top-0 z-10">
    <div>
      <div class="font-bold text-[15px] leading-tight" id="mWhoName">—</div>
      <div class="text-xs text-slate-400" id="mWhoRole">—</div>
    </div>
    <button id="mBtnLogout" class="text-slate-400 hover:text-red-600 transition flex items-center gap-1 text-xs font-semibold">
      <i data-lucide="log-out" class="w-4 h-4"></i> Keluar
    </button>
  </div>
  <div id="mProjSel" class="px-5 pt-4"></div>
  <div id="mTabs" class="flex gap-2 px-5 pt-4 pb-1 overflow-x-auto tab-scroll"></div>
  <div id="mContent" class="flex-1 px-5 pb-10 pt-2"></div>
</div>

<div id="modalBack" class="hidden fixed inset-0 bg-slate-900/50 z-30 items-center justify-center p-5">
  <div id="modalBody" class="bg-white rounded-2xl p-7 w-full max-w-md max-h-[88vh] overflow-y-auto shadow-xl"></div>
</div>
<div id="toastWrap"></div>

<script src="backend-config.js"></script>
<script>
/* ============================================================
   Material & Stok — single-file frontend. One login gate, two
   shells (desktop sidebar for admin/owner, mobile tabs for admin
   lapangan) picked at runtime by the logged-in user's role, so
   there is exactly one HTML file to redeploy on every revision.
   Plain fetch, no build step, no framework.
   ============================================================ */
var STATE = { user:null, page:'dashboard', cache:{}, projects:[], materials:[], pekerjaanAll:[], projectId:null, tab:'masuk' };

/* ---------------- shared helpers ---------------- */
function apiFetch(path, opts){
  opts = opts || {};
  opts.credentials = 'include';
  opts.headers = Object.assign({'Content-Type':'application/json'}, opts.headers||{});
  return fetch((window.API_BASE_URL||'') + path, opts).then(async function(res){
    var data = {}; try{ data = await res.json(); }catch(e){}
    if(!res.ok) throw new Error(data.error || ('HTTP '+res.status));
    return data;
  });
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function num0(n){ if(n==null||Number.isNaN(n)) return '0'; return Math.round(Number(n)).toLocaleString('id-ID'); }
function numSigned(n){ n=Number(n)||0; return (n<0?'-':'')+Math.round(Math.abs(n)).toLocaleString('id-ID'); }
function fmtNum(n){ return Number(n||0).toLocaleString('id-ID', {maximumFractionDigits:2}); }
function pct(n){ if(n==null||Number.isNaN(n)) return '–'; return (n*100).toFixed(1)+'%'; }
function uid(p){ return p + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function today(){ return new Date().toISOString().slice(0,10); }
function fv(id){ var e=document.getElementById(id); return e?String(e.value||'').trim():''; }
function icons(){ if(window.lucide) lucide.createIcons(); }
function toast(msg, danger){
  var d=document.createElement('div');
  d.className='fixed left-4 right-4 bottom-5 max-w-[488px] mx-auto text-white text-sm px-4 py-3.5 rounded-2xl shadow-lg z-50 text-center '+(danger?'bg-red-600':'bg-slate-900');
  d.textContent = msg;
  document.getElementById('toastWrap').appendChild(d);
  setTimeout(function(){ d.remove(); }, 2800);
}
function isOwner(){ return !!(STATE.user && STATE.user.role==='owner'); }

function openModal(title, html, onSave){
  document.getElementById('modalBody').innerHTML =
    '<h2 class="text-lg font-bold mb-5">'+esc(title)+'</h2>'+html+
    '<div class="flex justify-end gap-2.5 mt-6">'+
    '<button class="px-4 py-2.5 rounded-xl text-sm font-semibold bg-slate-100 hover:bg-slate-200 transition" id="mCancel">Batal</button>'+
    (onSave?'<button class="px-4 py-2.5 rounded-xl text-sm font-semibold bg-blue-600 hover:bg-blue-700 text-white transition" id="mSave">Simpan</button>':'')+'</div>';
  document.getElementById('modalBack').classList.remove('hidden');
  document.getElementById('modalBack').classList.add('flex');
  document.getElementById('mCancel').onclick = closeModal;
  if(onSave) document.getElementById('mSave').onclick = onSave;
}
function closeModal(){ document.getElementById('modalBack').classList.add('hidden'); document.getElementById('modalBack').classList.remove('flex'); }
function confirmModal(title, msg, onYes){
  openModal(title, '<p class="text-sm text-slate-600">'+msg+'</p>', function(){ closeModal(); onYes(); });
}
var fieldCls = "w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-100 focus:border-blue-500";

/* ---------------- auth ---------------- */
document.getElementById('loginForm').addEventListener('submit', function(e){
  e.preventDefault();
  var username=fv('loginEmail'), password=document.getElementById('loginPassword').value;
  var btn=document.getElementById('loginSubmit'), err=document.getElementById('loginErr');
  err.classList.add('hidden'); btn.disabled=true; btn.textContent='Memproses…';
  apiFetch('/auth_login.php', {method:'POST', body:JSON.stringify({username:username,password:password})})
    .then(function(res){ boot(res.user); })
    .catch(function(e){ err.textContent=e.message||'Login gagal.'; err.classList.remove('hidden'); })
    .finally(function(){ btn.disabled=false; btn.textContent='Masuk'; });
});
function doLogout(){
  apiFetch('/auth_logout.php', {method:'POST'}).catch(function(){}).finally(function(){ location.reload(); });
}
document.getElementById('btnLogout').onclick=doLogout;
document.getElementById('btnLogoutTop').onclick=doLogout;
document.getElementById('mBtnLogout').onclick=doLogout;
document.getElementById('btnOpenSidebar').onclick=function(){ openSidebar(); };
document.getElementById('btnCloseSidebar').onclick=function(){ closeSidebar(); };
document.getElementById('sidebarBackdrop').onclick=function(){ closeSidebar(); };
apiFetch('/auth_me.php').then(function(res){ if(res.user) boot(res.user); }).catch(function(){});

function boot(user){
  STATE.user = user;
  document.getElementById('loginScreen').classList.add('hidden');
  if(user.role==='lapangan'){
    document.getElementById('desktopShell').classList.add('hidden');
    document.getElementById('mobileShell').classList.remove('hidden');
    document.getElementById('mobileShell').classList.add('flex');
    bootMobile(user);
  } else {
    document.getElementById('mobileShell').classList.add('hidden');
    document.getElementById('desktopShell').classList.remove('hidden');
    document.getElementById('desktopShell').style.display='block';
    var roleLabel = {admin:'Admin Pusat',owner:'Owner (read-only)'}[user.role]||user.role;
    document.getElementById('whoInfo').innerHTML = '<div class="font-semibold text-slate-200">'+esc(user.nama)+'</div>'+
      '<div class="mt-0.5">'+roleLabel+'</div>';
    document.getElementById('topbarName').textContent = user.nama;
    document.getElementById('topbarRole').textContent = roleLabel;
    document.getElementById('topbarAvatar').textContent = (user.nama||'?').trim().charAt(0).toUpperCase();
    renderNav();
    icons();
    go('dashboard');
  }
}

/* ============================================================
   DESKTOP SHELL — Admin Pusat / Owner
   ============================================================ */
var NAV=[
  {id:'dashboard', label:'Dashboard', icon:'layout-dashboard'},
  {id:'proyek', label:'Master Proyek', icon:'briefcase'},
  {id:'bahan', label:'Master Bahan', icon:'box'},
  {id:'pekerjaan', label:'Master Pekerjaan (opsional)', icon:'hammer'},
  {id:'rap_proyek', label:'RAP per Proyek', icon:'file-spreadsheet'},
  {id:'rap', label:'RAP per Pekerjaan (detail)', icon:'file-spreadsheet'},
  {id:'riwayat', label:'Riwayat Transaksi', icon:'history'},
  {id:'stock', label:'Monitor Stok', icon:'layers'},
  {id:'rap_proyek_report', label:'Analisis RAP per Proyek', icon:'trending-up'},
  {id:'rap_report', label:'Analisis RAP per Pekerjaan (detail)', icon:'trending-up'},
  {id:'users', label:'Kelola User', icon:'users'},
];
function renderNav(){
  document.getElementById('navList').innerHTML = NAV.map(function(n){
    return '<a data-page="'+n.id+'" class="nav-link flex items-center gap-2.5 mx-3 my-0.5 px-3 py-2.5 rounded-xl text-[13.5px] font-medium cursor-pointer transition-colors">'+
      '<i data-lucide="'+n.icon+'" class="w-4 h-4"></i>'+esc(n.label)+'</a>';
  }).join('');
  document.querySelectorAll('.nav-link').forEach(function(a){
    a.onclick=function(){ go(a.getAttribute('data-page')); closeSidebar(); };
  });
}
function openSidebar(){
  document.getElementById('sidebar').classList.remove('-translate-x-full');
  document.getElementById('sidebarBackdrop').classList.remove('hidden');
}
function closeSidebar(){
  document.getElementById('sidebar').classList.add('-translate-x-full');
  document.getElementById('sidebarBackdrop').classList.add('hidden');
}
function go(page){
  STATE.page=page;
  document.querySelectorAll('.nav-link').forEach(function(a){
    var on = a.getAttribute('data-page')===page;
    a.classList.toggle('bg-blue-600', on);
    a.classList.toggle('text-white', on);
    a.classList.toggle('text-slate-300', !on);
    a.classList.toggle('hover:bg-white/5', !on);
  });
  var c=document.getElementById('content');
  c.innerHTML='';
  (PAGES[page]||function(c){ c.innerHTML='<div class="text-slate-400">Halaman tidak ditemukan.</div>'; })(c);
  icons();
}
function pageHead(title, sub, actionsHTML){
  return '<div class="flex justify-between items-start flex-wrap gap-3 mb-6">'+
    '<div><h1 class="text-xl font-extrabold text-slate-800">'+esc(title)+'</h1>'+(sub?'<div class="text-sm text-slate-500 mt-1">'+esc(sub)+'</div>':'')+'</div>'+
    (actionsHTML?'<div>'+actionsHTML+'</div>':'')+'</div>';
}
var btnPrimary = 'inline-flex items-center gap-1.5 bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold px-4 py-2.5 rounded-xl transition-colors';
var btnGhostSm = 'text-xs font-semibold px-2.5 py-1.5 rounded-lg bg-slate-100 hover:bg-slate-200 transition-colors';
var btnDangerSm = 'text-xs font-semibold px-2.5 py-1.5 rounded-lg bg-red-50 text-red-600 hover:bg-red-100 transition-colors';
function panel(inner){ return '<div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-5">'+inner+'</div>'; }
function badge(kind, label){
  var map={aman:'bg-emerald-50 text-emerald-700', warn:'bg-amber-50 text-amber-700', danger:'bg-red-50 text-red-700', neutral:'bg-slate-100 text-slate-500'};
  return '<span class="text-[11px] font-bold px-2.5 py-1 rounded-full whitespace-nowrap '+(map[kind]||map.neutral)+'">'+esc(label)+'</span>';
}
/* Project filter ("slicer") dropdown, reused across every data menu so
   pusat/owner can narrow any list/report to one proyek without losing
   the free-text search — the two filters combine (AND), never replace
   each other. */
function projectFilterSelectHtml(projects){
  return '<select id="fProj" class="px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-100 min-w-[180px]">'+
    '<option value="">Semua Proyek</option>'+
    projects.map(function(p){ return '<option value="'+esc(p.id)+'">'+esc(p.nama)+'</option>'; }).join('')+
    '</select>';
}

/* ============================================================
   EXPORT — Excel (.xlsx) & PDF, with the same status colors used
   on-screen (conditional formatting), so a report opened outside
   the app still reads Aman/Perlu Dikirim/Habis (or Melebihi RAP)
   at a glance — this is the format owners actually forward around.
   ============================================================ */
var STATUS_STYLE = {
  AMAN:               {xlsxFill:'FFC6EFCE', xlsxFont:'FF006100', bg:'#C6EFCE', fg:'#006100', label:'Aman'},
  MENIPIS:            {xlsxFill:'FFFFEB9C', xlsxFont:'FF9C6500', bg:'#FFEB9C', fg:'#9C6500', label:'Perlu Dikirim'},
  HABIS:              {xlsxFill:'FFFFC7CE', xlsxFont:'FF9C0006', bg:'#FFC7CE', fg:'#9C0006', label:'Stok Habis'},
  HAMPIR_HABIS:       {xlsxFill:'FFFFEB9C', xlsxFont:'FF9C6500', bg:'#FFEB9C', fg:'#9C6500', label:'Hampir Habis RAP'},
  MELEBIHI:           {xlsxFill:'FFFFC7CE', xlsxFont:'FF9C0006', bg:'#FFC7CE', fg:'#9C0006', label:'Melebihi RAP'},
  DATA_TIDAK_LENGKAP: {xlsxFill:'FFF2F2F2', xlsxFont:'FF7F7F7F', bg:'#F2F2F2', fg:'#7F7F7F', label:'Data Tidak Lengkap'},
};

var _exceljsLoading=null;
function loadExcelJS(){
  if(window.ExcelJS) return Promise.resolve();
  if(_exceljsLoading) return _exceljsLoading;
  _exceljsLoading=new Promise(function(resolve,reject){
    var s=document.createElement('script');
    s.src='vendor/exceljs.min.js';
    s.onload=function(){ resolve(); };
    s.onerror=function(){ _exceljsLoading=null; reject(new Error('Gagal memuat modul Excel.')); };
    document.head.appendChild(s);
  });
  return _exceljsLoading;
}

/* headers: string[]; rows: any[][] (numbers stay numbers so Excel can
   sum/sort them); opts.statusCol: index of the column holding the RAW
   status code (AMAN/MENIPIS/…) to color that cell — that column's
   values are swapped for their human label after coloring. */
async function exportExcel(filename, title, headers, rows, opts){
  opts=opts||{};
  try{ await loadExcelJS(); }
  catch(e){ toast('Gagal memuat modul Excel — cek koneksi lalu coba lagi.', true); return; }

  var wb=new ExcelJS.Workbook();
  wb.creator='Material & Stok';
  wb.created=new Date();
  var ws=wb.addWorksheet((opts.sheetName||filename).slice(0,31).replace(/[\\/*?:\[\]]/g,' '));

  var titleRow=ws.addRow([title]);
  titleRow.font={bold:true, size:13, name:'Calibri', color:{argb:'FF1E3A8A'}};
  ws.mergeCells(titleRow.number,1,titleRow.number,Math.max(headers.length,1));
  var subRow=ws.addRow(['Diekspor '+new Date().toLocaleDateString('id-ID',{day:'2-digit',month:'long',year:'numeric'})+' dari Material & Stok']);
  subRow.font={italic:true, size:9.5, name:'Calibri', color:{argb:'FF888888'}};
  ws.mergeCells(subRow.number,1,subRow.number,Math.max(headers.length,1));
  ws.addRow([]);

  var headerRow=ws.addRow(headers);
  headerRow.eachCell(function(cell){
    cell.font={bold:true, color:{argb:'FFFFFFFF'}, name:'Calibri', size:10.5};
    cell.fill={type:'pattern', pattern:'solid', fgColor:{argb:'FF1E3A8A'}};
    cell.alignment={vertical:'middle', horizontal:'center', wrapText:true};
  });
  headerRow.height=20;
  ws.views=[{state:'frozen', ySplit:headerRow.number}];

  var isNumCol=headers.map(function(_,ci){
    return rows.length>0 && rows.every(function(r){ return r[ci]==null || typeof r[ci]==='number'; });
  });

  rows.forEach(function(r, ri){
    var displayRow = r.slice();
    var style = (opts.statusCol!=null) ? STATUS_STYLE[r[opts.statusCol]] : null;
    if(opts.statusCol!=null) displayRow[opts.statusCol] = style ? style.label : r[opts.statusCol];
    var row=ws.addRow(displayRow);
    row.eachCell({includeEmpty:true}, function(cell, ci){
      cell.font={name:'Calibri', size:10.5};
      cell.border={bottom:{style:'hair', color:{argb:'FFE3E7EE'}}};
      if(isNumCol[ci-1]){ cell.numFmt='#,##0.##'; cell.alignment={horizontal:'right'}; }
      else cell.alignment={horizontal:'left'};
      if(ri%2===1) cell.fill={type:'pattern', pattern:'solid', fgColor:{argb:'FFF7F9FC'}};
      if(style && (ci-1)===opts.statusCol){
        cell.fill={type:'pattern', pattern:'solid', fgColor:{argb:style.xlsxFill}};
        cell.font={name:'Calibri', size:10.5, bold:true, color:{argb:style.xlsxFont}};
        cell.alignment={horizontal:'center'};
      }
    });
  });

  headers.forEach(function(h, i){
    var maxLen=String(h).length;
    rows.forEach(function(r){
      var v=(opts.statusCol===i && STATUS_STYLE[r[i]]) ? STATUS_STYLE[r[i]].label : r[i];
      var len=(typeof v==='number')?num0(v).length:String(v==null?'':v).length;
      if(len>maxLen) maxLen=len;
    });
    ws.getColumn(i+1).width=Math.min(Math.max(maxLen+2, 10), 48);
  });

  var buf=await wb.xlsx.writeBuffer();
  var blob=new Blob([buf], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=filename.replace(/\s+/g,'_')+'.xlsx';
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(a.href);
}

/* Same data, rendered as a standalone print-ready page in a new tab —
   uses the browser's own "Save as PDF" (no extra library needed) and
   keeps the status colors via print-color-adjust so they survive
   printing/PDF export, not just on-screen viewing. */
var _jspdfLoading=null;
function loadJsPdf(){
  if(window.jspdf && window.jspdf.jsPDF && window.jspdf.jsPDF.API && window.jspdf.jsPDF.API.autoTable) return Promise.resolve();
  if(_jspdfLoading) return _jspdfLoading;
  _jspdfLoading=new Promise(function(resolve,reject){
    var s1=document.createElement('script');
    s1.src='vendor/jspdf.umd.min.js';
    s1.onload=function(){
      var s2=document.createElement('script');
      s2.src='vendor/jspdf.autotable.min.js';
      s2.onload=function(){ resolve(); };
      s2.onerror=function(){ _jspdfLoading=null; reject(new Error('Gagal memuat modul PDF.')); };
      document.head.appendChild(s2);
    };
    s1.onerror=function(){ _jspdfLoading=null; reject(new Error('Gagal memuat modul PDF.')); };
    document.head.appendChild(s1);
  });
  return _jspdfLoading;
}
function hexToRgb(hex){
  hex = String(hex).replace('#','');
  var n = parseInt(hex,16);
  return [(n>>16)&255, (n>>8)&255, n&255];
}
function filenameFromTitle(title){
  return String(title).replace(/[^a-zA-Z0-9]+/g,'_').replace(/^_+|_+$/g,'') || 'Laporan';
}

/* Real downloadable .pdf (jsPDF + autoTable, self-hosted — no CDN, no
   browser print dialog) with the same status colors as the on-screen
   table and the Excel export, carried through as real cell fills. */
async function exportPdf(title, sub, headers, rows, opts){
  opts=opts||{};
  try{ await loadJsPdf(); }
  catch(e){ toast('Gagal memuat modul PDF — cek koneksi lalu coba lagi.', true); return; }

  var jsPDF = window.jspdf.jsPDF;
  var landscape = headers.length > 6;
  var doc = new jsPDF({orientation: landscape ? 'landscape' : 'portrait', unit:'pt', format:'a4'});

  doc.setFont('helvetica', 'bold'); doc.setFontSize(14); doc.setTextColor(30,58,138);
  doc.text(title, 40, 36);
  if(sub){ doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(100,116,139); doc.text(sub, 40, 52); }

  var body = rows.map(function(r){
    return r.map(function(v, ci){
      var style=(opts.statusCol===ci && STATUS_STYLE[v]) ? STATUS_STYLE[v] : null;
      if(style) return style.label;
      return typeof v==='number' ? num0(v) : (v==null?'':String(v));
    });
  });

  doc.autoTable({
    head: [headers],
    body: body,
    startY: sub ? 64 : 48,
    margin: {left:40, right:40},
    styles: {font:'helvetica', fontSize:8.5, cellPadding:5, textColor:[15,23,42], lineColor:[227,231,238], lineWidth:0.5, overflow:'linebreak'},
    headStyles: {fillColor:[30,58,138], textColor:255, fontStyle:'bold', fontSize:8},
    alternateRowStyles: {fillColor:[247,249,252]},
    didParseCell: function(data){
      if(opts.statusCol!=null && data.section==='body' && data.column.index===opts.statusCol){
        var rawVal = rows[data.row.index][opts.statusCol];
        var style = STATUS_STYLE[rawVal];
        if(style){
          data.cell.styles.fillColor = hexToRgb(style.bg);
          data.cell.styles.textColor = hexToRgb(style.fg);
          data.cell.styles.fontStyle = 'bold';
          data.cell.styles.halign = 'center';
        }
      }
    },
    didDrawPage: function(data){
      var pageSize = doc.internal.pageSize;
      var h = pageSize.getHeight ? pageSize.getHeight() : pageSize.height;
      doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(148,163,184);
      doc.text('Diekspor '+new Date().toLocaleDateString('id-ID',{day:'2-digit',month:'long',year:'numeric'})+' dari Material & Stok',
        40, h-20);
    },
  });

  doc.save(filenameFromTitle(title) + '.pdf');
}

/* ---------------- dashboard (Power-BI style: KPI + charts + drilldown, filterable per proyek) ---------------- */
function statCard(icon, colorCls, label, value, sub){
  return '<div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-5 flex items-start gap-4">'+
    '<div class="w-11 h-11 rounded-xl flex items-center justify-center shrink-0 '+colorCls+'"><i data-lucide="'+icon+'" class="w-5 h-5"></i></div>'+
    '<div><div class="text-2xl font-extrabold text-slate-800 leading-tight">'+value+'</div>'+

    (sub?'<div class="text-xs text-slate-400 mt-1">'+sub+'</div>':'')+'</div></div>';
}
function panelTitle(icon, label, sub){
  return '<h2 class="text-sm font-bold text-slate-600 mb-0.5 flex items-center gap-2"><i data-lucide="'+icon+'" class="w-4 h-4"></i>'+esc(label)+'</h2>'+
    (sub?'<div class="text-xs text-slate-400 mb-3">'+esc(sub)+'</div>':'<div class="mb-3"></div>');
}
/* Status colors are fixed/reserved across the whole app (same as badge()) —
   a chart segment's color always means the same status everywhere, and is
   always paired with a text label/legend, never color alone. */
var STATUS_BAR_COLOR = {AMAN:'#10b981', MENIPIS:'#f59e0b', HABIS:'#ef4444', HAMPIR_HABIS:'#f59e0b', MELEBIHI:'#ef4444', DATA_TIDAK_LENGKAP:'#cbd5e1'};
var STATUS_BAR_LABEL = {AMAN:'Aman', MENIPIS:'Perlu Dikirim', HABIS:'Stok Habis', HAMPIR_HABIS:'Hampir Habis RAP', MELEBIHI:'Melebihi RAP', DATA_TIDAK_LENGKAP:'Data Tidak Lengkap'};
/* Horizontal bar row: label left, filled track right, value as a direct
   label (never color-only) so the number reads even in grayscale/print. */
function hbarRow(label, sublabel, pctWidth, color, valueLabel){
  var w = Math.max(3, Math.min(100, pctWidth));
  return '<div class="py-2">'+
    '<div class="flex justify-between items-baseline gap-2 mb-1">'+
      '<div class="text-sm text-slate-700 truncate"><b>'+esc(label)+'</b>'+(sublabel?' <span class="text-xs text-slate-400">'+esc(sublabel)+'</span>':'')+'</div>'+
      '<div class="text-xs font-bold shrink-0" style="color:'+color+'">'+esc(valueLabel)+'</div>'+
    '</div>'+
    '<div class="h-2 rounded-full bg-slate-100 overflow-hidden"><div class="h-full rounded-full" style="width:'+w+'%;background:'+color+'"></div></div>'+
  '</div>';
}
/* Stacked status bar + legend — a status breakdown is counted, never summed
   across incompatible units, so this works the same whether scoped to one
   proyek or all of them. */
function statusStackChart(counts, order, total){
  if(!total) return '<div class="text-center text-sm text-slate-400 py-8">Belum ada data.</div>';
  var segs = order.filter(function(k){ return counts[k]>0; }).map(function(k){
    var pct = counts[k]/total*100;
    return '<div style="width:'+pct+'%;background:'+STATUS_BAR_COLOR[k]+'" title="'+esc(STATUS_BAR_LABEL[k])+': '+counts[k]+'"></div>';
  }).join('');
  var legend = order.filter(function(k){ return counts[k]>0; }).map(function(k){
    return '<div class="flex items-center gap-1.5 text-xs text-slate-600"><span class="w-2.5 h-2.5 rounded-sm inline-block" style="background:'+STATUS_BAR_COLOR[k]+'"></span>'+esc(STATUS_BAR_LABEL[k])+' <b>'+counts[k]+'</b></div>';
  }).join('');
  return '<div class="flex h-4 rounded-full overflow-hidden gap-[2px] bg-slate-100">'+segs+'</div>'+
    '<div class="flex flex-wrap gap-x-4 gap-y-1.5 mt-3.5">'+legend+'</div>';
}
/* Groups "melebihi RAP" rows by an entity (proyek, or bahan) so the
   dashboard can answer "which proyek/bahan is over" directly, instead
   of a flat ranked list that mixes entities together. Each group is
   sized by its single worst (highest %) row — count alone would make
   a group with one badly-over item look smaller than a group with many
   mildly-over ones, which is backwards for "where's the real risk". */
function groupOverRows(rows, keyFn, nameFn){
  var map = {};
  rows.forEach(function(r){
    var k = keyFn(r);
    if(!map[k]) map[k] = {name:nameFn(r), items:[]};
    map[k].items.push(r);
  });
  var arr = Object.keys(map).map(function(k){
    var g = map[k];
    var worst = g.items.slice().sort(function(a,b){ return b.persentase-a.persentase; })[0];
    return {name:g.name, count:g.items.length, worst:worst};
  });
  arr.sort(function(a,b){ return b.worst.persentase-a.worst.persentase; });
  return arr;
}
function overGroupChart(groups, emptyMsg, sublabelFn, limit){
  if(!groups.length) return '<div class="text-center text-sm text-slate-400 py-8">'+esc(emptyMsg)+'</div>';
  return groups.slice(0,limit||8).map(function(g){
    return hbarRow(g.name, sublabelFn(g), g.worst.persentase*100, STATUS_BAR_COLOR.MELEBIHI, pct(g.worst.persentase));
  }).join('');
}
/* Full drilldown table for "melebihi RAP" — every row, not a capped
   preview, so pusat/owner can see the whole picture without leaving
   the dashboard (the capped 6-item list this replaces was the main
   complaint: it hid how many proyek/bahan were actually over). */
function overDetailTable(rows){
  if(!rows.length) return '<div class="text-center text-sm text-slate-400 py-8">Belum ada bahan yang melebihi RAP ✓ (pastikan RAP per Proyek sudah diisi)</div>';
  var sorted = rows.slice().sort(function(a,b){ return b.persentase-a.persentase; });
  var head = ['Proyek','Bahan','Jatah (RAP)','Aktual Pemakaian','Deviasi','%'];
  return '<div class="overflow-x-auto -mx-5 px-5"><table class="w-full text-sm">'+
    '<thead><tr class="border-b border-slate-200">'+head.map(function(h){ return '<th class="text-left text-[11px] font-bold uppercase tracking-wide text-slate-400 py-2.5 pr-4 whitespace-nowrap">'+esc(h)+'</th>'; }).join('')+'</tr></thead>'+
    '<tbody>'+sorted.map(function(r){
      return '<tr class="border-b border-slate-100 hover:bg-slate-50">'+
        '<td class="py-2.5 pr-4">'+esc(r.project_nama)+'</td>'+
        '<td class="py-2.5 pr-4"><b>'+esc(r.material_nama)+'</b></td>'+
        '<td class="py-2.5 pr-4">'+num0(r.rap_qty)+' '+esc(r.satuan)+'</td>'+
        '<td class="py-2.5 pr-4">'+num0(r.aktual_pemakaian)+' '+esc(r.satuan)+'</td>'+
        '<td class="py-2.5 pr-4"><b class="text-red-600">+'+num0(r.deviasi)+'</b></td>'+
        '<td class="py-2.5 pr-4"><b class="text-red-600">'+pct(r.persentase)+'</b></td>'+
      '</tr>';
    }).join('')+'</tbody></table></div>';
}

      var stockPrev=document.getElementById('stockPreview');
      stockPrev.innerHTML = critical.length ? panel(critical.slice(0,6).map(function(r){
        return '<div class="flex justify-between items-center py-2.5 border-b border-slate-100 last:border-0 text-sm">'+
          '<div><b>'+esc(r.material_nama)+'</b>'+(projId?'':'<div class="text-xs text-slate-400">'+esc(r.project_nama)+'</div>')+'</div>'+
          badge(r.status==='HABIS'?'danger':'warn', r.status==='HABIS'?'Habis':'Perlu Dikirim')+'</div>';
      }).join('')) : panel('<div class="text-center text-sm text-slate-400 py-6">Semua stok aman ✓</div>');

      document.getElementById('overTable').innerHTML = overDetailTable(over);

      // Group stale-usage rows by project — one line per project naming
      // which bahan are affected, so pusat knows exactly who to follow up.
      var staleRows = stock.filter(function(s){ return s.usage_stale; });
      var staleMap = {};
      staleRows.forEach(function(r){
        if(!staleMap[r.project_id]) staleMap[r.project_id] = {name:r.project_nama, items:[]};
        staleMap[r.project_id].items.push(r.material_nama);
      });
      var staleByProject = Object.keys(staleMap).map(function(k){ return staleMap[k]; })
        .sort(function(a,b){ return b.items.length-a.items.length; });
      var stalePanel = document.getElementById('staleUsagePanel');
      stalePanel.innerHTML = staleByProject.length ? staleByProject.map(function(g){
        var names = g.items.slice(0,4).join(', ') + (g.items.length>4?' +'+(g.items.length-4)+' lagi':'');
        return '<div class="flex justify-between items-center py-2.5 border-b border-slate-100 last:border-0 text-sm gap-3">'+
          '<div class="min-w-0"><b>'+esc(g.name)+'</b><div class="text-xs text-slate-400 truncate">'+esc(names)+'</div></div>'+
          badge('warn', g.items.length+' bahan')+'</div>';
      }).join('') : '<div class="text-center text-sm text-slate-400 py-6">Semua proyek rutin update Pemakaian ✓</div>';
      icons();
    }
    render();
    document.getElementById('dashProj').addEventListener('change', render);
  }).catch(function(e){ document.getElementById('statGrid').innerHTML='<div class="col-span-full text-center text-sm text-red-500 py-8">Gagal memuat: '+esc(e.message)+'</div>'; });
};

/* ---------------- generic read-only report page (search + project filter + export) ---------------- */
function reportPage(cfg){
  return function(c){
    c.innerHTML = pageHead(cfg.title, cfg.sub, exportBtnsHtml()) +
      panel(
        '<div class="flex justify-between items-center mb-4 gap-3 flex-wrap">'+
          '<div class="flex items-center gap-3 flex-wrap flex-1">'+
          '<div class="relative flex-1 min-w-[220px] max-w-xs"><i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2"></i>'+
          '<input type="text" id="q" placeholder="'+esc(cfg.searchPlaceholder)+'" class="w-full pl-9 pr-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-100"></div>'+
          '<select id="fProj" class="px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-100 min-w-[180px]"><option value="">Semua Proyek</option></select>'+
          '</div>'+
          '<span class="text-xs text-slate-400" id="cnt"></span>'+
        '</div>'+
        '<div class="overflow-x-auto -mx-5 px-5"><table class="w-full text-sm" id="tbl"></table></div>'
      );
    icons();
    var rows=[], filteredList=[];
    var STATUS_COL = cfg.statusCol!=null ? cfg.statusCol : null;
    function draw(){
      var q=fv('q').toLowerCase(), projId=fv('fProj');
      filteredList = rows.filter(function(r){
        if(q && cfg.searchFn(r).toLowerCase().indexOf(q)===-1) return false;
        if(projId && r.project_id!==projId) return false;
        return true;
      });
      var list=filteredList;
      document.getElementById('cnt').textContent=list.length+' data';
      document.getElementById('tbl').innerHTML='<thead><tr class="border-b border-slate-200">'+cfg.columns.map(function(cl){ return '<th class="text-left text-[11px] font-bold uppercase tracking-wide text-slate-400 py-2.5 pr-4 whitespace-nowrap">'+esc(cl.label)+'</th>'; }).join('')+'</tr></thead>'+
        '<tbody>'+(list.length?list.map(function(r){ return '<tr class="border-b border-slate-100 hover:bg-slate-50">'+cfg.columns.map(function(cl){ return '<td class="py-2.5 pr-4">'+cl.get(r)+'</td>'; }).join('')+'</tr>'; }).join(''):
        '<tr><td colspan="'+cfg.columns.length+'" class="text-center text-slate-400 text-sm py-10">'+esc(cfg.emptyMsg)+'</td></tr>')+'</tbody>';
      bindExportBtns(cfg.filename, cfg.title, cfg.sub, cfg.columns.map(function(cl){ return cl.label; }),
        function(){ return filteredList.map(cfg.exportRow); }, STATUS_COL);
    }
    apiFetch(cfg.endpoint).then(function(data){
      rows=data;
      var seen={}, opts=[];
      rows.forEach(function(r){ if(r.project_id && !seen[r.project_id]){ seen[r.project_id]=1; opts.push({id:r.project_id, nama:r.project_nama}); } });
      opts.sort(function(a,b){ return a.nama.localeCompare(b.nama); });
      document.getElementById('fProj').innerHTML = '<option value="">Semua Proyek</option>'+
        opts.map(function(p){ return '<option value="'+esc(p.id)+'">'+esc(p.nama)+'</option>'; }).join('');
      draw();
      document.getElementById('q').addEventListener('input',draw);
      document.getElementById('fProj').addEventListener('change',draw);
    }).catch(function(e){ toast('Gagal memuat: '+e.message, true); });
  };
}

PAGES.users = function(c){

    c.innerHTML = pageHead('Kelola User','') + panel('<div class="text-sm text-slate-500">Hanya Admin Pusat yang bisa mengelola user.</div>');

  }
  c.innerHTML = pageHead('Kelola User', 'Admin Lapangan hanya bisa input Bahan Masuk & Pemakaian, dibatasi ke proyek yang ditugaskan.',
    '<button class="'+btnPrimary+'" id="btnAdd"><i data-lucide="plus" class="w-4 h-4"></i>User</button>') +

      '<div class="flex justify-between items-center mb-4 gap-3 flex-wrap">'+
        '<div class="flex items-center gap-3 flex-wrap flex-1">'+
        '<div class="relative flex-1 min-w-[220px] max-w-xs"><i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2"></i>'+
        '<input type="text" id="q" placeholder="Cari nama / username…" class="w-full pl-9 pr-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-100"></div>'+
        '<select id="fProj" class="px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-100 min-w-[200px]"><option value="">Semua Proyek</option></select>'+

  var rows=[], projects=[];
  var cols=[
    {label:'Nama', get:function(r){ return '<b>'+esc(r.nama)+'</b>'; }},
    {label:'Username', get:function(r){ return esc(r.username); }},
    {label:'Role', get:function(r){ return {admin:'Admin Pusat',owner:'Owner',lapangan:'Admin Lapangan'}[r.role]||esc(r.role); }},
    {label:'Proyek Ditugaskan', get:function(r){
      if(r.role!=='lapangan') return '<span class="text-slate-300 italic">Semua (akses penuh)</span>';
      var names=(r.projectIds||[]).map(function(id){ var p=projects.find(function(x){ return x.id===id; }); return p?p.nama:id; });
      return names.length?esc(names.join(', ')):'<span class="text-slate-300 italic">Belum ada proyek</span>';
    }},

      return '<button class="'+btnGhostSm+'" data-edit="'+esc(r.id)+'">Edit</button> '+
        '<button class="'+btnDangerSm+'" data-del="'+esc(r.id)+'">Hapus</button>';
    }},
  ];
  function draw(){
    var q=fv('q').toLowerCase(), projId=fv('fProj');
    var list=rows.filter(function(r){
      if(q && (r.nama+' '+r.username).toLowerCase().indexOf(q)===-1) return false;
      if(projId && (r.projectIds||[]).indexOf(projId)===-1) return false;
      return true;
    });
    document.getElementById('cnt').textContent=list.length+' user';
    document.getElementById('tbl').innerHTML='<thead><tr class="border-b border-slate-200">'+cols.map(function(cl){ return '<th class="text-left text-[11px] font-bold uppercase tracking-wide text-slate-400 py-2.5 pr-4 whitespace-nowrap">'+esc(cl.label)+'</th>'; }).join('')+'</tr></thead>'+
      '<tbody>'+(list.length?list.map(function(r){ return '<tr class="border-b border-slate-100 hover:bg-slate-50">'+cols.map(function(cl){ return '<td class="py-2.5 pr-4">'+cl.get(r)+'</td>'; }).join('')+'</tr>'; }).join(''):

    document.querySelectorAll('[data-del]').forEach(function(b){ b.onclick=function(){ del(b.getAttribute('data-del')); }; });
  }
  function refresh(){
    Promise.all([apiFetch('/users.php'), apiFetch('/projects.php')]).then(function(r){
      rows=r[0]; projects=r[1];
      document.getElementById('fProj').innerHTML = '<option value="">Semua Proyek</option>'+
        projects.slice().sort(function(a,b){ return a.nama.localeCompare(b.nama); }).map(function(p){ return '<option value="'+esc(p.id)+'">'+esc(p.nama)+'</option>'; }).join('');
      draw();
    }).catch(function(e){ toast('Gagal memuat: '+e.message, true); });
  }
  function del(id){
    confirmModal('Hapus User', 'Yakin mau menghapus user ini?', function(){
      apiFetch('/users.php?id='+encodeURIComponent(id), {method:'DELETE'})
        .then(function(){ toast('User dihapus.'); refresh(); }).catch(function(e){ toast('Gagal menghapus: '+e.message, true); });
    });
  }
  function form(id){
    var rec = id ? rows.find(function(x){ return x.id===id; }) : null;
    var html =
      '<div class="space-y-4">'+
      '<div><label class="block text-xs font-semibold text-slate-500 mb-1.5">Nama *</label><input id="f_nama" value="'+esc(rec?rec.nama:'')+'" class="'+fieldCls+'"></div>'+

      '<div><label class="block text-xs font-semibold text-slate-500 mb-1.5">Role *</label><select id="f_role" class="'+fieldCls+'">'+
        ['lapangan','admin','owner'].map(function(r){ return '<option value="'+r+'"'+(rec&&rec.role===r?' selected':'')+'>'+
          {admin:'Admin Pusat',owner:'Owner',lapangan:'Admin Lapangan'}[r]+'</option>'; }).join('')+
      '</select></div>'+
      '<div><label class="block text-xs font-semibold text-slate-500 mb-1.5">Password '+(id?'(kosongkan jika tidak diubah)':'*')+'</label><input id="f_password" type="password" placeholder="Min. 10 karakter" class="'+fieldCls+'"></div>'+
      '<div><label class="block text-xs font-semibold text-slate-500 mb-1.5">Proyek yang Ditugaskan (khusus Admin Lapangan)</label>'+
        '<select id="f_projectIds" multiple size="6" class="'+fieldCls+'">'+
          projects.map(function(p){ return '<option value="'+esc(p.id)+'"'+((rec&&rec.projectIds||[]).indexOf(p.id)>-1?' selected':'')+'>'+esc(p.nama)+'</option>'; }).join('')+
        '</select><div class="text-xs text-slate-400 mt-1">Ctrl/Cmd+klik untuk pilih lebih dari satu.</div></div>'+
      '</div>';
    openModal((id?'Edit ':'Tambah ')+'User', html, function(){
      var nama=fv('f_nama'), username=fv('f_username'), role=fv('f_role'), password=fv('f_password');
      if(!nama||!username){ toast('Nama dan username wajib diisi.', true); return; }
      if(!id && password.length<10){ toast('Password minimal 10 karakter.', true); return; }
      var projectIds=Array.from(document.getElementById('f_projectIds').selectedOptions).map(function(o){ return o.value; });
      apiFetch('/users.php', {method:'POST', body:JSON.stringify({id:id||'', nama:nama, username:username, role:role, password:password, projectIds:projectIds})})
        .then(function(){ closeModal(); toast(id?'User diperbarui.':'User ditambahkan.'); refresh(); })
        .catch(function(e){ toast('Gagal menyimpan: '+e.message, true); });
    });
  }
  refresh();
  document.getElementById('q').addEventListener('input', draw);
  document.getElementById('fProj').addEventListener('change', draw);
  document.getElementById('btnAdd').onclick=function(){ form(null); };
};

var TAB_ICONS = {masuk:'truck', pakai:'hammer', stok:'layers', riwayat:'history'};

function bootMobile(user){
  document.getElementById('mWhoName').textContent = user.nama;
  document.getElementById('mWhoRole').textContent = 'Admin Lapangan';

  Promise.all([
    apiFetch('/projects.php'),
    apiFetch('/materials.php'),
    apiFetch('/pekerjaan.php'),
  ]).then(function(r){
    var allProjects = r[0], allPekerjaan = r[2];
    STATE.materials = r[1];
    if(Array.isArray(user.projectIds)){
      var scope = user.projectIds;
      STATE.projects = allProjects.filter(function(p){ return scope.indexOf(p.id) > -1; });
    } else {
      STATE.projects = allProjects;
    }
    STATE.pekerjaanAll = allPekerjaan;
    if(!STATE.projects.length){
      document.getElementById('mProjSel').innerHTML =
        '<div class="bg-white rounded-2xl p-6 text-center text-sm text-slate-400 shadow-sm border border-slate-200">Belum ada proyek yang ditugaskan ke akun Anda.<br>Hubungi Admin Pusat.</div>';
      return;
    }
    STATE.projectId = STATE.projects[0].id;
    renderProjSel();
    renderTabs();
    renderTab();
  }).catch(function(e){ toast('Gagal memuat data: ' + e.message, true); });
}

function renderProjSel(){
  var el = document.getElementById('mProjSel');
  if(STATE.projects.length <= 1){
    el.innerHTML = STATE.projects.length ?
      '<div class="bg-white rounded-2xl px-4 py-3 shadow-sm border border-slate-200 flex items-center gap-2.5">'+
      '<i data-lucide="building-2" class="w-4 h-4 text-emerald-600"></i>'+
      '<span class="font-bold text-[15px]">'+esc(STATE.projects[0].nama)+'</span></div>' : '';
    icons();
    return;
  }
  el.innerHTML =
    '<div class="relative">'+
    '<select id="projPick" class="w-full appearance-none bg-white border border-slate-200 rounded-2xl px-4 py-3.5 pr-10 font-bold text-[15px] shadow-sm focus:outline-none focus:ring-2 focus:ring-emerald-100">'+
    STATE.projects.map(function(p){ return '<option value="'+esc(p.id)+'"'+(p.id===STATE.projectId?' selected':'')+'>'+esc(p.nama)+'</option>'; }).join('') +
    '</select>'+
    '<i data-lucide="chevron-down" class="w-4 h-4 text-slate-400 absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none"></i>'+
    '</div>';
  document.getElementById('projPick').onchange = function(e){ STATE.projectId = e.target.value; renderTab(); };
  icons();
}

function pekerjaanForProject(){
  return (STATE.pekerjaanAll||[]).filter(function(pk){ return pk.project_id === STATE.projectId; });
}

var TABS = [
  {id:'masuk', label:'Bahan Masuk'},
  {id:'pakai', label:'Pemakaian'},
  {id:'stok', label:'Stok'},
  {id:'riwayat', label:'Riwayat'},
];
function renderTabs(){
  document.getElementById('mTabs').innerHTML = TABS.map(function(t){
    var on = t.id===STATE.tab;
    return '<button data-tab="'+t.id+'" class="flex-none flex items-center gap-1.5 px-4 py-2.5 rounded-full text-[13px] font-bold whitespace-nowrap transition-colors '+
      (on ? 'bg-emerald-600 text-white shadow-sm shadow-emerald-200' : 'bg-white text-slate-500 border border-slate-200') + '">'+
      '<i data-lucide="'+TAB_ICONS[t.id]+'" class="w-3.5 h-3.5"></i>'+esc(t.label)+'</button>';
  }).join('');
  document.querySelectorAll('#mTabs [data-tab]').forEach(function(b){
    b.onclick = function(){ STATE.tab = b.getAttribute('data-tab'); renderTabs(); renderTab(); };
  });
  icons();
}

function renderTab(){
  var c = document.getElementById('mContent');
  if(STATE.tab === 'masuk') return renderInputForm(c, 'masuk');
  if(STATE.tab === 'pakai') return renderInputForm(c, 'pakai');
  if(STATE.tab === 'stok') return renderStok(c);
  if(STATE.tab === 'riwayat') return renderRiwayat(c);
}

function card(inner, extraCls){ return '<div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200 mb-3.5 '+(extraCls||'')+'">'+inner+'</div>'; }
function fieldWrap(label, inputHtml){
  return '<div class="mb-4"><label class="block text-xs font-bold text-slate-500 mb-1.5">'+esc(label)+'</label>'+inputHtml+'</div>';
}
var inputCls = "w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-[15px] focus:outline-none focus:ring-2 focus:ring-emerald-100 focus:border-emerald-500";

function materialOptions(selected, query){
  var list = STATE.materials;
  if(query) list = list.filter(function(m){ return (m.nama+' '+m.kode).toLowerCase().indexOf(query.toLowerCase())>-1; });
  if(!list.length) return '<option value="">— Tidak ditemukan —</option>';
  return list.map(function(m){
    return '<option value="'+esc(m.id)+'"'+(m.id===selected?' selected':'')+'>'+esc(m.nama)+' ('+esc(m.satuan)+')</option>';
  }).join('');
}
function pekerjaanOptions(selected){
  var list = pekerjaanForProject();
  if(!list.length) return '<option value="">— Tidak ada pekerjaan terdaftar —</option>';
  return '<option value="">— Pilih pekerjaan (opsional) —</option>' + list.map(function(pk){
    return '<option value="'+esc(pk.id)+'"'+(pk.id===selected?' selected':'')+'>'+esc(pk.nama)+'</option>';
  }).join('');
}

function renderInputForm(c, mode){
  var isMasuk = mode === 'masuk';
  var accent = isMasuk ? 'emerald' : 'amber';
  if(!STATE.materials.length){
    c.innerHTML = card('<div class="text-center text-sm text-slate-400 py-4">Belum ada Master Material.<br>Hubungi Admin Pusat untuk menambahkan.</div>');
    return;
  }
  c.innerHTML = card(
    '<div class="flex items-center gap-2.5 mb-5">'+
      '<div class="w-9 h-9 rounded-xl bg-'+accent+'-50 text-'+accent+'-600 flex items-center justify-center"><i data-lucide="'+(isMasuk?'truck':'hammer')+'" class="w-4.5 h-4.5"></i></div>'+
      '<h3 class="font-bold text-[15px]">'+(isMasuk?'Catat Bahan Masuk':'Catat Pemakaian Bahan')+'</h3>'+
    '</div>'+
    fieldWrap('Tanggal', '<input type="date" id="f_tgl" value="'+today()+'" class="'+inputCls+'">')+
    fieldWrap('Material', '<input type="text" id="f_material_q" placeholder="Ketik untuk mencari bahan…" class="'+inputCls+' mb-2">'+
      '<select id="f_material" class="'+inputCls+'">'+materialOptions()+'</select>')+
    (isMasuk ? '' : fieldWrap('Pekerjaan (untuk analisis RAP)', '<select id="f_pekerjaan" class="'+inputCls+'">'+pekerjaanOptions()+'</select>'))+
    fieldWrap('Jumlah (Qty)', '<input type="number" id="f_qty" inputmode="decimal" min="0" step="any" placeholder="0" class="'+inputCls+'">')+
    (isMasuk ? fieldWrap('No. Surat Jalan / Nota', '<input type="text" id="f_ref" placeholder="Opsional" class="'+inputCls+'">') : '')+
    fieldWrap('Keterangan', '<input type="text" id="f_ket" placeholder="Opsional" class="'+inputCls+'">')+
    '<button id="f_save" class="w-full bg-'+accent+'-600 hover:bg-'+accent+'-700 active:scale-[.98] transition text-white font-bold py-3.5 rounded-xl text-[15px] mt-1">'+
      (isMasuk?'Simpan Bahan Masuk':'Simpan Pemakaian')+'</button>'
  );
  icons();
  document.getElementById('f_save').onclick = function(){ submitInput(mode); };
  document.getElementById('f_material_q').addEventListener('input', function(e){
    var sel = document.getElementById('f_material');
    var current = sel.value;
    sel.innerHTML = materialOptions(current, e.target.value);
  });
}

function submitInput(mode){
  var qty = parseFloat(document.getElementById('f_qty').value);
  var materialId = document.getElementById('f_material').value;
  if(!materialId){ toast('Pilih material.', true); return; }
  if(!qty || qty <= 0){ toast('Isi jumlah (qty) yang valid.', true); return; }

  var btn = document.getElementById('f_save');
  btn.disabled = true; btn.textContent = 'Menyimpan…';

  var payload, endpoint;
  if(mode === 'masuk'){
    payload = {
      id: uid('mr_'), project_id: STATE.projectId, material_id: materialId,
      tgl: document.getElementById('f_tgl').value || today(),
      qty: qty,
      no_referensi: document.getElementById('f_ref').value || '',
      ket: document.getElementById('f_ket').value || '',
    };
    endpoint = '/material_receipts.php';
  } else {
    payload = {
      id: uid('mu_'), project_id: STATE.projectId, material_id: materialId,
      pekerjaan_id: document.getElementById('f_pekerjaan').value || null,
      tgl: document.getElementById('f_tgl').value || today(),
      qty: qty, ket: document.getElementById('f_ket').value || '',
    };
    endpoint = '/material_usage.php';
  }

  apiFetch(endpoint, {method:'POST', body:JSON.stringify(payload)})
    .then(function(){
      toast('Tersimpan.');
      renderTab();
    })
    .catch(function(e){ toast('Gagal menyimpan: ' + e.message, true); })
    .finally(function(){ if(btn){ btn.disabled=false; btn.textContent = mode==='masuk'?'Simpan Bahan Masuk':'Simpan Pemakaian'; } });
}

function statusBadge(status){
  var map = {
    AMAN:['bg-emerald-50 text-emerald-700','Aman'],
    MENIPIS:['bg-amber-50 text-amber-700','Perlu Dikirim'],
    HABIS:['bg-red-50 text-red-700','Stok Habis'],
    MELEBIHI:['bg-red-50 text-red-700','Melebihi RAP'],
    HAMPIR_HABIS:['bg-amber-50 text-amber-700','Hampir Habis RAP'],
    DATA_TIDAK_LENGKAP:['bg-slate-100 text-slate-500','Data Tidak Lengkap'],
  };
  var m = map[status] || ['bg-slate-100 text-slate-500', status];
  return '<span class="text-[11px] font-bold px-2.5 py-1 rounded-full whitespace-nowrap '+m[0]+'">'+esc(m[1])+'</span>';
}

function renderStok(c){
  c.innerHTML = card('<div class="text-center text-sm text-slate-400 py-4">Memuat stok…</div>');
  apiFetch('/material_stock.php').then(function(rows){
    var mine = rows.filter(function(r){ return r.project_id === STATE.projectId; });
    if(!mine.length){ c.innerHTML = card('<div class="text-center text-sm text-slate-400 py-4">Belum ada data bahan masuk/pemakaian untuk proyek ini.</div>'); return; }
    c.innerHTML = mine.map(function(r){
      return card(
        '<div class="flex items-start justify-between gap-3">'+
          '<div><div class="font-bold text-[15px]">'+esc(r.material_nama)+'</div>'+
          '<div class="text-xs text-slate-400 mt-0.5">Masuk '+fmtNum(r.total_masuk)+' · Keluar '+fmtNum(r.total_keluar)+' '+esc(r.satuan)+'</div></div>'+
          statusBadge(r.status)+
        '</div>'+
        '<div class="text-2xl font-extrabold mt-3">'+fmtNum(r.stok)+' <span class="text-sm font-medium text-slate-400">'+esc(r.satuan)+'</span></div>'
      );
    }).join('');
  }).catch(function(e){ c.innerHTML = card('<div class="text-center text-sm text-red-500 py-4">Gagal memuat: '+esc(e.message)+'</div>'); });
}

/* Riwayat — one tidy table (not a card list): Tanggal, Jenis, Bahan,
   Qty, Referensi/Pekerjaan, Keterangan, Aksi. Scrolls horizontally on
   narrow phones rather than losing columns. */
function renderRiwayat(c){
  c.innerHTML = card('<div class="text-center text-sm text-slate-400 py-4">Memuat riwayat…</div>');
  Promise.all([apiFetch('/material_receipts.php'), apiFetch('/material_usage.php')]).then(function(r){
    var matName = function(id){ var m = STATE.materials.find(function(x){ return x.id===id; }); return m ? m.nama : id; };
    var pkName = function(id){ var pk=(STATE.pekerjaanAll||[]).find(function(x){ return x.id===id; }); return pk?pk.nama:''; };
    var allMasuk = r[0].filter(function(x){ return x.project_id === STATE.projectId; })
      .map(function(x){ return {jenis:'Masuk', tgl:x.tgl, material_id:x.material_id, qty:Number(x.qty)||0, ref:x.no_referensi||'', ket:x.ket||'', id:x.id}; });
    var allPakai = r[1].filter(function(x){ return x.project_id === STATE.projectId; })
      .map(function(x){ return {jenis:'Pemakaian', tgl:x.tgl, material_id:x.material_id, qty:Number(x.qty)||0, ref:x.pekerjaan_id?pkName(x.pekerjaan_id):'', ket:x.ket||'', id:x.id}; });
    var all = allMasuk.concat(allPakai).sort(function(a,b){ return a.tgl<b.tgl?1:(a.tgl>b.tgl?-1:0); });

    c.innerHTML = card(
      '<div class="mb-3"><input type="text" id="rw_q" placeholder="Cari nama bahan…" class="'+inputCls+' mb-2.5"></div>'+
      '<div class="grid grid-cols-2 gap-2.5 mb-1">'+
        '<div><label class="block text-[11px] font-bold text-slate-500 mb-1">Dari Tanggal</label><input type="date" id="rw_from" class="'+inputCls+' text-sm"></div>'+
        '<div><label class="block text-[11px] font-bold text-slate-500 mb-1">Sampai Tanggal</label><input type="date" id="rw_to" class="'+inputCls+' text-sm"></div>'+
      '</div>'
    ) + '<div id="rw_tbl_wrap"></div>';

    function applyFilter(){
      var q=fv('rw_q').toLowerCase(), from=fv('rw_from'), to=fv('rw_to');
      return all.filter(function(x){
        if(from && x.tgl<from) return false;
        if(to && x.tgl>to) return false;
        if(q && matName(x.material_id).toLowerCase().indexOf(q)===-1) return false;
        return true;
      });
    }
    function draw(){
      var list = applyFilter().slice(0, 60);
      var thead = '<thead><tr class="border-b border-slate-200">'+
        ['Tgl','Jenis','Bahan','Qty','Ref/Pekerjaan','Ket',''].map(function(h){ return '<th class="text-left text-[10px] font-bold uppercase tracking-wide text-slate-400 py-2 pr-3 whitespace-nowrap">'+esc(h)+'</th>'; }).join('')+
        '</tr></thead>';
      var tbody = '<tbody>'+(list.length ? list.map(function(x){
        var kind = x.jenis==='Masuk' ? 'masuk' : 'pakai';
        return '<tr class="border-b border-slate-100">'+
          '<td class="py-2 pr-3 text-[13px] whitespace-nowrap">'+esc(x.tgl)+'</td>'+
          '<td class="py-2 pr-3">'+(x.jenis==='Masuk'?'<span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-emerald-50 text-emerald-700 whitespace-nowrap">Masuk</span>':'<span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-amber-50 text-amber-700 whitespace-nowrap">Pakai</span>')+'</td>'+
          '<td class="py-2 pr-3 text-[13px] font-semibold">'+esc(matName(x.material_id))+'</td>'+
          '<td class="py-2 pr-3 text-[13px] font-bold whitespace-nowrap '+(x.jenis==='Masuk'?'text-emerald-600':'text-amber-600')+'">'+(x.jenis==='Masuk'?'+':'−')+fmtNum(x.qty)+'</td>'+
          '<td class="py-2 pr-3 text-[12px] text-slate-500">'+(x.ref?esc(x.ref):'<span class="text-slate-300">–</span>')+'</td>'+
          '<td class="py-2 pr-3 text-[12px] text-slate-500">'+(x.ket?esc(x.ket):'<span class="text-slate-300">–</span>')+'</td>'+
          '<td class="py-2 pr-1"><button data-del="'+kind+'" data-id="'+esc(x.id)+'" class="text-slate-300 hover:text-red-600 transition"><i data-lucide="trash-2" class="w-4 h-4"></i></button></td>'+
        '</tr>';
      }).join('') : '<tr><td colspan="7" class="text-center text-slate-400 text-sm py-8">Tidak ada data.</td></tr>')+'</tbody>';
      document.getElementById('rw_tbl_wrap').innerHTML = card('<div class="overflow-x-auto -mx-1 px-1"><table class="w-full">'+thead+tbody+'</table></div>');
      icons();
      c.querySelectorAll('[data-del]').forEach(function(b){
        b.onclick = function(){
          if(!confirm('Hapus data ini?')) return;
          var endpoint = b.getAttribute('data-del') === 'masuk' ? '/material_receipts.php' : '/material_usage.php';
          apiFetch(endpoint + '?id=' + encodeURIComponent(b.getAttribute('data-id')), {method:'DELETE'})
            .then(function(){ toast('Data dihapus.'); renderRiwayat(c); })
            .catch(function(e){ toast('Gagal menghapus: ' + e.message, true); });
        };
      });
    }
    icons();
    draw();
    document.getElementById('rw_q').addEventListener('input', draw);
    document.getElementById('rw_from').addEventListener('change', draw);
    document.getElementById('rw_to').addEventListener('change', draw);
  }).catch(function(e){ c.innerHTML = card('<div class="text-center text-sm text-red-500 py-4">Gagal memuat: '+esc(e.message)+'</div>'); });
}
</script>
</body>
</html>
