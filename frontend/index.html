<style>
  /* Platform-native font stack, not a self-hosted webfont: Inter was
     referenced here but never actually loaded (no @font-face), so the
     app was silently falling back to this exact stack anyway. Keeping
     it explicit avoids a wasted download on a system whose own UI font
     (San Francisco / Segoe UI / Roboto) already renders crisp and
     reads as "native", which matters more for field reliability than
     brand-matching every pixel. */
  body{font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif; -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;}
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:8px;}
  table{border-collapse:collapse;}
  #mobileShell{max-width:560px;margin:0 auto;}
  .tab-scroll::-webkit-scrollbar{display:none;}
  /* Hides the native up/down spinner so a clear (×) button can sit in
     that same corner of a number input without overlapping it. */
  input.no-spinner::-webkit-outer-spin-button, input.no-spinner::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }
  input.no-spinner{ -moz-appearance:textfield; }
</style>
</head>

<script src="backend-config.js"></script>
<script>
/* ============================================================
   Material & Stok — single-file frontend. One login gate, two
   shells (desktop sidebar for admin/owner, mobile tabs for admin
   lapangan) picked at runtime by the logged-in user's role, so
   there is exactly one HTML file to redeploy on every revision.
   Plain fetch, no build step, no framework.
   ============================================================ */
var STATE = { user:null, page:'dashboard', cache:{}, projects:[], materials:[], pekerjaanAll:[], projectId:null, tab:'masuk', pendingFilter:null };
/* Lets a dashboard panel row ("Besi — RS Cirebon perlu dikirim") jump
   straight to the detail page already filtered to that row, instead of
   landing on an unfiltered list the user has to re-search by hand. The
   target page's own load() picks this up once (see reportPage) and
   clears it, so navigating there again normally isn't sticky. */
function goFiltered(page, filter){
  STATE.pendingFilter = filter || null;
  go(page);
}
/* Delegated click handler for any element marked data-nav-page (dashboard
   chart bars, table rows, list items) — avoids re-wiring listeners every
   time a panel re-renders, since the markup is just data attributes. */
document.addEventListener('click', function(e){
  var el = e.target.closest ? e.target.closest('[data-nav-page]') : null;
  if(!el) return;
  goFiltered(el.getAttribute('data-nav-page'), {
    projId: el.getAttribute('data-nav-projid') || null,
    q: el.hasAttribute('data-nav-q') ? el.getAttribute('data-nav-q') : null,
  });
});

/* ---------------- shared helpers ---------------- */
function apiFetch(path, opts){
  opts = opts || {};
  opts.credentials = 'include';
  opts.headers = Object.assign({'Content-Type':'application/json'}, opts.headers||{});
  return fetch((window.API_BASE_URL||'') + path, opts).then(async function(res){
    var data = {}; try{ data = await res.json(); }catch(e){}
    if(!res.ok){
      var err = new Error(data.error || ('HTTP '+res.status));
      err.status = res.status;
      throw err;
    }
    return data;
  }, function(){
    var err = new Error('Tidak ada koneksi ke server.');
    err.network = true;
    throw err;
  });
}

/* ---------------- offline support (Admin Lapangan) ----------------
   Input saved while there is no signal waits in a local outbox and is sent
   in order once the connection returns. Each record keeps the id it was
   created with, and the server upserts by id, so a resend after a timeout
   cannot duplicate a row. Master data and the signed-in user are cached on
   the device (and cleared on logout) so the input screens still open. */
var OUTBOX_KEY = 'ms_outbox', MASTERS_KEY = 'ms_masters', USER_KEY = 'ms_user';
function lsGet(key, fallback){ try{ var v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }catch(e){ return fallback; } }
function lsSet(key, value){ try{ localStorage.setItem(key, JSON.stringify(value)); }catch(e){} }
function outboxGet(){ return lsGet(OUTBOX_KEY, []); }
function outboxSet(list){ lsSet(OUTBOX_KEY, list); updateSyncBadge(); }
function outboxAdd(item){ var l = outboxGet(); l.push(item); outboxSet(l); }
function updateSyncBadge(){
  var el = document.getElementById('mSync'); if(!el) return;
  var n = outboxGet().length;
  if(n){
    el.className = 'text-[11px] font-bold px-2.5 py-1 rounded-full bg-amber-50 text-amber-700 whitespace-nowrap';
    el.textContent = (navigator.onLine ? 'Mengirim · ' : 'Menunggu sinyal · ') + n + ' data';
  } else if(!navigator.onLine){
    el.className = 'text-[11px] font-bold px-2.5 py-1 rounded-full bg-slate-100 text-slate-500 whitespace-nowrap';
    el.textContent = 'Offline';
  } else {
    el.className = 'hidden';
  }
}
var flushing = false;
function flushOutbox(){
  if(flushing || !navigator.onLine || !outboxGet().length) return Promise.resolve();
  flushing = true;
  var sent = 0, rejected = [], needLogin = false;
  function next(){
    var l = outboxGet();
    if(!l.length) return Promise.resolve();
    var item = l[0];
    return apiFetch(item.endpoint, {method:'POST', body:JSON.stringify(item.payload)}).then(function(){
      outboxSet(outboxGet().slice(1)); sent++;
      return next();
    }, function(e){
      if(e.network || e.status >= 500 || !e.status) return;
      if(e.status === 401){ needLogin = true; return; }
      if(e.status === 403 && /sudah tersimpan/i.test(e.message)){
        outboxSet(outboxGet().slice(1));
        return next();
      }
      rejected.push(item.label+' — '+e.message);
      outboxSet(outboxGet().slice(1));
      return next();
    });
  }
  return next().then(function(){
    flushing = false;
    if(needLogin) toast('Login ulang untuk mengirim data yang tertunda.', true);
    if(sent) toast(sent+' data dari perangkat sudah terkirim ✓');
    if(rejected.length) toast('Ditolak server: '+rejected[0]+(rejected.length>1?' (+'+(rejected.length-1)+' lainnya)':''), true);
  });
}
function saveMasters(r){ lsSet(MASTERS_KEY, {at:Date.now(), projects:r[0], materials:r[1], pekerjaan:r[2]}); }
function loadMasters(){ return lsGet(MASTERS_KEY, null); }
function saveUser(u){ lsSet(USER_KEY, u); }
function loadUser(){ return lsGet(USER_KEY, null); }
window.addEventListener('online', function(){ updateSyncBadge(); flushOutbox(); });
window.addEventListener('offline', updateSyncBadge);
setInterval(function(){ if(navigator.onLine && outboxGet().length) flushOutbox(); }, 30000);
if('serviceWorker' in navigator){
  window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function num0(n){ if(n==null||Number.isNaN(n)) return '0'; return Number(n).toLocaleString('id-ID', {maximumFractionDigits:3}); }
/* Quantity/price inputs are plain text, not <input type=number>: Indonesian
   browsers render a number field's decimal point as a comma and reject a
   typed comma, so "0,322" could neither be typed nor displayed correctly.
   Display: 1.800 / 0,322. Parse accepts either style — a comma is always the
   decimal mark; dots are thousands marks unless a lone dot clearly is a
   decimal (e.g. "0.322"). */
function fmtIdNum(n){
  if(n==null||n===''||Number.isNaN(Number(n))) return '';
  return Number(n).toLocaleString('id-ID', {maximumFractionDigits:3});
}
function parseIdNum(s){
  s = String(s==null?'':s).trim().replace(/\s/g,'');
  if(!s) return NaN;
  if(s.indexOf(',')>-1) s = s.replace(/\./g,'').replace(',','.');
  else if(/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g,'');
  return Number(s);
}
function numInputHtml(id, value, cls, extra){
  return '<input id="'+esc(id)+'" type="text" inputmode="decimal" autocomplete="off" data-num value="'+esc(fmtIdNum(value))+'" class="'+cls+'"'+(extra||'')+'>';
}
document.addEventListener('blur', function(e){
  if(e.target && e.target.hasAttribute && e.target.hasAttribute('data-num')){
    var n = parseIdNum(e.target.value);
    e.target.value = Number.isNaN(n) ? '' : fmtIdNum(n);
  }
}, true);
function numSigned(n){
  n=Number(n)||0;
  var r = Math.round(Math.abs(n)*1000)/1000;
  if(r===0) return '0';
  return (n<0?'-':'')+r.toLocaleString('id-ID',{maximumFractionDigits:3});
}
function fmtNum(n){ return Number(n||0).toLocaleString('id-ID', {maximumFractionDigits:2}); }
function pct(n){ if(n==null||Number.isNaN(n)) return '–'; return (n*100).toFixed(1)+'%'; }
function uid(p){ return p + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
/* Auto-generates a short, sequential-looking code for a field the user
   shouldn't have to invent themselves — unlike a delivery note number
   (a real document someone else issued), an internal catalog code has
   no "correct" value to match, only a uniqueness requirement, so the
   system picks one. */
function genSeqCode(prefix, existingCodes){
  var n = existingCodes.length + 1;
  var code;
  do { code = prefix + '-' + String(n).padStart(3,'0'); n++; }
  while (existingCodes.indexOf(code) > -1);
  return code;
}
function today(){ return new Date().toISOString().slice(0,10); }
function fv(id){ var e=document.getElementById(id); return e?String(e.value||'').trim():''; }
function icons(){ if(window.lucide) lucide.createIcons(); }
function toast(msg, danger){
  var d=document.createElement('div');
  d.className='fixed left-4 right-4 bottom-5 max-w-[488px] mx-auto text-white text-sm px-4 py-3.5 rounded-2xl shadow-lg z-50 text-center '+(danger?'bg-red-600':'bg-slate-900');
  d.textContent = msg;
  document.getElementById('toastWrap').appendChild(d);
  setTimeout(function(){ d.remove(); }, 2800);
}
function isOwner(){ return !!(STATE.user && STATE.user.role==='owner'); }

function openModal(title, html, onSave){
  document.getElementById('modalBody').innerHTML =
    '<h2 class="text-lg font-bold mb-5">'+esc(title)+'</h2>'+html+
    '<div class="flex justify-end gap-2.5 mt-6">'+
    '<button class="px-4 py-2.5 rounded-xl text-sm font-semibold bg-slate-100 hover:bg-slate-200 transition" id="mCancel">Batal</button>'+
    (onSave?'<button class="px-4 py-2.5 rounded-xl text-sm font-semibold bg-indigo-600 hover:bg-indigo-700 text-white transition" id="mSave">Simpan</button>':'')+'</div>';
  document.getElementById('modalBack').classList.remove('hidden');
  document.getElementById('modalBack').classList.add('flex');
  document.getElementById('mCancel').onclick = closeModal;
  if(onSave) document.getElementById('mSave').onclick = onSave;
  // Every <select> inside a form modal gets the searchable widget for
  // free — no per-field wiring needed as new fields/forms are added.
  document.querySelectorAll('#modalBody select').forEach(enhanceSelect);
  // Same deal for plain text/number fields — an inline × to fix one
  // wrong value without resetting the whole form.
  document.querySelectorAll('#modalBody input[type=text], #modalBody input[type=number]').forEach(enhanceClearable);
}
function closeModal(){ document.getElementById('modalBack').classList.add('hidden'); document.getElementById('modalBack').classList.remove('flex'); }
function confirmModal(title, msg, onYes){
  openModal(title, '<p class="text-sm text-slate-600">'+msg+'</p>', function(){ closeModal(); onYes(); });
}
var fieldCls = "w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-100 focus:border-indigo-500";

/* ---------------- searchable dropdown ----------------
   Wraps a plain <select> (single or multiple) with a type-to-filter
   panel and a clear/cancel control, while the original <select> stays
   in the DOM as the single source of truth — every existing fv()
   read, form submit, and change-listener keeps working untouched.
   Needed once an option list grows past a handful of entries (87
   proyek in a native dropdown is unusable to scroll through). */
function enhanceSelect(sel){
  if(!sel || sel._enhanced) return;
  sel._enhanced = true;
  var multiple = sel.multiple;
  var placeholder = sel.getAttribute('data-placeholder') || (multiple ? '— Pilih —' : '');

  var wrap = document.createElement('div');
  wrap.className = 'relative';
  sel.parentNode.insertBefore(wrap, sel);
  wrap.appendChild(sel);
  sel.style.cssText = 'position:absolute;opacity:0;height:0;width:0;pointer-events:none;';
  sel.tabIndex = -1;

  var btn = document.createElement('button');
  btn.type = 'button';
  // Inherit the original select's own classes (size/padding/font) so
  // the widget matches whatever context it's dropped into — the small
  // desktop form fields (fieldCls) and the larger mobile touch targets
  // (inputCls) end up sized correctly without two separate components.
  btn.className = (sel.className || fieldCls) + ' flex items-center justify-between text-left gap-2 cursor-pointer';
  var label = document.createElement('span');
  label.className = 'truncate';
  var clearBtn = document.createElement('span');
  clearBtn.innerHTML = '<i data-lucide="x" class="w-3.5 h-3.5"></i>';
  clearBtn.className = 'text-slate-300 hover:text-slate-500 shrink-0 hidden';
  var caret = document.createElement('i');
  caret.setAttribute('data-lucide', 'chevron-down');
  caret.className = 'w-4 h-4 text-slate-400 shrink-0';
  var right = document.createElement('span');
  right.className = 'flex items-center gap-2 shrink-0';
  right.appendChild(clearBtn); right.appendChild(caret);
  btn.appendChild(label); btn.appendChild(right);
  wrap.appendChild(btn);

  // Every panel gets an explicit, always-visible way out — a search box
  // with no visible close control leaves "I opened this by accident" or
  // "I don't actually want to change this" with no obvious move besides
  // guessing that a click outside works.
  var panel = document.createElement('div');
  panel.className = 'hidden absolute z-30 mt-1.5 w-full bg-white border border-slate-200 rounded-xl shadow-lg max-h-72 overflow-hidden flex flex-col';
  panel.innerHTML = '<div class="p-2 border-b border-slate-100 shrink-0 flex items-center gap-1.5">'+
      '<input type="text" placeholder="Cari…" class="flex-1 min-w-0 px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-100">'+
      '<button type="button" class="ss-close shrink-0 w-9 h-9 flex items-center justify-center rounded-lg text-slate-400 hover:bg-slate-100 hover:text-slate-600" title="Tutup tanpa mengubah pilihan"><i data-lucide="x" class="w-4 h-4"></i></button>'+
    '</div>'+
    '<div class="overflow-y-auto py-1"></div>'+
    (multiple ? '<div class="p-2 border-t border-slate-100 flex justify-between gap-2 shrink-0"><button type="button" class="ss-clearall text-xs font-semibold text-slate-400 hover:text-slate-600">Batal Semua</button><button type="button" class="ss-done text-xs font-semibold text-indigo-600 hover:text-indigo-700">Selesai</button></div>' : '');
  wrap.appendChild(panel);

  var searchInput = panel.querySelector('input');
  var listEl = panel.querySelector('div.overflow-y-auto');
  function optsArr(){ return Array.from(sel.options); }

  function renderLabel(){
    if(multiple){
      var sels = optsArr().filter(function(o){ return o.selected; });
      label.textContent = sels.length ? (sels.length===1 ? sels[0].textContent : sels.length+' dipilih') : placeholder;
      label.classList.toggle('text-slate-400', !sels.length);
      clearBtn.classList.toggle('hidden', !sels.length);
    } else {
      var o = sel.options[sel.selectedIndex];
      var hasValue = o && o.value !== '';
      label.textContent = hasValue ? o.textContent : (placeholder || (o?o.textContent:''));
      label.classList.toggle('text-slate-400', !hasValue);
      // Show × whenever there's a value to clear back to blank — not
      // only when a data-placeholder was set. Most selects here (Material,
      // Pekerjaan, Proyek…) already have their own blank "— Pilih —"
      // option baked into the <option> list rather than via that
      // attribute, so requiring it too was hiding the × on exactly the
      // selects people fill in most.
      var hasEmptyOpt = optsArr().some(function(opt){ return opt.value===''; });
      clearBtn.classList.toggle('hidden', !(hasValue && (placeholder || hasEmptyOpt)));
    }
  }
  function renderList(filter){
    var q = (filter||'').toLowerCase();
    var opts = optsArr().filter(function(o){ return multiple || o.value !== ''; });
    var matched = opts.filter(function(o){ return o.textContent.toLowerCase().indexOf(q) > -1; });
    listEl.innerHTML = matched.length ? matched.map(function(o){
      if(multiple){
        return '<label class="flex items-center gap-2 px-3 py-2 text-sm hover:bg-slate-50 cursor-pointer"><input type="checkbox" data-val="'+esc(o.value)+'" '+(o.selected?'checked':'')+' class="rounded border-slate-300 text-indigo-600 focus:ring-indigo-200">'+esc(o.textContent)+'</label>';
      }
      return '<div data-val="'+esc(o.value)+'" class="px-3 py-2 text-sm hover:bg-slate-50 cursor-pointer '+(o.selected?'bg-indigo-50 text-indigo-700 font-semibold':'text-slate-700')+'">'+esc(o.textContent)+'</div>';
    }).join('') : '<div class="px-3 py-6 text-center text-sm text-slate-400">Tidak ditemukan</div>';
    if(multiple){
      listEl.querySelectorAll('input[type=checkbox]').forEach(function(cb){
        cb.onchange = function(){
          var opt = optsArr().find(function(o){ return o.value === cb.getAttribute('data-val'); });
          if(opt) opt.selected = cb.checked;
          sel.dispatchEvent(new Event('change'));
          renderLabel();
        };
      });
    } else {
      listEl.querySelectorAll('[data-val]').forEach(function(d){
        d.onclick = function(){
          sel.value = d.getAttribute('data-val');
          sel.dispatchEvent(new Event('change'));
          renderLabel(); close();
        };
      });
    }
  }
  function open(){ panel.classList.remove('hidden'); searchInput.value=''; renderList(''); searchInput.focus(); }
  function close(){ panel.classList.add('hidden'); }
  btn.onclick = function(e){ e.stopPropagation(); panel.classList.contains('hidden') ? open() : close(); };
  panel.querySelector('.ss-close').onclick = function(e){ e.stopPropagation(); close(); };
  searchInput.addEventListener('input', function(){ renderList(searchInput.value); });
  searchInput.addEventListener('keydown', function(e){ if(e.key==='Escape'){ close(); btn.focus(); } });
  clearBtn.onclick = function(e){
    e.stopPropagation();
    if(multiple) optsArr().forEach(function(o){ o.selected = false; }); else sel.value = '';
    sel.dispatchEvent(new Event('change'));
    renderLabel(); if(panel.classList.contains('hidden')===false) renderList(searchInput.value);
  };
  if(multiple){
    panel.querySelector('.ss-clearall').onclick = function(){ optsArr().forEach(function(o){ o.selected=false; }); sel.dispatchEvent(new Event('change')); renderLabel(); renderList(searchInput.value); };
    panel.querySelector('.ss-done').onclick = function(){ close(); };
  }
  document.addEventListener('click', function(e){ if(!wrap.contains(e.target)) close(); });
  sel.addEventListener('ss-refresh', function(){ renderLabel(); });
  renderLabel();
  icons();
}

/* Adds an inline × to a plain text/number input, shown only once it has
   a value — the single-field equivalent of enhanceSelect's clear button,
   for fixing one wrong field without resetting the whole form via Batal. */
function enhanceClearable(input){
  if(!input || input._clearable) return;
  input._clearable = true;
  var wrap = document.createElement('div');
  wrap.className = 'relative';
  input.parentNode.insertBefore(wrap, input);
  wrap.appendChild(input);
  input.classList.add('pr-9');
  if(input.type==='number') input.classList.add('no-spinner');
  var btn = document.createElement('button');
  btn.type = 'button';
  btn.tabIndex = -1;
  btn.className = 'hidden absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-300 hover:text-slate-500 transition';
  btn.innerHTML = '<i data-lucide="x" class="w-4 h-4"></i>';
  wrap.appendChild(btn);
  function refresh(){ btn.classList.toggle('hidden', !input.value); }
  input.addEventListener('input', refresh);
  btn.onclick = function(e){
    e.preventDefault(); e.stopPropagation();
    input.value = '';
    input.dispatchEvent(new Event('input'));
    input.dispatchEvent(new Event('change'));
    input.focus();
  };
  refresh();
  icons();
}

   the app still reads Aman/Perlu Dikirim/Habis (or Melebihi RAP)
   at a glance — this is the format owners actually forward around.

var STATUS_STYLE = {
  AMAN:               {xlsxFill:'FFC6EFCE', xlsxFont:'FF006100', bg:'#C6EFCE', fg:'#006100', label:'Aman'},
  MENIPIS:            {xlsxFill:'FFFFEB9C', xlsxFont:'FF9C6500', bg:'#FFEB9C', fg:'#9C6500', label:'Perlu Dikirim'},
  HABIS:              {xlsxFill:'FFFFC7CE', xlsxFont:'FF9C0006', bg:'#FFC7CE', fg:'#9C0006', label:'Stok Habis'},
  HAMPIR_HABIS:       {xlsxFill:'FFFFEB9C', xlsxFont:'FF9C6500', bg:'#FFEB9C', fg:'#9C6500', label:'Hampir Habis RAP'},
  MELEBIHI:           {xlsxFill:'FFFFC7CE', xlsxFont:'FF9C0006', bg:'#FFC7CE', fg:'#9C0006', label:'Melebihi RAP'},
  DATA_TIDAK_LENGKAP: {xlsxFill:'FFF2F2F2', xlsxFont:'FF7F7F7F', bg:'#F2F2F2', fg:'#7F7F7F', label:'Data Tidak Lengkap'},
  BELUM_ADA_TRANSAKSI: {xlsxFill:'FFF2F2F2', xlsxFont:'FF7F7F7F', bg:'#F2F2F2', fg:'#7F7F7F', label:'Belum Ada Transaksi'},
  BELUM_ADA_HITUNGAN: {xlsxFill:'FFEDE9FE', xlsxFont:'FF5B21B6', bg:'#EDE9FE', fg:'#5B21B6', label:'Belum Ada Hitungan'},
};

var _exceljsLoading=null;
function loadExcelJS(){
  if(window.ExcelJS) return Promise.resolve();
  if(_exceljsLoading) return _exceljsLoading;
  _exceljsLoading=new Promise(function(resolve,reject){
    var s=document.createElement('script');
    s.src='vendor/exceljs.min.js';
    s.onload=function(){ resolve(); };
    s.onerror=function(){ _exceljsLoading=null; reject(new Error('Gagal memuat modul Excel.')); };
    document.head.appendChild(s);
  });
  return _exceljsLoading;
}

/* headers: string[]; rows: any[][] (numbers stay numbers so Excel can
   sum/sort them); opts.statusCols: indexes of columns holding RAW status
   codes (AMAN/MENIPIS/…) to color — those cells are swapped for their
   human label after coloring. */
async function exportExcel(filename, title, headers, rows, opts){
  opts=opts||{};
  var sc = opts.statusCols || [];
  try{ await loadExcelJS(); }
  catch(e){ toast('Gagal memuat modul Excel — cek koneksi lalu coba lagi.', true); return; }

  var wb=new ExcelJS.Workbook();
  wb.creator='Material & Stok';
  wb.created=new Date();
  var ws=wb.addWorksheet((opts.sheetName||filename).slice(0,31).replace(/[\\/*?:\[\]]/g,' '));

  var titleRow=ws.addRow([title]);
  titleRow.font={bold:true, size:13, name:'Calibri', color:{argb:'FF1E3A8A'}};
  ws.mergeCells(titleRow.number,1,titleRow.number,Math.max(headers.length,1));
  var subRow=ws.addRow([(opts.sub?opts.sub+' · ':'')+'Diekspor '+new Date().toLocaleDateString('id-ID',{day:'2-digit',month:'long',year:'numeric'})+' dari Material & Stok']);
  subRow.font={italic:true, size:9.5, name:'Calibri', color:{argb:'FF888888'}};
  ws.mergeCells(subRow.number,1,subRow.number,Math.max(headers.length,1));
  if(opts.summary && opts.summary.length){
    var sumRow = ws.addRow(opts.summary.map(function(x){ return x.label+': '+x.count; }));
    sumRow.height = 22;
    sumRow.eachCell(function(cell, ci){
      var st = STATUS_STYLE[opts.summary[ci-1].status];
      cell.fill = {type:'pattern', pattern:'solid', fgColor:{argb: st ? st.xlsxFill : 'FFF2F2F2'}};
      cell.font = {name:'Calibri', size:10.5, bold:true, color:{argb: st ? st.xlsxFont : 'FF334155'}};
      cell.alignment = {horizontal:'center', vertical:'middle', wrapText:true};
    });
  }
  ws.addRow([]);

  var headerRow=ws.addRow(headers);
  headerRow.eachCell(function(cell){
    cell.font={bold:true, color:{argb:'FFFFFFFF'}, name:'Calibri', size:10.5};
    cell.fill={type:'pattern', pattern:'solid', fgColor:{argb:'FF1E3A8A'}};
    cell.alignment={vertical:'middle', horizontal:'center', wrapText:true};
  });
  headerRow.height=20;
  ws.views=[{state:'frozen', ySplit:headerRow.number}];

  var isNumCol=headers.map(function(_,ci){
    return rows.length>0 && rows.every(function(r){ return r[ci]==null || typeof r[ci]==='number'; });
  });

  rows.forEach(function(r, ri){
    var displayRow = r.slice();
    var styles = {};
    sc.forEach(function(ci){
      styles[ci] = STATUS_STYLE[r[ci]] || null;
      if(styles[ci]) displayRow[ci] = styles[ci].label;
    });
    var row=ws.addRow(displayRow);
    row.eachCell({includeEmpty:true}, function(cell, ci){
      cell.font={name:'Calibri', size:10.5};
      cell.border={bottom:{style:'hair', color:{argb:'FFE3E7EE'}}};
      if(isNumCol[ci-1]){ cell.numFmt='#,##0.##'; cell.alignment={horizontal:'right'}; }
      else cell.alignment={horizontal:'left'};
      if(ri%2===1) cell.fill={type:'pattern', pattern:'solid', fgColor:{argb:'FFF7F9FC'}};
      var style = styles[ci-1];
      if(style){
        cell.fill={type:'pattern', pattern:'solid', fgColor:{argb:style.xlsxFill}};
        cell.font={name:'Calibri', size:10.5, bold:true, color:{argb:style.xlsxFont}};
        cell.alignment={horizontal:'center'};
      }
    });
  });

  headers.forEach(function(h, i){
    var maxLen=String(h).length;
    rows.forEach(function(r){
      var v=(sc.indexOf(i)>-1 && STATUS_STYLE[r[i]]) ? STATUS_STYLE[r[i]].label : r[i];
      var len=(typeof v==='number')?num0(v).length:String(v==null?'':v).length;
      if(len>maxLen) maxLen=len;
    });
    ws.getColumn(i+1).width=Math.min(Math.max(maxLen+2, 10), 48);
  });

  var buf=await wb.xlsx.writeBuffer();
  var blob=new Blob([buf], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=filename.replace(/\s+/g,'_')+'.xlsx';
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(a.href);
}

/* Same data, rendered as a standalone print-ready page in a new tab —
   uses the browser's own "Save as PDF" (no extra library needed) and
   keeps the status colors via print-color-adjust so they survive
   printing/PDF export, not just on-screen viewing. */
var _jspdfLoading=null;
function loadJsPdf(){
  if(window.jspdf && window.jspdf.jsPDF && window.jspdf.jsPDF.API && window.jspdf.jsPDF.API.autoTable) return Promise.resolve();
  if(_jspdfLoading) return _jspdfLoading;
  _jspdfLoading=new Promise(function(resolve,reject){
    var s1=document.createElement('script');
    s1.src='vendor/jspdf.umd.min.js';
    s1.onload=function(){
      var s2=document.createElement('script');
      s2.src='vendor/jspdf.autotable.min.js';
      s2.onload=function(){ resolve(); };
      s2.onerror=function(){ _jspdfLoading=null; reject(new Error('Gagal memuat modul PDF.')); };
      document.head.appendChild(s2);
    };
    s1.onerror=function(){ _jspdfLoading=null; reject(new Error('Gagal memuat modul PDF.')); };
    document.head.appendChild(s1);
  });
  return _jspdfLoading;
}
function hexToRgb(hex){
  hex = String(hex).replace('#','');
  var n = parseInt(hex,16);
  return [(n>>16)&255, (n>>8)&255, n&255];
}
function filenameFromTitle(title){
  return String(title).replace(/[^a-zA-Z0-9]+/g,'_').replace(/^_+|_+$/g,'') || 'Laporan';
}

/* Real downloadable .pdf (jsPDF + autoTable, self-hosted — no CDN, no
   browser print dialog) with the same status colors as the on-screen
   table and the Excel export, carried through as real cell fills. */
async function exportPdf(title, sub, headers, rows, opts){
  opts=opts||{};
  var sc = opts.statusCols || [];
  try{ await loadJsPdf(); }
  catch(e){ toast('Gagal memuat modul PDF — cek koneksi lalu coba lagi.', true); return; }

  var jsPDF = window.jspdf.jsPDF;
  var landscape = headers.length > 6;
  var doc = new jsPDF({orientation: landscape ? 'landscape' : 'portrait', unit:'pt', format:'a4'});

  doc.setFont('helvetica', 'bold'); doc.setFontSize(14); doc.setTextColor(30,58,138);
  doc.text(title, 40, 36);
  if(sub){ doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(100,116,139); doc.text(sub, 40, 52); }

  // Right-align columns that are numbers in every row — makes a
  // numeric report scannable (digits line up) instead of ragged
  // left-aligned text, which is how the on-screen tables already read.
  var isNumCol = headers.map(function(_, ci){
    return rows.length>0 && sc.indexOf(ci)===-1 && rows.every(function(r){ return r[ci]==null || typeof r[ci]==='number'; });
  });
  var body = rows.map(function(r){
    return r.map(function(v, ci){
      var style=(sc.indexOf(ci)>-1 && STATUS_STYLE[v]) ? STATUS_STYLE[v] : null;
      if(style) return style.label;
      return typeof v==='number' ? num0(v) : (v==null?'':String(v));
    });
  });

  var top = sub ? 64 : 48;
  if(opts.summary && opts.summary.length){
    var n = opts.summary.length, gap = 8, boxH = 40, pageW = doc.internal.pageSize.getWidth();
    var boxW = (pageW - 80 - gap*(n-1)) / n;
    opts.summary.forEach(function(x, i){
      var st = STATUS_STYLE[x.status];
      var bx = 40 + i*(boxW+gap), by = top;
      var bg = st ? hexToRgb(st.bg) : [241,245,249], fg = st ? hexToRgb(st.fg) : [51,65,85];
      doc.setFillColor(bg[0],bg[1],bg[2]);
      doc.roundedRect(bx, by, boxW, boxH, 6, 6, 'F');
      doc.setTextColor(fg[0],fg[1],fg[2]);
      doc.setFont('helvetica','bold'); doc.setFontSize(8);
      doc.text(String(x.label), bx+9, by+14);
      doc.setFontSize(15);
      doc.text(String(x.count), bx+9, by+33);
    });
    top += boxH + 14;
  }

  doc.autoTable({
    head: [headers],
    body: body,

/* Download periods: a preset just sets the page's date filter, so the file
   always matches what is on screen. "kustom" appears once the dates are typed
   by hand, so the picker never claims a period that is not applied. */
function localISO(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function periodRange(key){
  var now = new Date(), end = localISO(now);
  if(key==='hari') return {from:end, to:end};
  if(key==='minggu'){
    var mon = new Date(now); mon.setDate(now.getDate() - ((now.getDay()+6)%7));
    return {from:localISO(mon), to:end};
  }
  if(key==='bulan') return {from:localISO(new Date(now.getFullYear(), now.getMonth(), 1)), to:end};
  return {from:'', to:''};
}
function periodLabel(from, to){
  if(from && to) return from===to ? 'Tanggal '+from : 'Periode '+from+' s/d '+to;
  if(from) return 'Sejak '+from;
  if(to) return 'Stok per '+to;
  return 'Seluruh periode';
}
function periodSuffix(from, to){
  if(from && to) return from===to ? '_'+from : '_'+from+'_sd_'+to;
  if(to) return '_per_'+to;
  return '';
}
/* One source for the status cards on screen and the summary in downloads, so
   the two can never disagree. */
function statusSummary(rows, options){
  var total = rows.length, counts = {};
  rows.forEach(function(r){ counts[r.status] = (counts[r.status]||0)+1; });
  return options.map(function(o){
    var n = counts[o.value]||0;
    return {status:o.value, label:o.label, count:n, pct: total ? n/total : null};
  });
}

/* Status colors are fixed/reserved across the whole app (same as badge()) —
   a chart segment's color always means the same status everywhere, and is
   always paired with a text label/legend, never color alone. */
var STATUS_BAR_COLOR = {AMAN:'#10b981', MENIPIS:'#f59e0b', HABIS:'#ef4444', HAMPIR_HABIS:'#f59e0b', MELEBIHI:'#ef4444', DATA_TIDAK_LENGKAP:'#cbd5e1', BELUM_ADA_TRANSAKSI:'#cbd5e1', BELUM_ADA_HITUNGAN:'#8b5cf6'};
var STATUS_BAR_LABEL = {AMAN:'Aman', MENIPIS:'Perlu Dikirim', HABIS:'Stok Habis', HAMPIR_HABIS:'Hampir Habis RAP', MELEBIHI:'Melebihi RAP', DATA_TIDAK_LENGKAP:'Data Tidak Lengkap', BELUM_ADA_TRANSAKSI:'Belum Ada Transaksi', BELUM_ADA_HITUNGAN:'Belum Ada Hitungan'};
/* Horizontal bar row: label left, filled track right, value as a direct

function navAttrsHtml(nav){

function hbarRow(label, sublabel, pctWidth, color, valueLabel, nav){

/* Stacked status bar + legend — a status breakdown is counted, never summed
   across incompatible units, so this works the same whether scoped to one
   proyek or all of them. */
function statusStackChart(counts, order, total){
  if(!total) return '<div class="text-center text-sm text-slate-400 py-8">Belum ada data.</div>';
  var segs = order.filter(function(k){ return counts[k]>0; }).map(function(k){
    var pct = counts[k]/total*100;
    return '<div style="width:'+pct+'%;background:'+STATUS_BAR_COLOR[k]+'" title="'+esc(STATUS_BAR_LABEL[k])+': '+counts[k]+'"></div>';
  }).join('');

    return '<div class="flex items-center gap-1.5 text-xs text-slate-600"><span class="w-2.5 h-2.5 rounded-sm inline-block" style="background:'+STATUS_BAR_COLOR[k]+'"></span>'+esc(STATUS_BAR_LABEL[k])+' <b>'+counts[k]+'</b></div>';
  }).join('');
  return '<div class="flex h-4 rounded-full overflow-hidden gap-[2px] bg-slate-100">'+segs+'</div>'+
    '<div class="flex flex-wrap gap-x-4 gap-y-1.5 mt-3.5">'+legend+'</div>';
}
/* Groups "melebihi RAP" rows by an entity (proyek, or bahan) so the
   dashboard can answer "which proyek/bahan is over" directly, instead
   of a flat ranked list that mixes entities together. Each group is
   sized by its single worst (highest %) row — count alone would make
   a group with one badly-over item look smaller than a group with many
   mildly-over ones, which is backwards for "where's the real risk". */
function groupOverRows(rows, keyFn, nameFn){
  var map = {};
  rows.forEach(function(r){
    var k = keyFn(r);
    if(!map[k]) map[k] = {name:nameFn(r), items:[]};
    map[k].items.push(r);
  });
  var arr = Object.keys(map).map(function(k){
    var g = map[k];
    var worst = g.items.slice().sort(function(a,b){ return b.persentase-a.persentase; })[0];
    return {name:g.name, count:g.items.length, worst:worst};
  });
  arr.sort(function(a,b){ return b.worst.persentase-a.worst.persentase; });
  return arr;
}
function overGroupChart(groups, emptyMsg, sublabelFn, limit, navFn){
  if(!groups.length) return '<div class="text-center text-sm text-slate-400 py-8">'+esc(emptyMsg)+'</div>';
  return groups.slice(0,limit||8).map(function(g){
    return hbarRow(g.name, sublabelFn(g), g.worst.persentase*100, STATUS_BAR_COLOR.MELEBIHI, pct(g.worst.persentase), navFn?navFn(g):null);
  }).join('');
}
/* Early-warning dashboard for Owner: what needs action now, where, and why.
   Every number/status is clickable and routes to the detail report already
   filtered to that proyek/bahan. Status priority decides a project's
   headline status: the worst material wins. */
var STOCK_PRIORITY = {HABIS:0, MENIPIS:1, BELUM_ADA_HITUNGAN:2, DATA_TIDAK_LENGKAP:3, BELUM_ADA_TRANSAKSI:4, AMAN:5};
var RAP_PRIORITY = {MELEBIHI:0, HAMPIR_HABIS:1, DATA_TIDAK_LENGKAP:2, AMAN:3};
var ATTENTION_RANK = {HABIS:0, MELEBIHI:1, MENIPIS:2};
var STATUS_KIND = {AMAN:'aman', MENIPIS:'warn', HABIS:'danger', BELUM_ADA_HITUNGAN:'neutral', HAMPIR_HABIS:'warn', MELEBIHI:'danger', DATA_TIDAK_LENGKAP:'neutral', BELUM_ADA_TRANSAKSI:'neutral'};

function statusPill(code){
  return badge(STATUS_KIND[code]||'neutral', STATUS_BAR_LABEL[code]||code);

function worstOf(rows, prio){
  if(!rows.length) return null;
  var worst = rows.reduce(function(a,b){ return (prio[b.status]<prio[a.status]) ? b : a; });
  var count = rows.filter(function(r){ return r.status===worst.status; }).length;
  return {status:worst.status, count:count};
}
function openStatusBreakdown(title, groups){
  var body = groups.length ? groups.map(function(g){
    return '<div class="mb-5 last:mb-0">'+

function groupByStatus(rows, prio, mapItem){
  var map = {};
  rows.forEach(function(r){ (map[r.status]=map[r.status]||[]).push(mapItem(r)); });
  return Object.keys(map).sort(function(a,b){ return prio[a]-prio[b]; }).map(function(k){ return {status:k, items:map[k]}; });
}

      '<div id="dLegend" class="grid sm:grid-cols-2 gap-3 mb-5"></div>'+
      '<div class="overflow-x-auto -mx-5 px-5"><table class="w-full text-sm" id="dSummary"></table></div>'
    );
  icons();
  document.getElementById('btnGoRapReport').onclick=function(){ go('rap_proyek_report'); };

  var summaryRows = [];
  function summaryView(){
    var q = (document.getElementById('dSumQ')||{value:''}).value.trim().toLowerCase();
    return summaryRows.filter(function(r){ return !q || r.nama.toLowerCase().indexOf(q)>-1; });
  }
  function countBy(rows){
    var m = {}; rows.forEach(function(r){ m[r.status]=(m[r.status]||0)+1; }); return m;
  }
  function miniBar(counts, order){
    var total = order.reduce(function(a,k){ return a+(counts[k]||0); }, 0);
    if(!total) return '';
    return '<div class="flex h-1.5 w-full rounded-full overflow-hidden bg-slate-100 gap-px mt-1.5" aria-hidden="true">'+
      order.filter(function(k){ return counts[k]>0; }).map(function(k){
        return '<span style="width:'+(counts[k]/total*100)+'%;background:'+STATUS_BAR_COLOR[k]+'" title="'+esc(STATUS_BAR_LABEL[k])+': '+counts[k]+' bahan"></span>';
      }).join('')+'</div>';
  }
  var exportSub = '';
  var dashCards = [];
  function renderDashLegend(stockRows, rapRows){
    var el = document.getElementById('dLegend');
    var mk = function(title, text, order, counts){
      var chips = order.filter(function(k){ return counts[k]!=null; }).map(function(k){
        return '<span class="inline-flex items-center gap-1.5 text-xs text-slate-600"><span class="w-2 h-2 rounded-full" style="background:'+STATUS_BAR_COLOR[k]+'"></span>'+esc(STATUS_BAR_LABEL[k])+' <b class="text-slate-800">'+counts[k]+'</b></span>';
      }).join('');
      return '<div class="rounded-xl border border-slate-200 bg-slate-50/60 p-3.5">'+
        '<div class="text-xs font-bold text-slate-700 mb-1">'+title+'</div>'+
        '<div class="text-xs text-slate-500 leading-relaxed mb-2">'+text+'</div>'+
        '<div class="flex flex-wrap gap-x-3.5 gap-y-1">'+chips+'</div></div>';
    };
    var sc = countBy(stockRows), rc = countBy(rapRows);
    el.innerHTML =
      mk('Status stok (per bahan)', 'Dibandingkan dengan titik pesan ulang. <b>Perlu Dikirim</b> = stok sudah di bawah titik pesan ulang, segera pesan.', ['AMAN','MENIPIS','HABIS','BELUM_ADA_HITUNGAN','BELUM_ADA_TRANSAKSI','DATA_TIDAK_LENGKAP'], sc) +
      mk('Status RAP (pemakaian vs pagu)', 'Pemakaian dibandingkan dengan pagu. <b>Hampir Habis</b> = sudah 90% pagu; <b>Melebihi</b> = sudah lewat pagu.', ['AMAN','HAMPIR_HABIS','MELEBIHI','DATA_TIDAK_LENGKAP'], rc);
  }
  function renderSummary(){
    var view = summaryView();
    document.getElementById('dSummaryCount').textContent = view.length+' dari '+summaryRows.length+' proyek';
    var statusCell = function(st, kind, id, counts, order){
      if(!st) return '<span class="text-slate-300 italic text-sm">belum ada data</span>';
      var more = st.count>1 ? ' <span class="text-xs text-slate-400">· '+st.count+' bahan</span>' : '';
      return '<button type="button" class="group block text-left" data-breakdown="'+esc(kind)+':'+esc(id)+'" title="Lihat rincian">'+
        '<span class="inline-flex items-center gap-1.5 whitespace-nowrap">'+statusPill(st.status)+more+
        '<i data-lucide="chevron-right" class="w-3.5 h-3.5 text-slate-300 group-hover:text-indigo-600"></i></span>'+
        '<span class="block w-40">'+miniBar(counts, order)+'</span></button>';
    };
    document.getElementById('dSummary').innerHTML =
      '<thead><tr class="border-b border-slate-200">'+
        ['No','Nama Proyek','Status Stok','Status RAP'].map(function(h){ return '<th class="text-left text-xs font-semibold text-slate-500 py-3 pr-4 whitespace-nowrap">'+h+'</th>'; }).join('')+
      '</tr></thead><tbody>'+
      (view.length ? view.map(function(r){
        var no = summaryRows.indexOf(r)+1;
        return '<tr class="border-b border-slate-100 hover:bg-slate-50/70 transition-colors align-top">'+
          '<td class="py-3 pr-4 text-slate-400 tabular-nums w-12">'+no+'</td>'+
          '<td class="py-3 pr-4 font-semibold text-slate-800 cursor-pointer hover:text-indigo-600" title="Buka Monitor Stok proyek ini"'+navAttrsHtml({page:'stock', projId:r.id})+'>'+esc(r.nama)+'</td>'+
          '<td class="py-3 pr-4">'+statusCell(r.stock,'stock',r.id,r.sCounts,['AMAN','MENIPIS','HABIS','BELUM_ADA_HITUNGAN','BELUM_ADA_TRANSAKSI','DATA_TIDAK_LENGKAP'])+'</td>'+
          '<td class="py-3 pr-4">'+statusCell(r.rap,'rap',r.id,r.rCounts,['AMAN','HAMPIR_HABIS','MELEBIHI','DATA_TIDAK_LENGKAP'])+'</td>'+
        '</tr>';
      }).join('') : '<tr><td colspan="4" class="text-center text-slate-400 text-sm py-10">Tidak ada proyek yang cocok.</td></tr>')+
      '</tbody>';
    icons();
  }
  document.getElementById('dSumQ').addEventListener('input', function(){ renderSummary(); bindSummaryExport(); });
  function bindSummaryExport(){
    bindExportBtns('Dashboard_Ringkasan'+periodSuffix(fv('dashFrom'), fv('dashTo')), 'Ringkasan Dashboard Material & Stok', exportSub+' · '+periodLabel(fv('dashFrom'), fv('dashTo')), ['No','Nama Proyek','Status Stok','Status RAP'],
      function(){ return summaryView().map(function(r, i){
        return [i+1, r.nama, r.stock?r.stock.status:'DATA_TIDAK_LENGKAP', r.rap?r.rap.status:'DATA_TIDAK_LENGKAP'];
      }); }, [2,3], dashCards);
  }

  function loadRapReport(){
    var qs = [];
    var from = fv('dashFrom'), to = fv('dashTo');
    if(from) qs.push('tgl_from='+encodeURIComponent(from));
    if(to) qs.push('tgl_to='+encodeURIComponent(to));
    return apiFetch('/material_rap_proyek_report.php'+(qs.length?'?'+qs.join('&'):'')).then(function(data){
      rapReportAll = data; render();
    }).catch(function(e){ toast('Gagal memuat RAP: '+e.message, true); });
  }

  function render(){
    var projId = fv('dashProj');
    var inScope = function(r){ return !projId || r.project_id===projId; };
    var stock = stockAll.filter(inScope);
    var rapR = rapReportAll.filter(inScope);
    var critical = stock.filter(function(s){ return s.status==='HABIS'||s.status==='MENIPIS'; });
    var overRap = rapR.filter(function(s){ return s.status==='MELEBIHI'; });
    var stale = stock.filter(function(s){ return s.usage_stale; });
    var uniq = function(arr){ return Object.keys(arr.reduce(function(m,r){ m[r.project_id]=1; return m; },{})).length; };

    document.getElementById('dKpi').innerHTML =
      statCard('briefcase','bg-sky-50 text-sky-600','Proyek dipantau', projId?1:projects.length, projId?'':'seluruh proyek', null) +
      statCard('layers','bg-amber-50 text-amber-600','Stok perlu tindakan', critical.length,
        critical.length ? 'di '+uniq(critical)+' proyek' : 'Semua stok aman ✓', 'stock') +
      statCard('trending-up','bg-red-50 text-red-600','Pemakaian melebihi pagu', overRap.length,
        overRap.length ? 'di '+uniq(overRap)+' proyek' : 'Belum ada yang melewati ✓', 'rap_proyek_report') +
      statCard('history','bg-orange-50 text-orange-600','Pemakaian belum diupdate', uniq(stale),
        stale.length ? 'dari '+stale.length+' bahan' : 'Semua proyek rutin update ✓', 'stock');

    dashCards = statusSummary(stock, ['AMAN','MENIPIS','HABIS','BELUM_ADA_HITUNGAN','BELUM_ADA_TRANSAKSI','DATA_TIDAK_LENGKAP'].map(function(k){ return {value:k, label:STATUS_BAR_LABEL[k]}; }));
    var stockCounts = {HABIS:0, MENIPIS:0, BELUM_ADA_HITUNGAN:0, DATA_TIDAK_LENGKAP:0, BELUM_ADA_TRANSAKSI:0, AMAN:0};
    stock.forEach(function(s){ if(stockCounts[s.status]!=null) stockCounts[s.status]++; });
    document.getElementById('dStockHealth').innerHTML = panelTitle('layers','Kesehatan Stok','Sebaran status bahan di seluruh proyek terpilih')+
      statusStackChart(stockCounts, ['AMAN','MENIPIS','HABIS','BELUM_ADA_HITUNGAN','DATA_TIDAK_LENGKAP','BELUM_ADA_TRANSAKSI'], stock.length);

    var rapCounts = {AMAN:0, HAMPIR_HABIS:0, MELEBIHI:0, DATA_TIDAK_LENGKAP:0};
    rapR.forEach(function(s){ if(rapCounts[s.status]!=null) rapCounts[s.status]++; });
    document.getElementById('dRapHealth').innerHTML = panelTitle('trending-up','Kesehatan Pemakaian vs Pagu','Sebaran status pemakaian terhadap pagu RAP per bahan')+
      statusStackChart(rapCounts, ['AMAN','HAMPIR_HABIS','MELEBIHI','DATA_TIDAK_LENGKAP'], rapR.length);

    var attention = critical.map(function(r){
        return {rank:ATTENTION_RANK[r.status], status:r.status, pid:r.project_id, proj:r.project_nama, mat:r.material_nama,
          page:'stock', detail:'stok '+num0(r.stok)+' '+esc(r.satuan)};
      }).concat(overRap.map(function(r){
        return {rank:ATTENTION_RANK.MELEBIHI, status:'MELEBIHI', pid:r.project_id, proj:r.project_nama, mat:r.material_nama,
          page:'rap_proyek_report', detail:'terpakai '+pct(r.persentase)+' dari pagu'};
      })).sort(function(a,b){ return a.rank-b.rank || a.proj.localeCompare(b.proj); });
    document.getElementById('dAttention').innerHTML = attention.length
      ? attention.slice(0,8).map(function(a){
          return '<div class="flex items-center justify-between gap-3 py-3 border-b border-slate-100 last:border-0 cursor-pointer hover:bg-slate-50 -mx-2 px-2 rounded-lg transition-colors"'+
            navAttrsHtml({page:a.page, projId:a.pid, q:a.mat})+'>'+
            '<div class="min-w-0"><div class="font-semibold text-sm text-slate-800 truncate">'+esc(a.mat)+'</div>'+
            '<div class="text-xs text-slate-400 truncate">'+esc(a.proj)+' · '+a.detail+'</div></div>'+
            statusPill(a.status)+'</div>';
        }).join('') + (attention.length>8 ? '<div class="text-xs text-slate-400 pt-3">+'+(attention.length-8)+' lainnya — buka menu Monitor Stok atau Analisis RAP</div>' : '')
      : '<div class="text-center text-sm text-slate-400 py-8">Tidak ada bahan yang perlu tindakan ✓</div>';

    var byProject = groupOverRows(overRap, function(r){return r.project_id;}, function(r){return r.project_nama;});
    document.getElementById('dOverChart').innerHTML = panelTitle('trending-up','Proyek Melebihi Pagu','Diurutkan dari pemakaian tertinggi terhadap pagu')+
      overGroupChart(byProject, 'Semua proyek masih dalam pagu RAP ✓', function(g){
        return g.count+' bahan — terparah: '+g.worst.material_nama;
      }, 6, function(g){ return {page:'rap_proyek_report', projId:g.worst.project_id}; });

    var staleMap = {};
    stale.forEach(function(r){
      if(!staleMap[r.project_id]) staleMap[r.project_id] = {id:r.project_id, name:r.project_nama, items:[]};
      staleMap[r.project_id].items.push(r.material_nama);
    });
    var staleByProject = Object.keys(staleMap).map(function(k){ return staleMap[k]; }).sort(function(a,b){ return b.items.length-a.items.length; });
    document.getElementById('staleUsagePanel').innerHTML = staleByProject.length ? staleByProject.map(function(g){
      var names = g.items.slice(0,4).join(', ') + (g.items.length>4?' +'+(g.items.length-4)+' lagi':'');
      return '<div class="flex justify-between items-center py-3 border-b border-slate-100 last:border-0 gap-3 cursor-pointer hover:bg-slate-50 -mx-2 px-2 rounded-lg transition-colors" title="Buka Riwayat Transaksi proyek ini"'+navAttrsHtml({page:'riwayat', projId:g.id})+'>'+
        '<div class="min-w-0"><div class="font-semibold text-sm text-slate-800">'+esc(g.name)+'</div><div class="text-xs text-slate-400 truncate">'+esc(names)+'</div></div>'+
        badge('warn', g.items.length+' bahan')+'</div>';
    }).join('') : '<div class="text-center text-sm text-slate-400 py-6">Semua proyek rutin update Pemakaian ✓</div>';

    var projList = projects.filter(inScope).slice().sort(function(a,b){ return a.nama.localeCompare(b.nama); });
    summaryRows = projList.map(function(p){
      var sRows = stock.filter(function(r){ return r.project_id===p.id; });
      var rRows = rapR.filter(function(r){ return r.project_id===p.id; });
      return {id:p.id, nama:p.nama,
        stock:worstOf(sRows, STOCK_PRIORITY), rap:worstOf(rRows, RAP_PRIORITY),
        sCounts:countBy(sRows), rCounts:countBy(rRows)};
    });
    renderSummary();
    renderDashLegend(stock, rapR);

    var stamp = new Date().toLocaleString('id-ID',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
    document.getElementById('dashUpdated').textContent = 'Diperbarui '+stamp;
    var projName = projId ? (projects.find(function(p){ return p.id===projId; })||{}).nama : 'Semua proyek';
    exportSub = projName+' · Stok perlu tindakan: '+critical.length+' · Melebihi pagu: '+overRap.length+' · Pemakaian belum diupdate: '+uniq(stale)+' proyek';
    bindSummaryExport();
  }

  document.getElementById('dSummary').onclick = function(e){
    var b = e.target.closest ? e.target.closest('[data-breakdown]') : null;
    if(!b) return;
    var parts = b.getAttribute('data-breakdown').split(':');
    var kind = parts[0], pid = parts[1];
    var projName = (projects.find(function(p){ return p.id===pid; })||{}).nama || '';
    if(kind==='stock'){
      var rows = stockAll.filter(function(r){ return r.project_id===pid; });
      openStatusBreakdown('Status Stok — '+projName, groupByStatus(rows, STOCK_PRIORITY, function(r){
        return {name:r.material_nama, detail:'stok '+num0(r.stok)+' '+esc(r.satuan)};
      }));
    } else {
      var rrows = rapReportAll.filter(function(r){ return r.project_id===pid; });
      openStatusBreakdown('Status RAP — '+projName, groupByStatus(rrows, RAP_PRIORITY, function(r){
        return {name:r.material_nama, detail: r.persentase==null ? 'pagu belum diisi' : pct(r.persentase)+' dari pagu '+num0(r.rap_qty)+' '+esc(r.satuan)};
      }));
    }
  };

  apiFetch('/projects.php').then(function(list){
    projects = list;
    document.getElementById('dashProj').innerHTML = '<option value="">Semua Proyek</option>'+
      list.slice().sort(function(a,b){ return a.nama.localeCompare(b.nama); }).map(function(p){ return '<option value="'+esc(p.id)+'">'+esc(p.nama)+'</option>'; }).join('');
    enhanceSelect(document.getElementById('dashProj'));
    return apiFetch('/material_stock.php');
  }).then(function(stockData){
    stockAll = stockData;
    loadRapReport();
    document.getElementById('dashProj').addEventListener('change', render);
    var setDashPeriod = function(v){ document.getElementById('dPeriod').value = v; };
    document.getElementById('dashFrom').addEventListener('change', function(){ setDashPeriod('kustom'); loadRapReport(); });
    document.getElementById('dashTo').addEventListener('change', function(){ setDashPeriod('kustom'); loadRapReport(); });
    document.getElementById('dPeriod').onchange = function(){
      var r = periodRange(this.value);
      document.getElementById('dashFrom').value = r.from;
      document.getElementById('dashTo').value = r.to;
      loadRapReport();
    };
    document.getElementById('dashDateReset').onclick = function(){
      document.getElementById('dashFrom').value=''; document.getElementById('dashTo').value='';
      setDashPeriod('semua');
      loadRapReport();
    };
  }).catch(function(e){ document.getElementById('dKpi').innerHTML='<div class="col-span-full text-center text-sm text-red-500 py-8">Gagal memuat: '+esc(e.message)+'</div>'; });
};

        {key:'rap_qty', label:'Pagu Total', render:function(r){ var m=materials.find(function(x){ return x.id===r.material_id; }); return num0(r.rap_qty)+' '+(m?esc(m.satuan):''); }},

/* ---------------- generic read-only report page (search + project filter + export) ---------------- */
/* A percentage above 500% almost always means the pagu was typed in the
   wrong unit or magnitude, not a real overrun — show a warning instead of
   a number nobody can act on. */
function cekPaguBadge(){
  return '<span class="inline-flex items-center gap-1 text-xs font-bold text-red-600 bg-red-50 px-2 py-1 rounded-lg" title="Pagu terlihat jauh lebih kecil dari angka barang/pemakaian. Periksa nilai pagu di menu RAP per Proyek.">⚠ Cek pagu</span>';
}
function reportPage(cfg){
  return function(c){
    // Two fixed rows (what-to-show, then time-range) instead of one row
    // that free-wraps — with search + proyek + status all on one line,
    // a free wrap put "Sampai" on its own line arbitrarily depending on
    // viewport width, which read as broken rather than intentional.
    var rowWhat = '<div class="flex items-center gap-3 flex-wrap">'+
        '<div class="relative flex-1 min-w-[220px] max-w-xs"><i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2"></i>'+
        '<input type="text" id="q" placeholder="'+esc(cfg.searchPlaceholder)+'" class="w-full pl-9 pr-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-100"></div>'+
        '<select id="fProj" class="px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-100 min-w-[180px]"><option value="">Semua Proyek</option></select>'+
        (cfg.statusFilter ? (
          '<select id="fStatus" class="px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-100 min-w-[160px]">'+
            '<option value="">Semua Status</option>'+
            cfg.statusFilter.options.map(function(o){ return '<option value="'+esc(o.value)+'">'+esc(o.label)+'</option>'; }).join('')+
          '</select>'
        ) : '')+
        (cfg.dateFilter ? '' : '<span class="text-xs text-slate-400 ml-auto" id="cnt"></span>')+
      '</div>';
    var rowWhen = cfg.dateFilter ? (
      '<div class="flex items-center gap-3 flex-wrap mt-3">'+
        (cfg.dateFilter.single ? '' : (
          '<span class="text-xs text-slate-400">'+esc(cfg.dateFilter.fromLabel||'Dari')+'</span>'+
          '<input type="date" id="rpFrom" class="px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-100">'
        ))+
        '<span class="text-xs text-slate-400">'+esc(cfg.dateFilter.toLabel||'Sampai')+'</span>'+
        '<input type="date" id="rpTo" class="px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-100">'+
        '<button id="rpDateReset" class="'+btnGhostSm+'">Reset</button>'+
        '<span class="text-xs text-slate-400 ml-auto" id="cnt"></span>'+
      '</div>'
    ) : '';
    var CARD_GRID = {4:'md:grid-cols-4', 6:'md:grid-cols-3'};
    var cardsHtml = cfg.statusFilter
      ? '<div id="stCards" class="grid grid-cols-2 gap-3 mb-5 '+(CARD_GRID[cfg.statusFilter.options.length]||'')+'"></div>'
      : '';
    var guideHtml = cfg.guide ? '<details open class="mb-5 rounded-2xl border border-indigo-100 bg-indigo-50/50 px-5 py-4">'+
      '<summary class="cursor-pointer text-sm font-bold text-indigo-900 select-none">Cara membaca halaman ini</summary>'+
      '<div class="grid md:grid-cols-2 gap-x-6 gap-y-3 mt-4">'+
        cfg.guide.map(function(g){ return '<div><div class="text-xs font-bold text-slate-700">'+esc(g.t)+'</div><div class="text-xs text-slate-500 leading-relaxed mt-0.5">'+esc(g.d)+'</div></div>'; }).join('')+
      '</div></details>' : '';
    c.innerHTML = pageHead(cfg.title, cfg.sub, exportBtnsHtml(cfg.dateFilter ? 'exPeriod' : null)) + cardsHtml + guideHtml +
      panel(
        '<div class="mb-4">'+rowWhat+rowWhen+'</div>'+
        (cfg.dateFilter && cfg.dateFilter.hint ? '<div class="text-xs text-slate-400 -mt-2 mb-4">'+esc(cfg.dateFilter.hint)+'</div>' : '')+
        '<div class="overflow-x-auto -mx-5 px-5"><table class="w-full text-sm" id="tbl"></table></div>'
      );
    icons();
    enhanceClearable(document.getElementById('q'));
    if(cfg.statusFilter) enhanceSelect(document.getElementById('fStatus'));
    var rows=[], filteredList=[];
    var STATUS_COL = cfg.statusCol!=null ? cfg.statusCol : null;
    // A dashboard row ("Besi — perlu dikirim") can hand this page a
    // one-time project/search filter via goFiltered() — consumed once
    // on first load so it doesn't stick around on later visits.
    var pending = STATE.pendingFilter; STATE.pendingFilter = null;
    if(pending && pending.q!=null) document.getElementById('q').value = pending.q;
    function cardPool(){
      var projId = fv('fProj');
      return projId ? rows.filter(function(r){ return r.project_id===projId; }) : rows;
    }
    function renderCards(){
      var el = document.getElementById('stCards');
      if(!el) return;
      var cur = fv('fStatus');
      el.innerHTML = statusSummary(cardPool(), cfg.statusFilter.options).map(function(x){
        var on = cur===x.status;
        return '<button type="button" data-card="'+esc(x.status)+'" title="Klik untuk menyaring, klik lagi untuk menghapus filter" class="flex flex-col items-start text-left bg-white rounded-2xl border p-4 shadow-sm transition-all hover:shadow-md '+
          (on ? 'border-indigo-400 ring-2 ring-indigo-100' : 'border-slate-200')+'">'+
          '<div class="flex items-center gap-2 text-sm font-semibold text-slate-600 leading-snug"><span class="w-2.5 h-2.5 rounded-full shrink-0" style="background:'+(STATUS_BAR_COLOR[x.status]||'#94a3b8')+'"></span>'+esc(x.label)+'</div>'+
          '<div class="text-3xl font-extrabold text-slate-900 mt-3 leading-none tabular-nums">'+x.count+'</div>'+
          '<div class="text-xs text-slate-400 mt-2">'+(x.pct==null ? 'belum ada bahan' : Math.round(x.pct*100)+'% dari '+cardPool().length+' bahan')+'</div>'+
        '</button>';
      }).join('');
      el.querySelectorAll('[data-card]').forEach(function(b){
        b.onclick = function(){
          var sel = document.getElementById('fStatus'), v = b.getAttribute('data-card');
          sel.value = sel.value===v ? '' : v;
          sel.dispatchEvent(new Event('change'));
          sel.dispatchEvent(new Event('ss-refresh'));
        };
      });
    }
    function draw(){
      renderCards();
      var q=fv('q').toLowerCase(), projId=fv('fProj'), statusVal=cfg.statusFilter?fv('fStatus'):'';
      filteredList = rows.filter(function(r){
        if(q && cfg.searchFn(r).toLowerCase().indexOf(q)===-1) return false;
        if(projId && r.project_id!==projId) return false;
        if(statusVal && r.status!==statusVal) return false;
        return true;
      });
      var list=filteredList;
      // Period-only columns (movement inside Dari–Sampai) appear only when a
      // date is actually chosen; otherwise they are dead "–" columns that
      // push the status column off-screen. Export follows the same rule.
      var showPeriod = !!(fv('rpFrom') || fv('rpTo'));
      var expCols = cfg.columns.filter(function(cl){ return !cl.periodOnly || showPeriod; });
      var visCols = expCols.filter(function(cl){ return !cl.screenHidden; });
      var dropIdx = (!showPeriod && cfg.periodExportIdx) ? cfg.periodExportIdx : [];
      var exportStatus = STATUS_COL==null ? null : STATUS_COL - dropIdx.filter(function(i){ return i<STATUS_COL; }).length;
      document.getElementById('cnt').textContent=list.length+' data';
      document.getElementById('tbl').innerHTML='<thead><tr class="border-b border-slate-200">'+visCols.map(function(cl){ return '<th class="text-left text-xs font-semibold text-slate-500 py-3.5 pr-4 leading-snug">'+esc(cl.label)+'</th>'; }).join('')+'</tr></thead>'+
        '<tbody>'+(list.length?list.map(function(r){ return '<tr class="border-b border-slate-100 hover:bg-slate-50">'+visCols.map(function(cl){ return '<td class="py-3 pr-4">'+cl.get(r)+'</td>'; }).join('')+'</tr>'; }).join(''):
        '<tr><td colspan="'+visCols.length+'" class="text-center text-slate-400 text-sm py-10">'+esc(cfg.emptyMsg)+'</td></tr>')+'</tbody>';
      var fromNow = fv('rpFrom'), toNow = fv('rpTo');
      bindExportBtns(cfg.filename+(cfg.dateFilter?periodSuffix(fromNow, toNow):''), cfg.title,
        cfg.dateFilter ? cfg.sub+' · '+periodLabel(fromNow, toNow) : cfg.sub, expCols.map(function(cl){ return cl.label; }),
        function(){ return filteredList.map(function(r){
          var row = cfg.exportRow(r);
          return dropIdx.length ? row.filter(function(_,i){ return dropIdx.indexOf(i)===-1; }) : row;
        }); }, exportStatus, cfg.statusFilter ? statusSummary(cardPool(), cfg.statusFilter.options) : null);
    }
    function load(){
      var qs = [];
      if(cfg.dateFilter){
        var from=fv('rpFrom'), to=fv('rpTo');
        if(from) qs.push('tgl_from='+encodeURIComponent(from));
        if(to) qs.push('tgl_to='+encodeURIComponent(to));
      }
      return apiFetch(cfg.endpoint+(qs.length?'?'+qs.join('&'):'')).then(function(data){
        rows=data;
        var seen={}, opts=[];
        rows.forEach(function(r){ if(r.project_id && !seen[r.project_id]){ seen[r.project_id]=1; opts.push({id:r.project_id, nama:r.project_nama}); } });
        opts.sort(function(a,b){ return a.nama.localeCompare(b.nama); });
        var projSel = document.getElementById('fProj');
        var curProj = (pending && pending.projId!=null) ? pending.projId : fv('fProj');
        pending = null;
        projSel.innerHTML = '<option value="">Semua Proyek</option>'+
          opts.map(function(p){ return '<option value="'+esc(p.id)+'"'+(p.id===curProj?' selected':'')+'>'+esc(p.nama)+'</option>'; }).join('');
        if(projSel._enhanced) projSel.dispatchEvent(new Event('ss-refresh'));
        else enhanceSelect(projSel);
        draw();
      }).catch(function(e){ toast('Gagal memuat: '+e.message, true); });
    }
    load().then(function(){
      document.getElementById('q').addEventListener('input',draw);
      document.getElementById('fProj').addEventListener('change',draw);
      if(cfg.statusFilter) document.getElementById('fStatus').addEventListener('change',draw);
      if(cfg.dateFilter){
        var setPeriod = function(v){ document.getElementById('exPeriod').value = v; };
        document.getElementById('rpFrom').addEventListener('change', function(){ setPeriod('kustom'); load(); });
        document.getElementById('rpTo').addEventListener('change', function(){ setPeriod('kustom'); load(); });
        document.getElementById('exPeriod').onchange = function(){
          var r = periodRange(this.value);
          document.getElementById('rpFrom').value = r.from;
          document.getElementById('rpTo').value = r.to;
          load();
        };
        document.getElementById('rpDateReset').onclick = function(){
          document.getElementById('rpFrom').value='';
          document.getElementById('rpTo').value='';
          setPeriod('semua');
          load();
        };
      }
    });
  };
}

  }
  // Admin Pusat can correct a mistaken entry here (wrong qty, wrong
  // bahan, typo'd referensi) without asking the field admin to re-enter
  // it — unlike the mobile Riwayat (Admin Lapangan), which is read-only.
  function del(id){

  function form(id){
    var r = rows.find(function(x){ return x.id===id; });
    if(!r) return;
    var isMasuk = r.jenis==='Masuk';
    var html = '<div class="space-y-4">'+
      '<div><label class="block text-xs font-semibold text-slate-500 mb-1.5">Proyek *</label><select id="f_project_id" class="'+fieldCls+'">'+
        projects.map(function(p){ return '<option value="'+esc(p.id)+'"'+(p.id===r.project_id?' selected':'')+'>'+esc(p.nama)+'</option>'; }).join('')+
      '</select></div>'+
      '<div><label class="block text-xs font-semibold text-slate-500 mb-1.5">Bahan *</label><select id="f_material_id" class="'+fieldCls+'">'+
        materials.map(function(m){ return '<option value="'+esc(m.id)+'"'+(m.id===r.material_id?' selected':'')+'>'+esc(m.nama)+' ('+esc(m.satuan)+')</option>'; }).join('')+
      '</select></div>'+
      (isMasuk ? '' : '<div><label class="block text-xs font-semibold text-slate-500 mb-1.5">Pekerjaan</label><select id="f_pekerjaan_id" class="'+fieldCls+'">'+
        '<option value="">— Tidak ada —</option>'+
        pekerjaanList.filter(function(pk){ return pk.project_id===r.project_id; }).map(function(pk){ return '<option value="'+esc(pk.id)+'"'+(pk.id===r.pekerjaan_id?' selected':'')+'>'+esc(pk.nama)+'</option>'; }).join('')+
      '</select></div>')+
      '<div><label class="block text-xs font-semibold text-slate-500 mb-1.5">Tanggal *</label><input id="f_tgl" type="date" value="'+esc(r.tgl)+'" class="'+fieldCls+'"></div>'+
      '<div><label class="block text-xs font-semibold text-slate-500 mb-1.5">Qty *</label>'+numInputHtml('f_qty', r.qty, fieldCls)+'</div>'+
      (isMasuk ? '<div><label class="block text-xs font-semibold text-slate-500 mb-1.5">No. Surat Jalan / Nota</label><input id="f_ref" type="text" value="'+esc(r.ref)+'" class="'+fieldCls+'"></div>' : '')+
      '<div><label class="block text-xs font-semibold text-slate-500 mb-1.5">Keterangan</label><input id="f_ket" type="text" value="'+esc(r.ket)+'" class="'+fieldCls+'"></div>'+
      '</div>';
    openModal('Edit '+(isMasuk?'Bahan Masuk':'Pemakaian'), html, function(){
      var qty = parseIdNum(fv('f_qty'));
      if(!qty || qty<=0){ toast('Qty wajib diisi dan lebih dari 0.', true); return; }
      var payload = {
        id: id, project_id: fv('f_project_id'), material_id: fv('f_material_id'),
        tgl: fv('f_tgl'), qty: qty, ket: fv('f_ket'),
      };
      var endpoint;
      if(isMasuk){ payload.no_referensi = fv('f_ref'); endpoint = '/material_receipts.php'; }
      else { payload.pekerjaan_id = fv('f_pekerjaan_id') || null; endpoint = '/material_usage.php'; }
      apiFetch(endpoint, {method:'POST', body:JSON.stringify(payload)})
        .then(function(){ closeModal(); toast('Data diperbarui.'); refresh(); })
        .catch(function(e){ toast('Gagal menyimpan: '+e.message, true); });
    });
  }
  function refresh(){
    Promise.all([
      apiFetch('/material_receipts.php'), apiFetch('/material_usage.php'),
      apiFetch('/projects.php'), apiFetch('/materials.php'), apiFetch('/pekerjaan.php'),
    ]).then(function(r){
      var receipts=r[0], usage=r[1];
      projects=r[2]; materials=r[3]; pekerjaanList=r[4];
      var projName=function(id){ var p=projects.find(function(x){ return x.id===id; }); return p?p.nama:id; };
      var matName=function(id){ var m=materials.find(function(x){ return x.id===id; }); return m?m.nama:id; };
      var matSatuan=function(id){ var m=materials.find(function(x){ return x.id===id; }); return m?m.satuan:''; };
      var pkName=function(id){ var pk=pekerjaanList.find(function(x){ return x.id===id; }); return pk?pk.nama:''; };
      rows = receipts.map(function(x){ return {id:x.id, jenis:'Masuk', tgl:x.tgl, project_id:x.project_id, project_nama:projName(x.project_id), material_id:x.material_id, material_nama:matName(x.material_id), satuan:matSatuan(x.material_id), qty:Number(x.qty)||0, ref:x.no_referensi||'', ket:x.ket||''}; })
        .concat(usage.map(function(x){ return {id:x.id, jenis:'Pemakaian', tgl:x.tgl, project_id:x.project_id, project_nama:projName(x.project_id), material_id:x.material_id, material_nama:matName(x.material_id), satuan:matSatuan(x.material_id), qty:Number(x.qty)||0, pekerjaan_id:x.pekerjaan_id||'', ref:x.pekerjaan_id?pkName(x.pekerjaan_id):'', ket:x.ket||''}; }));
      rows.sort(function(a,b){ return a.tgl<b.tgl?1:(a.tgl>b.tgl?-1:0); });
      var curProj = (pending && pending.projId!=null) ? pending.projId : fv('fProj');
      document.getElementById('fProj').innerHTML = '<option value="">Semua Proyek</option>'+
        projects.slice().sort(function(a,b){ return a.nama.localeCompare(b.nama); }).map(function(p){ return '<option value="'+esc(p.id)+'"'+(p.id===curProj?' selected':'')+'>'+esc(p.nama)+'</option>'; }).join('');
      if(document.getElementById('fProj')._enhanced) document.getElementById('fProj').dispatchEvent(new Event('ss-refresh'));
      else enhanceSelect(document.getElementById('fProj'));
      pending = null;
      draw();
    }).catch(function(e){ toast('Gagal memuat: '+e.message, true); });
  }
  refresh();
  document.getElementById('q').addEventListener('input', draw);
  document.getElementById('fProj').addEventListener('change', draw);
  document.getElementById('fJenis').addEventListener('change', draw);
  document.getElementById('fFrom').addEventListener('change', draw);
  document.getElementById('fTo').addEventListener('change', draw);
  document.getElementById('btnResetFilter').onclick=function(){
    document.getElementById('q').value=''; document.getElementById('fProj').value=''; document.getElementById('fJenis').value='';
    document.getElementById('fFrom').value=''; document.getElementById('fTo').value='';
    draw();
  };
};

    {value:'BELUM_ADA_HITUNGAN', label:'Belum Ada Hitungan'},
    {value:'BELUM_ADA_TRANSAKSI', label:'Belum Ada Transaksi'},

  emptyMsg:'Belum ada data bahan masuk/pemakaian.',
  columns:[
    {label:'Proyek', get:function(r){ return esc(r.project_nama); }},
    {label:'Bahan', get:function(r){ return '<b>'+esc(r.material_nama)+'</b> <span class="text-xs text-slate-400">'+esc(r.satuan)+'</span>'; }},
    {label:'Satuan', screenHidden:true, get:function(r){ return esc(r.satuan); }},
    {label:'Total Masuk', get:function(r){ return num0(r.total_masuk); }},
    {label:'Total Pemakaian', get:function(r){
      return num0(r.total_keluar)+

        : '';
      var hilang = (r.tidak_tercatat!=null && r.tidak_tercatat>0.001)
        ? '<div class="text-xs font-semibold text-red-600 mt-0.5" title="Material keluar dari lapangan tetapi tidak tercatat sebagai pemakaian">⚠ '+num0(r.tidak_tercatat)+' tidak tercatat</div>'
        : '';
      return '<b>'+num0(r.stok)+'</b>'+(fv('rpTo')?' <span class="text-xs text-slate-400">per '+esc(fv('rpTo'))+'</span>':'')+fisik+hilang;

    {label:'Pesan Ulang Saat', get:function(r){

      var src = r.rate_source==='FISIK' ? 'dari hitungan fisik' : 'dari pemakaian';
      return '<b class="text-slate-800">'+num0(r.reorder_point)+'</b> <span class="text-xs text-slate-400" title="laju '+num0(r.daily_usage_rate)+'/hari × '+r.reorder_cover_hari+' hari">'+src+'</span>';
    }},
    {label:'Masuk Periode Ini', periodOnly:true, get:function(r){

      return num0(r.masuk_periode);
    }},
    {label:'Pemakaian Periode Ini', periodOnly:true, get:function(r){
      if(!fv('rpFrom') && !fv('rpTo')) return '<span class="text-slate-300 italic" title="Atur Dari/Sampai untuk lihat pergerakan periode ini">–</span>';
      return num0(r.keluar_periode);
    }},
    {label:'Perkiraan Habis', get:function(r){
      // Simple run-rate forecast (days-of-supply): avg daily usage
      // observed so far, projected against current stock. Only shown
      // when usage logging is active and recent — a rate from stale or
      // near-zero data would just be a confident-looking wrong number.
      if(r.forecast_date==null) return '<span class="text-slate-300 italic" title="Butuh riwayat Pemakaian yang aktif (bukan data lama) untuk dihitung">— belum cukup data</span>';

      var m=map[r.status]||['neutral',r.status];

  },
});
