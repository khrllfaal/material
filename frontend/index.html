        '<div><label class="block text-xs font-semibold text-slate-500 mb-1.5">Jenis</label>'+
        '<select id="fJenis" class="px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-100">'+
          '<option value="">Semua</option><option value="Masuk">Bahan Masuk</option><option value="Pemakaian">Pemakaian</option>'+
        '</select></div>'+
        '<div><label class="block text-xs font-semibold text-slate-500 mb-1.5">Dari Tanggal</label>'+
        '<input type="date" id="fFrom" class="px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-100"></div>'+
        '<div><label class="block text-xs font-semibold text-slate-500 mb-1.5">Sampai Tanggal</label>'+
        '<input type="date" id="fTo" class="px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-100"></div>'+
        '<button id="btnResetFilter" class="'+btnGhostSm+'">Reset</button>'+
        '<span class="text-xs text-slate-400 ml-auto self-center" id="cnt"></span>'+
      '</div>'+
      TBL_WRAP
    );
  enhanceClearable(document.getElementById('q'));

  var rows=[], filteredList=[], projects=[], materials=[], pekerjaanList=[], PG={page:1};
  var pending = STATE.pendingFilter; STATE.pendingFilter = null;
  if(pending && pending.q!=null) document.getElementById('q').value = pending.q;
  var canEdit = !isOwner();
  var cols=[
    {label:'Tanggal', get:function(r){ return '<span class="whitespace-nowrap">'+esc(r.tgl)+'</span>'; }},
    {label:'Jenis', get:function(r){ return r.jenis==='Masuk' ? badge('aman','Bahan Masuk') : badge('warn','Pemakaian'); }},
    {label:'Proyek', get:function(r){ return esc(r.project_nama); }},
    {label:'Bahan', get:function(r){ return '<b>'+esc(r.material_nama)+'</b>'; }},
    {label:'Qty', get:function(r){ return (r.jenis==='Masuk'?'+':'−')+num0(r.qty); }},
    {label:'Satuan', get:function(r){ return esc(r.satuan); }},
    {label:'Pekerjaan / Referensi', get:function(r){ return r.ref?esc(r.ref):'<span class="text-slate-300 italic">–</span>'; }},
    {label:'Keterangan', get:function(r){ return r.ket?esc(r.ket):'<span class="text-slate-300 italic">–</span>'; }},
  ].concat(canEdit ? [{label:'Aksi', get:function(r){
    return '<button class="'+btnGhostSm+'" data-edit="'+esc(r.id)+'">Edit</button> '+
      '<button class="'+btnDangerSm+'" data-del="'+esc(r.id)+'">Hapus</button>';
  }}] : []);
  function exportRow(r){ return [r.tgl, r.jenis, r.project_nama, r.material_nama, (r.jenis==='Masuk'?r.qty:-r.qty), r.satuan, r.ref||'', r.ket||'']; }
  function draw(keep){
    if(keep!==true) PG.page=1;
    var q=fv('q').toLowerCase(), jenis=fv('fJenis'), from=fv('fFrom'), to=fv('fTo'), projId=fv('fProj');
    filteredList = rows.filter(function(r){
      if(jenis && r.jenis!==jenis) return false;
      if(projId && r.project_id!==projId) return false;
      if(from && r.tgl<from) return false;
      if(to && r.tgl>to) return false;
      if(q && (r.project_nama+' '+r.material_nama+' '+(r.ket||'')).toLowerCase().indexOf(q)===-1) return false;
      return true;
    });
    var list=filteredList;
    document.getElementById('cnt').textContent=list.length+' data';
    document.getElementById('tbl').innerHTML='<thead><tr>'+cols.map(function(cl){ return '<th class="'+TH_CLS+'">'+esc(cl.label)+'</th>'; }).join('')+'</tr></thead>'+
      '<tbody>'+(list.length?pagedSlice(list,PG).map(function(r){ return '<tr class="border-b border-slate-100 hover:bg-indigo-50/40">'+cols.map(function(cl){ return '<td class="py-3 pr-4">'+cl.get(r)+'</td>'; }).join('')+'</tr>'; }).join(''):
      '<tr><td colspan="'+cols.length+'" class="text-center text-slate-400 text-sm py-10">Tidak ada data pada rentang/filter ini.</td></tr>')+'</tbody>';
    renderPager(list.length, PG, draw);
    bindExportBtns('Riwayat_Transaksi', 'Riwayat Transaksi (Semua Proyek)',
      (from||to) ? ('Periode '+(from||'awal')+' s/d '+(to||'sekarang')) : 'Seluruh riwayat',
      cols.map(function(cl){ return cl.label; }).filter(function(l){ return l!=='Aksi'; }),
      function(){ return filteredList.map(exportRow); });
    if(!canEdit) return;
    document.querySelectorAll('[data-edit]').forEach(function(b){ b.onclick=function(){ form(b.getAttribute('data-edit')); }; });
    document.querySelectorAll('[data-del]').forEach(function(b){ b.onclick=function(){ del(b.getAttribute('data-del')); }; });
  }
  // Admin Pusat can correct a mistaken entry here (wrong qty, wrong
  // bahan, typo'd referensi) without asking the field admin to re-enter
  // it — unlike the mobile Riwayat (Admin Lapangan), which is read-only.
  function del(id){
    var r = rows.find(function(x){ return x.id===id; });
    if(!r) return;
    confirmModal('Hapus Data', 'Yakin mau menghapus data '+(r.jenis==='Masuk'?'Bahan Masuk':'Pemakaian')+' ini? Tindakan ini tidak bisa dibatalkan.', function(){
      var endpoint = r.jenis==='Masuk' ? '/material_receipts.php' : '/material_usage.php';
      apiFetch(endpoint+'?id='+encodeURIComponent(id), {method:'DELETE'})
        .then(function(){ toast('Data dihapus.'); refresh(); })
        .catch(function(e){ toast('Gagal menghapus: '+e.message, true); });
    });
  }
  function form(id){
    var r = rows.find(function(x){ return x.id===id; });
    if(!r) return;
    var isMasuk = r.jenis==='Masuk';
    var html = '<div class="space-y-4">'+
      '<div><label class="block text-xs font-semibold text-slate-500 mb-1.5">Proyek *</label><select id="f_project_id" class="'+fieldCls+'">'+
        projects.map(function(p){ return '<option value="'+esc(p.id)+'"'+(p.id===r.project_id?' selected':'')+'>'+esc(p.nama)+'</option>'; }).join('')+
      '</select></div>'+
      '<div><label class="block text-xs font-semibold text-slate-500 mb-1.5">Bahan *</label><select id="f_material_id" class="'+fieldCls+'">'+
        materials.map(function(m){ return '<option value="'+esc(m.id)+'"'+(m.id===r.material_id?' selected':'')+'>'+esc(m.nama)+' ('+esc(m.satuan)+')</option>'; }).join('')+
      '</select></div>'+
      (isMasuk ? '' : '<div><label class="block text-xs font-semibold text-slate-500 mb-1.5">Pekerjaan</label><select id="f_pekerjaan_id" class="'+fieldCls+'">'+
        '<option value="">— Tidak ada —</option>'+
        pekerjaanList.filter(function(pk){ return pk.project_id===r.project_id; }).map(function(pk){ return '<option value="'+esc(pk.id)+'"'+(pk.id===r.pekerjaan_id?' selected':'')+'>'+esc(pk.nama)+'</option>'; }).join('')+
      '</select></div>')+
      '<div><label class="block text-xs font-semibold text-slate-500 mb-1.5">Tanggal *</label><input id="f_tgl" type="date" value="'+esc(r.tgl)+'" class="'+fieldCls+'"></div>'+
      '<div><label class="block text-xs font-semibold text-slate-500 mb-1.5">Qty *</label>'+numInputHtml('f_qty', r.qty, fieldCls)+'</div>'+
      (isMasuk ? '<div><label class="block text-xs font-semibold text-slate-500 mb-1.5">No. Surat Jalan / Nota</label><input id="f_ref" type="text" value="'+esc(r.ref)+'" class="'+fieldCls+'"></div>' : '')+
      '<div><label class="block text-xs font-semibold text-slate-500 mb-1.5">Keterangan</label><input id="f_ket" type="text" value="'+esc(r.ket)+'" class="'+fieldCls+'"></div>'+
      '</div>';
    openModal('Edit '+(isMasuk?'Bahan Masuk':'Pemakaian'), html, function(){
      var qty = parseIdNum(fv('f_qty'));
      if(!qty || qty<=0){ toast('Qty wajib diisi dan lebih dari 0.', true); return; }
      var payload = {
        id: id, project_id: fv('f_project_id'), material_id: fv('f_material_id'),
        tgl: fv('f_tgl'), qty: qty, ket: fv('f_ket'),
      };
      var endpoint;
      if(isMasuk){ payload.no_referensi = fv('f_ref'); endpoint = '/material_receipts.php'; }
      else { payload.pekerjaan_id = fv('f_pekerjaan_id') || null; endpoint = '/material_usage.php'; }
      apiFetch(endpoint, {method:'POST', body:JSON.stringify(payload)})
        .then(function(){ closeModal(); toast('Data diperbarui.'); refresh(); })
        .catch(function(e){ toast('Gagal menyimpan: '+e.message, true); });
    });
  }
  function refresh(){
    Promise.all([
      apiFetch('/material_receipts.php'), apiFetch('/material_usage.php'),
      apiFetch('/projects.php'), apiFetch('/materials.php'), apiFetch('/pekerjaan.php'),
    ]).then(function(r){
      var receipts=r[0], usage=r[1];
      projects=r[2]; materials=r[3]; pekerjaanList=r[4];
      var projName=function(id){ var p=projects.find(function(x){ return x.id===id; }); return p?p.nama:id; };
      var matName=function(id){ var m=materials.find(function(x){ return x.id===id; }); return m?m.nama:id; };
      var matSatuan=function(id){ var m=materials.find(function(x){ return x.id===id; }); return m?m.satuan:''; };
      var pkName=function(id){ var pk=pekerjaanList.find(function(x){ return x.id===id; }); return pk?pk.nama:''; };
      rows = receipts.map(function(x){ return {id:x.id, jenis:'Masuk', tgl:x.tgl, project_id:x.project_id, project_nama:projName(x.project_id), material_id:x.material_id, material_nama:matName(x.material_id), satuan:matSatuan(x.material_id), qty:Number(x.qty)||0, ref:x.no_referensi||'', ket:x.ket||''}; })
        .concat(usage.map(function(x){ return {id:x.id, jenis:'Pemakaian', tgl:x.tgl, project_id:x.project_id, project_nama:projName(x.project_id), material_id:x.material_id, material_nama:matName(x.material_id), satuan:matSatuan(x.material_id), qty:Number(x.qty)||0, pekerjaan_id:x.pekerjaan_id||'', ref:x.pekerjaan_id?pkName(x.pekerjaan_id):'', ket:x.ket||''}; }));
      rows.sort(function(a,b){ return a.tgl<b.tgl?1:(a.tgl>b.tgl?-1:0); });
      var curProj = (pending && pending.projId!=null) ? pending.projId : fv('fProj');
      document.getElementById('fProj').innerHTML = '<option value="">Semua Proyek</option>'+
        projects.slice().sort(function(a,b){ return a.nama.localeCompare(b.nama); }).map(function(p){ return '<option value="'+esc(p.id)+'"'+(p.id===curProj?' selected':'')+'>'+esc(p.nama)+'</option>'; }).join('');
      if(document.getElementById('fProj')._enhanced) document.getElementById('fProj').dispatchEvent(new Event('ss-refresh'));
      else enhanceSelect(document.getElementById('fProj'));
      pending = null;
      draw();
    }).catch(function(e){ toast('Gagal memuat: '+e.message, true); });
  }
  refresh();
  document.getElementById('q').addEventListener('input', draw);
  document.getElementById('fProj').addEventListener('change', draw);
  document.getElementById('fJenis').addEventListener('change', draw);
  document.getElementById('fFrom').addEventListener('change', draw);
  document.getElementById('fTo').addEventListener('change', draw);
  document.getElementById('btnResetFilter').onclick=function(){
    document.getElementById('q').value=''; document.getElementById('fProj').value=''; document.getElementById('fJenis').value='';
    document.getElementById('fFrom').value=''; document.getElementById('fTo').value='';
    draw();
  };
};

function terbilang(n){
  n = Math.floor(Math.abs(Number(n)||0));
  var sat = ['','satu','dua','tiga','empat','lima','enam','tujuh','delapan','sembilan','sepuluh','sebelas'];
  function f(x){
    if(x<12) return sat[x];
    if(x<20) return f(x-10)+' belas';
    if(x<100) return f(Math.floor(x/10))+' puluh'+(x%10 ? ' '+f(x%10) : '');
    if(x<200) return 'seratus'+(x-100 ? ' '+f(x-100) : '');
    if(x<1000) return f(Math.floor(x/100))+' ratus'+(x%100 ? ' '+f(x%100) : '');
    if(x<2000) return 'seribu'+(x-1000 ? ' '+f(x-1000) : '');
    if(x<1e6) return f(Math.floor(x/1e3))+' ribu'+(x%1e3 ? ' '+f(x%1e3) : '');
    if(x<1e9) return f(Math.floor(x/1e6))+' juta'+(x%1e6 ? ' '+f(x%1e6) : '');
    if(x<1e12) return f(Math.floor(x/1e9))+' miliar'+(x%1e9 ? ' '+f(x%1e9) : '');
    return f(Math.floor(x/1e12))+' triliun'+(x%1e12 ? ' '+f(x%1e12) : '');
  }
  return n===0 ? 'nol' : f(n);
}

  /* ---- Pembukuan & Jurnal ---- */
  function buildJurnal(){
    var proj = fv('fProj'), ev = [];
    G.data.periods.forEach(function(p){
      if(p.status!=='disetujui' && p.status!=='dibayar') return;
      if(!(p.hari>0 || p.adjustments.length)) return;
      var kas = 0, pot = 0;
      p.adjustments.forEach(function(a){ if(a.jenis==='potong'){ if(a.kategori==='kasbon') kas += a.jumlah; else pot += a.jumlah; } });
      var beban = p.gaji + p.lembur_rp + p.adj_tambah - pot;
      var lbl = p.project_nama+' · '+fmtTglPendek(p.tgl_mulai)+'–'+fmtTglPendek(p.tgl_akhir);
      if(beban>0.5) ev.push({tgl:p.tgl_akhir, ket:'Beban upah '+lbl, lines:[['Beban Upah – '+p.project_nama, beban, 0],['Hutang Upah', 0, beban]]});
      if(kas>0.5) ev.push({tgl:p.tgl_akhir, ket:'Kasbon dipotong dari gaji '+lbl, lines:[['Hutang Upah', kas, 0],['Piutang Kasbon', 0, kas]]});
      var g = {}; p.payments.forEach(function(x){ var k = x.tgl_bayar+'|'+x.metode; g[k] = (g[k]||0)+x.jumlah; });
      Object.keys(g).forEach(function(k){
        var parts = k.split('|'), v = g[k], akun = parts[1]==='transfer' ? 'Bank' : 'Kas', neg = v<0; v = Math.abs(v);
        if(v<0.5) return;
        ev.push({tgl:parts[0], ket:'Pembayaran upah '+lbl+' ('+(parts[1]==='transfer'?'transfer':'tunai')+')', lines: neg ? [[akun, v, 0],['Hutang Upah', 0, v]] : [['Hutang Upah', v, 0],[akun, 0, v]]});
      });
    });
    ((G.shared.ledger && G.shared.ledger.kasbon) || []).forEach(function(k){
      if((proj && k.project_id!==proj) || k.tgl<G.from || k.tgl>G.to) return;
      var nm = k.worker_nama || (k.tim ? timLabel(k.tim) : 'Grup / penanggung jawab');
      if(k.jumlah < 0) ev.push({tgl:k.tgl, ket:'Pelunasan kasbon · '+nm+' · '+k.project_nama, lines:[['Kas', -k.jumlah, 0],['Piutang Kasbon', 0, -k.jumlah]]});
      else ev.push({tgl:k.tgl, ket:'Kasbon diberikan · '+nm+' · '+k.project_nama, lines:[['Piutang Kasbon', k.jumlah, 0],['Kas', 0, k.jumlah]]});
    });
    ev.sort(function(a,b){ return a.tgl<b.tgl ? -1 : (a.tgl>b.tgl ? 1 : 0); });
    var rows = [], n = 0, D = 0, K = 0;
    ev.forEach(function(e){ n++; var no = 'JU-'+String(n).padStart(3,'0');
      e.lines.forEach(function(l, i){ rows.push([i===0?e.tgl:'', i===0?no:'', i===0?e.ket:'', (l[2]>0?'    ':'')+l[0], l[1]>0?Math.round(l[1]):'', l[2]>0?Math.round(l[2]):'']); D += l[1]; K += l[2]; });
    });
    return {rows:rows, debit:Math.round(D), kredit:Math.round(K), n:n};
  }

  /* ---- Evaluasi ---- */
  function evalData(){
    var rows = G.data.rows, work = {};
    rows.forEach(function(r){ Object.keys(r.days).forEach(function(d){ if(r.days[d][0] > 0){ (work[r.project_id] = work[r.project_id] || {})[d] = 1; } }); });
    var people = rows.filter(function(r){ return r.hari>0 || Object.keys(r.days).length; }).map(function(r){
      var wd = Object.keys(work[r.project_id] || {}).length;
      var absen = Object.keys(r.days).filter(function(d){ return r.days[d][0]===0 && (work[r.project_id]||{})[d]; }).length;
      return {r:r, wd:wd, absen:absen, pct: wd ? Math.min(1, r.hari/wd) : 0};
    });
    var tims = {};
    people.forEach(function(x){
      var k = x.r.project_id+'|'+(x.r.tim||'');
      var t = tims[k] = tims[k] || {nama:x.r.tim||'(tanpa tim)', proyek:x.r.project_nama, n:0, hari:0, lembur:0, net:0, pctSum:0};
      t.n++; t.hari += x.r.hari; t.lembur += x.r.lembur_jam; t.net += x.r.net; t.pctSum += x.pct;
    });
    return {people:people, tims:Object.keys(tims).map(function(k){ return tims[k]; }).sort(function(a,b){ return (a.proyek+a.nama).localeCompare(b.proyek+b.nama); })};
  }

  function periodData(p){
    return apiFetch('/payroll.php?project_id='+encodeURIComponent(p.project_id)+'&tgl_from='+p.tgl_mulai+'&tgl_to='+p.tgl_akhir).then(function(d){
      return {period:d.periods.find(function(x){ return x.id===p.id; })||p, rows:d.rows, totals:d.totals};
    });
  }
  function exportDaftarBayar(p){
    periodData(p).then(function(d){
      var rows = d.rows.filter(function(r){ return r.net>0 || r.hari>0; }).map(function(r, i){
        return [i+1, r.nama, r.grade_nama, r.tim, r.hari, Math.round(r.net), Math.round(r.dibayar), Math.round(r.sisa), ''];
      });
      var sum = function(i){ return rows.reduce(function(a,r){ return a+(Number(r[i])||0); }, 0); };
      rows.push(['', 'TOTAL PEKERJA', '', '', sum(4), sum(5), sum(6), sum(7), '']);
      var g = d.period;
      if(Math.abs(g.grup_net)>0.5) rows.push(['', 'Penyesuaian grup (tambahan - potongan)', '', '', '', Math.round(g.grup_net), '', '', '']);
      rows.push(['', 'TOTAL PEMBAYARAN', '', '', '', Math.round(g.total_bayar), Math.round(g.dibayar), Math.round(g.sisa), '']);
      exportPdf('Daftar Pembayaran Upah — '+p.project_nama, 'Periode '+p.tgl_mulai+' s/d '+p.tgl_akhir+(g.pj_nama?' · PJ '+g.pj_nama:'')+(g.grup_nama?' · '+g.grup_nama:''),
        ['No','Nama','Status','Tim','Hari','Diterima (Rp)','Dibayar','Sisa','Tanda tangan'], rows, {});
    }).catch(function(e){ toast(e.message, true); });
  }

      G.from = from; G.to = to;
      document.getElementById('gjFrom').value = G.from; document.getElementById('gjTo').value = G.to;
      var sel = document.getElementById('gjPreset'); sel.value = 'kustom'; G.preset = 'kustom'; sel.dispatchEvent(new Event('ss-refresh'));
      if(msg) toast(msg);
    };
    return apiFetch('/payroll_periods.php').catch(function(){ return []; }).then(function(l){
      var pending = l.filter(function(x){ return x.status==='diajukan' || x.status==='disetujui'; });
      if(!REKAP && isAk && pending.length){
        // Accountant lands on the weeks that are submitted and waiting to be checked / paid.
        var asc = pending.slice().sort(function(a,b){ return a.tgl_mulai < b.tgl_mulai ? -1 : 1; });
        setRange(asc[0].tgl_mulai, asc[asc.length-1].tgl_akhir, 'Menampilkan periode yang perlu diperiksa/dibayar ('+pending.length+').');
      } else {
        // Everybody else: if the chosen week has nothing, jump to the latest week that has data.
        var wd = l.filter(function(x){ return x.n_absen > 0; });
        if(wd.length && !wd.some(function(x){ return x.tgl_mulai <= G.to && x.tgl_akhir >= G.from; })){
          var latest = wd.slice().sort(function(a,b){ return a.tgl_mulai < b.tgl_mulai ? 1 : -1; })[0];
          setRange(latest.tgl_mulai, latest.tgl_akhir, 'Minggu ini belum ada data. Menampilkan minggu terakhir yang ada datanya ('+fmtTglPendek(latest.tgl_mulai)+' – '+fmtTglPendek(latest.tgl_akhir)+').');
        }
      }
      return load();
    });
  });
  var onv = function(id, ev, fn){ var el = document.getElementById(id); if(el) el.addEventListener(ev, fn); };
  onv('q','input', function(){ G.PG.page=1; if(G.data) draw(); });
  onv('gjBayar','change', function(){ G.PG.page=1; if(G.data) draw(); });
  onv('gjTim','change', function(){ G.PG.page=1; if(G.data) draw(); });
  onv('fProj','change', function(){ G.PG.page=1; load(); });
  onv('gjPreset','change', function(){ if(this.value!=='kustom'){ setPreset(this.value); } G.PG.page=1; load(); });
  ['gjFrom','gjTo'].forEach(function(id){
    document.getElementById(id).addEventListener('change', function(){
      var f = fv('gjFrom'), t = fv('gjTo');
      if(!f || !t) return;
      if(t < f){ toast('Tanggal sampai harus setelah tanggal dari.', true); return; }
      G.from = f; G.to = t;
      var sel = document.getElementById('gjPreset'); sel.value = 'kustom'; sel.dispatchEvent(new Event('ss-refresh'));
      G.PG.page=1; load();
    });
  });
  drawTabsBar();
}

  singles.forEach(function(s){ var c = cK+s[1]; ws.mergeCells(H1,c,H2,c); put(H1,c,s[0],{bold:true,h:'center',fill:hdrFill,box:true,wrap:true}); box(ws.getCell(H2,c)); });

  var buf = await wb.xlsx.writeBuffer();
  var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([buf], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));
  a.download = 'Absen_Upah_'+filenameFromTitle(period.project_nama||'proyek')+(tim?'_'+filenameFromTitle(tim):'')+'_'+period.tgl_mulai+'_sd_'+period.tgl_akhir+'.xlsx';
  document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(a.href);
}

/* Kasbon, used inside the two pay screens:
   part "requests" (Pengajuan): what the field asked for -> Akuntan approves / rejects, plus recording a kasbon directly;
   part "ledger"   (Rekap & Pembukuan): running balance per person and the history of kasbon given.
   opts.getFilter() -> {project_id, from, to};  opts.onChange() runs after anything was saved. */
function kasbonView(c, part, opts){
  opts = opts || {};
  var write = canWritePay(), isAk = STATE.user.role==='akuntan';
  var K = {data:{kasbon:[], saldo:[]}, projects:[], workers:[], req:[]};
  var flt = function(){ return (opts.getFilter && opts.getFilter()) || {project_id:'', from:'', to:''}; };
  c.innerHTML = (part==='requests' && write ? '<div class="flex justify-end gap-2 mb-3 flex-wrap"><button class="'+btnGhostSm+' flex items-center gap-1" id="btnPelunasan"><i data-lucide="check-circle-2" class="w-3.5 h-3.5"></i>Catat Pelunasan</button><button class="'+btnPrimary+'" id="btnAddKasbon"><i data-lucide="plus" class="w-4 h-4"></i>Catat Kasbon</button></div>' : '')+
    (part==='requests' ? '<div id="ksReq"></div>' : '<div class="grid lg:grid-cols-2 gap-5"><div id="ksSaldo"></div><div id="ksRiwayat"></div></div>');
  icons();
  function drawReq(){
    var f = flt();
    var inProj = function(r){ return !f.project_id || r.project_id===f.project_id; };
    var pendRows = (K.req||[]).filter(function(r){ return r.status==='diajukan' && inProj(r); });
    var doneRows = (K.req||[]).filter(function(r){ return r.status!=='diajukan' && inProj(r); }).slice(0, 24);
    var host = document.getElementById('ksReq'); if(!host) return;
    // rows of one request (same batch) are decided together; a single row is its own card
    var group = function(rows){ var gs = [], ix = {}; rows.forEach(function(r){ var key = r.batch_id || r.id; if(!(key in ix)){ ix[key] = gs.length; gs.push({key:key, batch:r.batch_id, rows:[]}); } gs[ix[key]].rows.push(r); }); return gs; };
    var pend = group(pendRows), done = group(doneRows).slice(0, 8);
    var sumJ = function(g){ return g.rows.reduce(function(a,r){ return a+r.jumlah; },0); };
    var chip = function(st){ return st==='disetujui' ? badge('aman','Disetujui') : badge('danger','Ditolak'); };
    host.innerHTML = panel('<div class="flex items-center gap-2 mb-3"><div class="font-extrabold text-slate-800">Pengajuan kasbon dari lapangan</div>'+(pendRows.length?'<span class="text-xs font-bold px-2 py-0.5 rounded-full bg-amber-100 text-amber-800">'+pend.length+' pengajuan menunggu dicek</span>':'')+'</div>'+
      (pend.length ? '<div class="space-y-3">'+pend.map(function(g){
        var r0 = g.rows[0];
        return '<div class="rounded-xl border border-slate-200 p-3.5"><div class="flex items-start justify-between gap-3 flex-wrap"><div class="min-w-0">'+

function bootMobile(user){
  document.getElementById('mWhoName').textContent = user.nama;
  document.getElementById('mWhoRole').textContent = 'Admin Lapangan';
  updateSyncBadge();
  Promise.all([
    apiFetch('/projects.php'),
    apiFetch('/materials.php'),
    apiFetch('/pekerjaan.php'),
  ]).then(function(r){
    saveMasters(r);
    startMobile(user, r[0], r[1], r[2]);
    flushOutbox();
  }).catch(function(e){
    var c = e.network ? loadMasters() : null;
    if(c){
      startMobile(user, c.projects, c.materials, c.pekerjaan);
      toast('Tidak ada sinyal. Memakai data master yang tersimpan di perangkat.');
    } else {
      toast('Gagal memuat data: ' + e.message, true);
    }
  });
}

function startMobile(user, allProjects, materials, pekerjaan){
  STATE.materials = materials;
  if(Array.isArray(user.projectIds)){
    var scope = user.projectIds;
    STATE.projects = allProjects.filter(function(p){ return scope.indexOf(p.id) > -1; });
  } else {
    STATE.projects = allProjects;
  }
  STATE.pekerjaanAll = pekerjaan;
  if(!STATE.projects.length){
    document.getElementById('mProjSel').innerHTML =
      '<div class="bg-white rounded-2xl p-6 text-center text-sm text-slate-400 shadow-sm border border-slate-200">Belum ada proyek yang ditugaskan ke akun Anda.<br>Hubungi Admin Pusat.</div>';
    return;
  }
  STATE.projectId = STATE.projects[0].id;
  STATE.section = lsGet('ms_section', 'bahan') === 'absen' ? 'absen' : 'bahan';
  document.body.classList.add('is-mobile');
  renderProjSel();
  renderNavBar();
  renderTabs();
  renderTab();
}

function renderProjSel(){
  var el = document.getElementById('mProjSel');
  if(STATE.projects.length <= 1){
    el.innerHTML = STATE.projects.length ?
      '<div class="bg-white rounded-2xl px-4 py-3 shadow-sm border border-slate-200 flex items-center gap-2.5">'+
      '<i data-lucide="building-2" class="w-4 h-4 text-emerald-600"></i>'+
      '<span class="font-bold text-[15px]">'+esc(STATE.projects[0].nama)+'</span></div>' : '';
    icons();
    return;
  }
  el.innerHTML =
    '<select id="projPick" class="w-full bg-white border border-slate-200 rounded-2xl px-4 py-3.5 font-bold text-[15px] shadow-sm focus:outline-none focus:ring-2 focus:ring-emerald-100">'+
    STATE.projects.map(function(p){ return '<option value="'+esc(p.id)+'"'+(p.id===STATE.projectId?' selected':'')+'>'+esc(p.nama)+'</option>'; }).join('') +
    '</select>';
  document.getElementById('projPick').onchange = function(e){ STATE.projectId = e.target.value; renderTab(); };
  enhanceSelect(document.getElementById('projPick'));
  icons();
}

function pekerjaanForProject(){
  return (STATE.pekerjaanAll||[]).filter(function(pk){ return pk.project_id === STATE.projectId; });
}

/* Two big sections on the bottom bar (thumb reach): Bahan and Absen.
   Inside Bahan, four short sub-tabs fit the screen width — nothing scrolls
   sideways and nothing is hidden off-screen. */
var TABS = [
  {id:'masuk', label:'Masuk'},
  {id:'pakai', label:'Pakai'},
  {id:'stok', label:'Stok'},
  {id:'riwayat', label:'Riwayat'},
];
var SECTIONS = [{id:'bahan', label:'Bahan', icon:'truck'}, {id:'absen', label:'Absen', icon:'hard-hat'}];
function setSection(id){
  STATE.section = id; lsSet('ms_section', id);
  renderNavBar(); renderTabs(); renderTab();
  window.scrollTo(0, 0);
}
function renderNavBar(){
  var nav = document.getElementById('mNav'); if(!nav) return;
  nav.innerHTML = '<div class="max-w-[560px] mx-auto grid grid-cols-2">'+SECTIONS.map(function(x){
    var on = x.id===STATE.section;
    return '<button type="button" data-sec="'+x.id+'" class="relative h-16 flex flex-col items-center justify-center gap-1 text-[12px] font-bold '+(on?'text-emerald-700':'text-slate-400')+'">'+
      (on?'<span class="absolute top-0 inset-x-8 h-1 rounded-b-full bg-emerald-600"></span>':'')+
      '<i data-lucide="'+x.icon+'" class="w-6 h-6"></i>'+x.label+'</button>';
  }).join('')+'</div>';
  nav.querySelectorAll('[data-sec]').forEach(function(b){ b.onclick = function(){ if(STATE.section!==b.getAttribute('data-sec')) setSection(b.getAttribute('data-sec')); }; });
  icons();
}
function renderTabs(){
  var el = document.getElementById('mTabs');
  if(STATE.section === 'absen'){ el.innerHTML = ''; el.classList.add('hidden'); return; }
  el.classList.remove('hidden');
  el.innerHTML = '<div class="grid grid-cols-4 gap-1 bg-slate-200/70 rounded-2xl p-1">'+TABS.map(function(t){
    var on = t.id===STATE.tab;
    return '<button data-tab="'+t.id+'" class="h-11 rounded-xl text-[13.5px] font-bold transition-colors '+(on ? 'bg-white text-emerald-700 shadow-sm' : 'text-slate-500')+'">'+esc(t.label)+'</button>';
  }).join('')+'</div>';
  el.querySelectorAll('[data-tab]').forEach(function(b){
    b.onclick = function(){ STATE.tab = b.getAttribute('data-tab'); renderTabs(); renderTab(); };
  });
}

function renderTab(){
  var c = document.getElementById('mContent');
  if(STATE.section === 'absen') return renderAbsen(c);
  if(STATE.tab === 'masuk') return renderInputForm(c, 'masuk');
  if(STATE.tab === 'pakai') return renderInputForm(c, 'pakai');
  if(STATE.tab === 'stok') return renderStok(c);
  if(STATE.tab === 'riwayat') return renderRiwayat(c);
}

function card(inner, extraCls){ return '<div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200 mb-3.5 '+(extraCls||'')+'">'+inner+'</div>'; }
function fieldWrap(label, inputHtml){
  return '<div class="mb-4"><label class="block text-xs font-bold text-slate-500 mb-1.5">'+esc(label)+'</label>'+inputHtml+'</div>';
}
var inputCls = "w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-[15px] focus:outline-none focus:ring-2 focus:ring-emerald-100 focus:border-emerald-500";

function materialOptions(selected){
  var list = STATE.materials;
  if(!list.length) return '<option value="">— Tidak ditemukan —</option>';
  // A plain <select> auto-selects its first option — without this
  // blank placeholder, the form silently started every entry on
  // whichever material happened to sort first, and an admin who didn't
  // notice could submit real data against the wrong bahan.
  return '<option value="">— Pilih Bahan —</option><option value="__new__">＋ Bahan belum ada? Tambah baru</option>' + list.map(function(m){
    return '<option value="'+esc(m.id)+'"'+(m.id===selected?' selected':'')+'>'+esc(m.nama)+' ('+esc(m.satuan)+')</option>';
  }).join('');
}
function pekerjaanOptions(selected){
  var list = pekerjaanForProject();
  if(!list.length) return '<option value="">— Tidak ada pekerjaan terdaftar —</option>';
  return '<option value="">— Pilih pekerjaan (opsional) —</option>' + list.map(function(pk){
    return '<option value="'+esc(pk.id)+'"'+(pk.id===selected?' selected':'')+'>'+esc(pk.nama)+'</option>';
  }).join('');
}

function renderInputForm(c, mode){
  var isMasuk = mode === 'masuk';
  var accent = isMasuk ? 'emerald' : 'amber';
  if(!STATE.materials.length){
    c.innerHTML = card('<div class="text-center text-sm text-slate-400 py-4">Belum ada Master Material.<br>Hubungi Admin Pusat untuk menambahkan.</div>');
    return;
  }
  c.innerHTML = card(
    '<div class="flex items-center gap-2.5 mb-5">'+
      '<div class="w-9 h-9 rounded-xl bg-'+accent+'-50 text-'+accent+'-600 flex items-center justify-center"><i data-lucide="'+(isMasuk?'truck':'hammer')+'" class="w-4.5 h-4.5"></i></div>'+
      '<h3 class="font-bold text-[15px]">'+(isMasuk?'Catat Bahan Masuk':'Catat Pemakaian Bahan')+'</h3>'+
    '</div>'+
    fieldWrap('Tanggal', '<input type="date" id="f_tgl" value="'+today()+'" class="'+inputCls+'">')+
    '<div class="mb-4"><div class="flex items-center justify-between mb-1.5"><label class="block text-xs font-bold text-slate-500">Material</label>'+
      '<button type="button" id="f_newmat" class="inline-flex items-center gap-1 text-[12px] font-bold text-'+accent+'-700 bg-'+accent+'-50 border border-'+accent+'-100 rounded-lg px-2.5 py-1.5"><i data-lucide="plus" class="w-3.5 h-3.5"></i>Bahan baru</button></div>'+
      '<select id="f_material" class="'+inputCls+'">'+materialOptions(STATE.pendingMaterial)+'</select></div>'+
    (isMasuk ? '' : fieldWrap('Pekerjaan (untuk analisis RAP)', '<select id="f_pekerjaan" class="'+inputCls+'">'+pekerjaanOptions()+'</select>'))+
    fieldWrap('Jumlah (Qty)', numInputHtml('f_qty', '', inputCls, ' placeholder="0"'))+
    (isMasuk ? fieldWrap('No. Surat Jalan / Nota', '<input type="text" id="f_ref" placeholder="Opsional" class="'+inputCls+'">') : '')+
    fieldWrap('Keterangan', '<input type="text" id="f_ket" placeholder="Opsional" class="'+inputCls+'">')+
    '<div class="flex gap-2.5 mt-1">'+
    '<button id="f_cancel" type="button" class="flex-1 bg-slate-100 hover:bg-slate-200 active:scale-[.98] transition text-slate-600 font-bold py-3.5 rounded-xl text-[15px]">Batal</button>'+
    '<button id="f_save" class="flex-[2] bg-'+accent+'-600 hover:bg-'+accent+'-700 active:scale-[.98] transition text-white font-bold py-3.5 rounded-xl text-[15px]">'+
      (isMasuk?'Simpan Bahan Masuk':'Simpan Pemakaian')+'</button>'+
    '</div>'
  );
  icons();
  document.getElementById('f_save').onclick = function(){ submitInput(mode); };
  // A field admin who opened this form by mistake, or wants to start
  // over, needs an explicit way out that doesn't require touching every
  // field — mirrors the "Batal" button every desktop modal already has.
  document.getElementById('f_cancel').onclick = function(){ renderInputForm(c, mode); };
  STATE.pendingMaterial = null;
  enhanceSelect(document.getElementById('f_material'));
  document.getElementById('f_newmat').onclick = function(){ openNewMaterial(mode); };
  document.getElementById('f_material').addEventListener('change', function(){
    if(this.value === '__new__'){ this.value = ''; this.dispatchEvent(new Event('ss-refresh')); openNewMaterial(mode); }
  });
  if(!isMasuk) enhanceSelect(document.getElementById('f_pekerjaan'));
  enhanceClearable(document.getElementById('f_qty'));
  if(isMasuk) enhanceClearable(document.getElementById('f_ref'));

function submitInput(mode){
  var qty = parseIdNum(document.getElementById('f_qty').value);
  var materialId = document.getElementById('f_material').value;
  if(!materialId){ toast('Pilih material.', true); return; }
  if(!qty || qty <= 0){ toast('Isi jumlah (qty) yang valid.', true); return; }
  // Pemakaian above the recorded stock almost always means a Bahan Masuk was forgotten: ask before saving.
  if(mode !== 'masuk' && !submitInput._checked){
    var go = function(){ submitInput._checked = true; try{ submitInput(mode); } finally { submitInput._checked = false; } };
    apiFetch('/material_stock.php').then(function(rows){
      var r = rows.find(function(x){ return x.project_id===STATE.projectId && x.material_id===materialId; });
      var stok = r ? (Number(r.stok)||0) : 0;
      if(qty > stok + 1e-9){
        var m = STATE.materials.find(function(x){ return x.id===materialId; }) || {nama:'bahan ini', satuan:''};
        confirmModal('Pemakaian melebihi stok', 'Stok <b>'+esc(m.nama)+'</b> yang tercatat hanya <b>'+fmtNum(stok)+' '+esc(m.satuan)+'</b>, sedangkan pemakaian <b>'+fmtNum(qty)+'</b>. Biasanya Bahan Masuk belum dicatat. Tetap simpan?', function(){ closeModal(); go(); });
        return;
      }
      go();
    }).catch(function(){ go(); });
    return;
  }

  var btn = document.getElementById('f_save');
  btn.disabled = true; btn.textContent = 'Menyimpan…';

  var payload, endpoint;
  if(mode === 'masuk'){
    payload = {
      id: uid('mr_'), project_id: STATE.projectId, material_id: materialId,
      tgl: document.getElementById('f_tgl').value || today(),
      qty: qty,
      no_referensi: document.getElementById('f_ref').value || '',
      ket: document.getElementById('f_ket').value || '',
    };
    endpoint = '/material_receipts.php';
  } else {
    payload = {
      id: uid('mu_'), project_id: STATE.projectId, material_id: materialId,
      pekerjaan_id: document.getElementById('f_pekerjaan').value || null,
      tgl: document.getElementById('f_tgl').value || today(),
      qty: qty, ket: document.getElementById('f_ket').value || '',
    };
    endpoint = '/material_usage.php';
  }

  var matLabel = (STATE.materials.find(function(m){ return m.id===materialId; })||{}).nama || materialId;
  var label = (mode==='masuk'?'Bahan Masuk':'Pemakaian')+' · '+matLabel+' · '+fmtNum(qty);
  apiFetch(endpoint, {method:'POST', body:JSON.stringify(payload)})
    .then(function(){
      toast('Tersimpan.');
      renderTab();
      flushOutbox();
    })
    .catch(function(e){
      if(e.network || e.auth){
        outboxAdd({endpoint:endpoint, payload:payload, label:label, queuedAt:Date.now()});
        toast(e.auth ? 'Sesi berakhir. Data disimpan di perangkat dan terkirim otomatis setelah Anda masuk lagi.' : 'Tidak ada sinyal. Data disimpan di perangkat dan dikirim otomatis saat sinyal kembali.');
        renderTab();
      } else {
        toast('Gagal menyimpan: ' + e.message, true);
      }
    })
    .finally(function(){ if(btn){ btn.disabled=false; btn.textContent = mode==='masuk'?'Simpan Bahan Masuk':'Simpan Pemakaian'; } });
}

/* Admin Lapangan adds a bahan that Master Bahan does not have yet. Only the
   nama and satuan are typed; the kode is assigned by the server. The new bahan
   is selected straight away in the form that was open. */
function openNewMaterial(mode){
  openModal('Tambah Bahan Baru',
    '<div class="space-y-4">'+
      '<div class="rounded-xl bg-slate-50 border border-slate-200 px-4 py-3 text-sm text-slate-500">Kode bahan dibuat otomatis oleh sistem.</div>'+
      '<div><label class="block text-xs font-bold text-slate-500 mb-1.5">Nama bahan *</label><input id="nb_nama" type="text" autocomplete="off" class="'+inputCls+'" placeholder="mis. Semen Tiga Roda"></div>'+
      '<div><label class="block text-xs font-bold text-slate-500 mb-1.5">Satuan *</label><input id="nb_satuan" type="text" autocomplete="off" class="'+inputCls+'" placeholder="mis. sak, btg, m3, kg"></div>'+
    '</div>',
    function(){
      var nama = fv('nb_nama'), satuan = fv('nb_satuan');
      if(!nama || !satuan){ toast('Nama dan satuan wajib diisi.', true); return; }
      apiFetch('/materials_quick.php', {method:'POST', body:JSON.stringify({nama:nama, satuan:satuan})})
        .then(function(m){
          STATE.materials.push(m);
          STATE.materials.sort(function(a,b){ return a.nama.localeCompare(b.nama); });
          STATE.pendingMaterial = m.id;
          closeModal();
          toast('Bahan "'+m.nama+'" ditambahkan.');
          renderTab();
        })
        .catch(function(e){
          toast(e.network ? 'Tambah bahan baru butuh sinyal. Coba lagi saat ada sinyal.' : e.message, true);
        });
    });
  enhanceClearable(document.getElementById('nb_nama'));
  enhanceClearable(document.getElementById('nb_satuan'));
}

/* ============================================================
   ABSEN PEKERJA (Admin Lapangan, HP)
   One tap per worker: Hadir / ½ / Absen, plus overtime hours. The roster is
   the project's worker list (grouped by tim); new people are added on the
   spot. No money anywhere on this screen — the server never sends rates to
   field accounts. Saves offline through the same outbox as Bahan Masuk.
   ============================================================ */
var BULAN_PANJANG = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
var HARI_NAMA = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
var GRADE_NAMA = {KTK:'Kepala Tukang', TK:'Tukang', LD:'Laden', OBK:'Operator Beko', SPR:'Supir', OMX:'Operator Mixer', LAIN:'Lainnya'};
var GRADE_ORDER = ['KTK','TK','LD','OBK','SPR','OMX','LAIN'];
var GRADE_CLS = {KTK:'bg-violet-50 text-violet-700', TK:'bg-sky-50 text-sky-700', LD:'bg-slate-100 text-slate-600',
  OBK:'bg-amber-50 text-amber-700', SPR:'bg-teal-50 text-teal-700', OMX:'bg-orange-50 text-orange-700', LAIN:'bg-slate-100 text-slate-500'};
function parseISO(t){ var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(t||''); return m ? new Date(+m[1], +m[2]-1, +m[3]) : new Date(); }
function addDays(t, n){ var d=parseISO(t); d.setDate(d.getDate()+n); return localISO(d); }
function fmtTglPanjang(t){ var d=parseISO(t); return HARI_NAMA[d.getDay()]+', '+d.getDate()+' '+BULAN_PANJANG[d.getMonth()]+' '+d.getFullYear(); }
function fmtTglPendek(t){ var d=parseISO(t); return d.getDate()+' '+BULAN_PANJANG[d.getMonth()].slice(0,3); }
/* Weeks run Friday–Thursday (same as the paper "Absen Upah" sheet). */
/* Period shown for a date: the loaded period (may be a part-week after an early submission), else the Fri–Thu week. */
function perSpan(t){ var p = typeof ABSEN!=='undefined' && ABSEN.period; if(p && p.tgl_mulai && p.tgl_mulai<=t && p.tgl_akhir>=t) return {from:p.tgl_mulai, to:p.tgl_akhir}; return weekOf(t); }
function weekOf(t){ var d=parseISO(t); var back=(d.getDay()+2)%7; var s=addDays(t,-back); return {from:s, to:addDays(s,6)}; }
var PERIOD_STATUS = {draft:['neutral','Draft'], diajukan:['warn','Menunggu persetujuan'], disetujui:['info','Siap dibayar'], dibayar:['aman','Dibayar']};

var ABSEN = {tgl:null, workers:[], cur:{}, orig:{}, period:null, editable:true, offline:false, reason:''};

function renderAbsen(c){
  if(!ABSEN.tgl) ABSEN.tgl = today();
  var pid = STATE.projectId, tgl = ABSEN.tgl;
  c.innerHTML = card('<div class="text-center text-sm text-slate-400 py-6">Memuat absen…</div>');
  var offline = false;
  var wKey = 'ms_workers_'+pid;
  Promise.all([
    apiFetch('/workers.php?project_id='+encodeURIComponent(pid)).then(function(w){ lsSet(wKey, w); return w; })
      .catch(function(e){ if(e.network){ offline = true; return lsGet(wKey, []); } throw e; }),
    apiFetch('/attendance.php?project_id='+encodeURIComponent(pid)+'&tgl_from='+tgl+'&tgl_to='+tgl).catch(function(e){ if(e.network){ offline = true; return []; } throw e; }),
    apiFetch('/payroll_periods.php?project_id='+encodeURIComponent(pid)+'&tgl='+tgl).catch(function(e){ if(e.network){ offline = true; return null; } throw e; }),
    apiFetch('/kasbon_requests.php').catch(function(){ return []; }),
    // this week's entries so far: used to remind the field admin about days that were skipped
    apiFetch('/attendance.php?project_id='+encodeURIComponent(pid)+'&tgl_from='+weekOf(tgl).from+'&tgl_to='+weekOf(tgl).to).catch(function(){ return null; }),
  ]).then(function(r){
    if(STATE.projectId !== pid || ABSEN.tgl !== tgl || STATE.section !== 'absen') return; // user moved on while loading
    ABSEN.workers = r[0]; ABSEN.period = r[2]; ABSEN.offline = offline;
    ABSEN.weekFilled = null;
    if(Array.isArray(r[4])){ ABSEN.weekFilled = {}; r[4].forEach(function(a){ ABSEN.weekFilled[a.tgl] = true; }); }
    ABSEN.kreqAll = (r[3]||[]).filter(function(k){ return k.project_id === pid; });
    ABSEN.kreq = ABSEN.kreqAll.slice(0, 12);
    ABSEN.cur = {}; ABSEN.orig = {}; ABSEN.rev = {}; ABSEN.q = ''; if(ABSEN.projKey !== pid){ ABSEN.tim = ''; ABSEN.projKey = pid; } ABSEN.filter = 'all'; ABSEN.open = {};
    ABSEN.workers.forEach(function(w){ ABSEN.cur[w.id] = {h:null, l:0}; ABSEN.orig[w.id] = {h:null, l:0}; });
    r[1].forEach(function(a){
      if(!ABSEN.cur[a.worker_id]) return;
      ABSEN.cur[a.worker_id] = {h:Number(a.hari), l:Number(a.lembur_jam)||0};
      ABSEN.orig[a.worker_id] = {h:Number(a.hari), l:Number(a.lembur_jam)||0};
      ABSEN.rev[a.worker_id] = Number(a.rev)||0;
    });
    // A day the field marked "libur / tidak kerja": every worker is Absen with the LIBUR note.
    ABSEN.libur = r[1].length > 0 && r[1].length >= ABSEN.workers.length && r[1].every(function(a){ return Number(a.hari) === 0 && a.ket === 'LIBUR'; });
    // Anything still waiting in the outbox for this day is shown as already entered.
    outboxGet().forEach(function(o){
      if(o.endpoint !== '/attendance.php' || o.payload.project_id !== pid || o.payload.tgl !== tgl) return;
      o.payload.entries.forEach(function(e){
        if(!ABSEN.cur[e.worker_id]) return;
        ABSEN.cur[e.worker_id] = {h: e.hari===null ? null : Number(e.hari), l: Number(e.lembur_jam)||0};
        ABSEN.orig[e.worker_id] = {h: ABSEN.cur[e.worker_id].h, l: ABSEN.cur[e.worker_id].l};
      });
    });
    var earliest = addDays(today(), -7);
    ABSEN.editable = true; ABSEN.reason = '';
    if(tgl > today()){ ABSEN.editable = false; ABSEN.reason = 'Tanggal ini belum tiba.'; }
    else if(tgl < earliest){ ABSEN.editable = false; ABSEN.reason = 'Lebih dari 7 hari lalu — hanya Admin Pusat yang bisa mengubah.'; }
    else if(ABSEN.period && ABSEN.period.status !== 'draft'){ ABSEN.editable = false; ABSEN.reason = 'Minggu ini sudah '+(ABSEN.period.status==='dibayar'?'dibayar':'diajukan')+'. Hubungi Admin Pusat untuk koreksi.'; }
    drawAbsen(c);
  }).catch(function(e){ c.innerHTML = card('<div class="text-center text-sm text-red-500 py-4">Gagal memuat: '+esc(e.message)+'</div>'); });
}

function absenCounts(){
  var n = {hadir:0, setengah:0, absen:0, belum:0, lembur:0};
  ABSEN.workers.forEach(function(w){
    var x = ABSEN.cur[w.id];
    if(x.h===null) n.belum++; else if(x.h===1) n.hadir++; else if(x.h===0.5) n.setengah++; else n.absen++;
    if(x.h>0) n.lembur += x.l;
  });
  return n;
}
function absenDirty(){
  return ABSEN.workers.some(function(w){
    var a = ABSEN.cur[w.id], b = ABSEN.orig[w.id];
    return a.h !== b.h || (a.h>0 && a.l !== b.l);
  });
}
function fmtJam(n){ return String(n).replace('.', ','); }
function timLabel(t){ return /^tim\b/i.test(t||'') ? t : 'Tim '+t; }
function kreqName(r){ return r.worker_nama || (r.tim ? timLabel(r.tim) : 'Grup / penanggung jawab'); }
/* Days of this week (up to today) that nobody has filled in yet. */
function absenMissing(){
  var out = [], tgl = ABSEN.tgl;
  if(!ABSEN.workers.length || !ABSEN.weekFilled) return out;
  var wk = perSpan(tgl), last = wk.to < today() ? wk.to : today();
  datesBetween(wk.from, last, 7).forEach(function(d){ if(!ABSEN.weekFilled[d] && d !== tgl) out.push(d); });
  return out;
}
/* "1,5" / "1.5" / "2" -> hours in steps of 0.5 (payroll pays whole half-hours). */
function parseJam(txt){
  var v = Number(String(txt==null?'':txt).trim().replace(',', '.'));
  if(!isFinite(v) || v < 0) return null;
  return Math.min(16, Math.round(v*2)/2);
}
/* Has anything been entered for this week (saved days, or today's unsaved ticks)? */
function absenWeekHasData(){
  var any = ABSEN.weekFilled && Object.keys(ABSEN.weekFilled).length > 0;
  return !!any || ABSEN.workers.some(function(w){ return ABSEN.cur[w.id] && ABSEN.cur[w.id].h !== null; });
}

/* Built for crews of 30-50: the usual day is "almost everyone present with the
   same overtime", so the screen starts from that and only asks for exceptions.
   - "Pola kemarin" copies yesterday's entries; "Semua hadir" fills the rest.
   - "Lembur standar" applies one overtime value to everyone present.
   - Rows are one line each; search + filter (Belum / Hadir / ½ / Absen) find people fast. */
var ABSEN_FILTERS = [['all','Semua'],['belum','Belum'],['hadir','Hadir'],['setengah','½'],['absen','Absen']];
var LEMBUR_CHIPS = [0, 1.5, 2, 3];

function absenRowMatch(w){
  var x = ABSEN.cur[w.id], f = ABSEN.filter, q = (ABSEN.q||'').toLowerCase();
  if(ABSEN.tim && (w.tim||'') !== ABSEN.tim) return false;
  if(q && (w.nama+' '+(w.tim||'')).toLowerCase().indexOf(q) === -1) return false;
  if(f==='belum') return x.h===null;
  if(f==='hadir') return x.h===1;
  if(f==='setengah') return x.h===0.5;
  if(f==='absen') return x.h===0;
  return true;
}
function setHadir(w, v){
  var x = ABSEN.cur[w.id];
  if(x.h === v){ x.h = null; x.l = 0; return; }
  x.h = v; x.l = v===0 ? 0 : (ABSEN.defL || 0);
}

function drawAbsen(c){

  if(ABSEN.q == null) ABSEN.q = '';
  if(!ABSEN.filter) ABSEN.filter = 'all';
  if(ABSEN.defL == null) ABSEN.defL = Number(lsGet('ms_def_lembur', 0)) || 0;
  ABSEN.open = ABSEN.open || {};

  var banner = '';
  if(ABSEN.offline) banner += '<div class="text-xs text-slate-600 bg-slate-100 rounded-xl px-3 py-2 mb-3">Tidak ada sinyal. Memakai daftar pekerja yang tersimpan; absen akan dikirim saat sinyal kembali.</div>';
  if(!ed) banner += '<div class="text-xs text-amber-800 bg-amber-50 border border-amber-100 rounded-xl px-3 py-2.5 mb-3">'+esc(ABSEN.reason)+'</div>';
  if(ABSEN.period && ABSEN.period.status==='draft' && /^Dikembalikan:/.test(ABSEN.period.catatan||'')) banner += '<div class="text-xs text-red-800 bg-red-50 border border-red-200 rounded-xl px-3 py-2.5 mb-3"><b>Absen minggu ini dikembalikan oleh Akuntan.</b><br>'+esc((ABSEN.period.catatan||'').replace(/^Dikembalikan:\s*/,''))+'<br><span class="text-red-600">Perbaiki lalu ajukan lagi.</span></div>';

    missing.slice(0,7).map(function(d){ return '<button type="button" data-ab-goto="'+d+'" class="h-9 px-3 rounded-lg bg-amber-500 text-white font-bold">'+esc(HARI_NAMA[parseISO(d).getDay()].slice(0,3)+' '+parseISO(d).getDate())+'</button>'; }).join('')+'</div>'+
    '<div class="mt-2.5 pt-2.5 border-t border-amber-200 text-amber-800">Hari tanpa kerja? Ketuk harinya, lalu pilih <b>Tandai libur / hujan</b>.</div></div>';

  var btn3 = function(id, icon, label, attr){ return '<button type="button" '+(id?'id="'+id+'"':'')+' '+(attr||'')+' class="h-12 rounded-xl bg-white border border-slate-200 text-[13px] font-bold text-slate-700 flex flex-col items-center justify-center gap-0.5 leading-tight"><i data-lucide="'+icon+'" class="w-4 h-4"></i>'+label+'</button>'; };
  var tools = '<div class="grid '+(ed?'grid-cols-3':'grid-cols-1')+' gap-2 mb-3">'+
      (ed ? btn3('', 'user-plus', 'Pekerja', 'data-ab-add')+
        '<button type="button" id="abAll" class="h-12 rounded-xl bg-emerald-50 text-emerald-700 border border-emerald-100 text-[13px] font-bold flex flex-col items-center justify-center gap-0.5 leading-tight"><i data-lucide="check-check" class="w-4 h-4"></i>Semua hadir'+(ABSEN.tim?' <span class="font-semibold opacity-70">('+esc(ABSEN.tim)+')</span>':'')+'</button>' : '')+btn3('abKasbon', 'banknote', 'Kasbon')+'</div>';

  var nothingYet = ed && ABSEN.workers.length && ABSEN.workers.every(function(w){ return ABSEN.cur[w.id].h === null; });
  var head =
    '<div class="flex items-center justify-between gap-2 mb-3">'+
      '<button type="button" id="abPrev" class="w-11 h-11 rounded-xl bg-slate-100 text-slate-600 flex items-center justify-center"><i data-lucide="chevron-left" class="w-5 h-5"></i></button>'+
      '<div class="relative text-center min-w-0 flex-1 rounded-xl py-1 active:bg-slate-50"><div class="font-extrabold text-[16px] leading-tight flex items-center justify-center gap-1.5">'+esc(fmtTglPanjang(tgl))+'<i data-lucide="calendar-days" class="w-4 h-4 text-emerald-600 shrink-0"></i></div>'+
      '<div class="text-xs text-slate-400 mt-0.5">Minggu '+esc(fmtTglPendek(wk.from))+' – '+esc(fmtTglPendek(wk.to))+' · '+badge(ps[0], ps[1])+'</div>'+
      '<input type="date" id="abDate" value="'+tgl+'" max="'+today()+'" aria-label="Pilih tanggal" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer"></div>'+
      '<button type="button" id="abNext" '+(canNext?'':'disabled')+' class="w-11 h-11 rounded-xl bg-slate-100 text-slate-600 flex items-center justify-center disabled:opacity-30"><i data-lucide="chevron-right" class="w-5 h-5"></i></button>'+
    '</div><div id="abTiles"></div>'+(nothingYet ? '<div class="text-center mt-2"><button type="button" id="abLiburToday" class="text-xs font-bold text-slate-500 underline underline-offset-2 py-1">Tidak ada kerja hari ini? Tandai libur / hujan</button></div>' : '');

  var quick = ed && ABSEN.workers.length ?
    '<div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-3 mb-3">'+
      '<div class="flex items-center gap-2"><span class="text-xs font-bold text-slate-500 shrink-0">Lembur standar</span>'+
        '<div class="grid grid-cols-4 gap-1.5 flex-1" id="abDefL">'+LEMBUR_CHIPS.map(function(v){
          return '<button type="button" data-defl="'+v+'" class="h-10 rounded-lg text-[13px] font-bold '+(ABSEN.defL===v?'bg-indigo-600 text-white':'bg-slate-100 text-slate-500')+'">'+(v===0?'Tidak':fmtJam(v)+' j')+'</button>';
        }).join('')+'</div></div>'+
      '<div class="text-[11px] text-slate-400 mt-2">Berlaku untuk semua yang hadir. Ubah per orang dengan mengetuk namanya.</div></div>' : '';

  var tims = []; ABSEN.workers.forEach(function(w){ var k = w.tim||''; if(k && tims.indexOf(k)<0) tims.push(k); });
  if(ABSEN.tim && tims.indexOf(ABSEN.tim)<0) ABSEN.tim = '';
  var timChips = tims.length > 1 ?
    '<div class="mb-3 -mx-1 px-1 overflow-x-auto tab-scroll"><div class="flex gap-2 w-max">'+
    [['', 'Semua tim']].concat(tims.map(function(t){ return [t, t]; })).map(function(x){
      var on = (ABSEN.tim||'')===x[0], open = ABSEN.workers.filter(function(w){ return (!x[0] || (w.tim||'')===x[0]) && ABSEN.cur[w.id].h===null; }).length;
      return '<button type="button" data-tim-chip="'+esc(x[0])+'" class="h-11 px-4 rounded-xl text-[13.5px] font-bold whitespace-nowrap '+(on?'bg-emerald-600 text-white shadow-sm':'bg-white border border-slate-200 text-slate-600')+'">'+esc(x[1])+(open?' <span class="'+(on?'bg-white/25':'bg-slate-800 text-white')+' rounded-full px-1.5 py-0.5 text-[11px] ml-1">'+open+'</span>':' ✓')+'</button>';

      '<input type="search" id="abQ" placeholder="Cari nama pekerja…" value="'+esc(ABSEN.q)+'" autocomplete="off" class="w-full pl-10 pr-3 bg-white border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-100"></div>'+
      '<div id="abFilters" class="grid grid-cols-5 gap-1 bg-slate-200/70 rounded-xl p-1"></div></div>' : '';

  var ajukan = '<div id="abAjukanBox"></div>';

  var empty = !ABSEN.workers.length ? card('<div class="text-center py-6"><div class="text-slate-500 text-sm mb-4">Belum ada pekerja di proyek ini.</div>'+
      (ed?'<button type="button" data-ab-add class="px-5 py-3 rounded-xl bg-emerald-600 text-white font-bold text-sm">+ Tambah pekerja pertama</button>':'')+'</div>') : '';

  c.innerHTML = card(head) + banner + tools + '<div id="abKasbonBox"></div>' + quick + timChips + filters + empty + '<div id="abList"></div>' + ajukan + '<div id="abBar"></div>';
  document.getElementById('abKasbonBox').innerHTML = kasbonBoxHtml();
  var kr = document.getElementById('abKRiwayat'); if(kr) kr.onclick = function(){ ABSEN.kAll = !ABSEN.kAll; document.getElementById('abKasbonBox').innerHTML = kasbonBoxHtml(); var k2 = document.getElementById('abKRiwayat'); if(k2) k2.onclick = kr.onclick; };

function kasbonBoxHtml(){
  var kStat = {diajukan:['bg-amber-50 text-amber-700','Menunggu dicek'], disetujui:['bg-emerald-50 text-emerald-700','Disetujui'], ditolak:['bg-red-50 text-red-600','Ditolak']};
  var pendingK = outboxGet().filter(function(o){ return o.endpoint==='/kasbon_requests.php' && o.payload.project_id===STATE.projectId; })
    .map(function(o){ var items = o.payload.items || [o.payload];
      return {batch:'_q'+o.payload.project_id, status:'_antre', ket:o.payload.ket, lines:items.map(function(i){ return {nama:(ABSEN.workers.find(function(w){ return w.id===i.worker_id; })||{}).nama || (i.tim ? timLabel(i.tim) : 'Grup / penanggung jawab'), jumlah:i.jumlah}; })}; });
  // rows that belong to one request (same batch_id) are shown together as one card
  var groups = [], idx = {};
  // Layar tetap pendek: hanya pengajuan minggu gaji ini dan yang masih menunggu; yang lama ada di "Riwayat".
  var wkFrom = weekOf(today()).from, hidden = 0;
  (ABSEN.kreq||[]).forEach(function(k){
    if(!ABSEN.kAll && k.status!=='diajukan' && String(k.tgl_wib||'') < wkFrom){ hidden++; return; }
    var key = k.batch_id || k.id;
    if(!(key in idx)){ idx[key] = groups.length; groups.push({batch:key, status:k.status, ket:k.ket, catatan:k.catatan, lines:[]}); }
    groups[idx[key]].lines.push({nama:kreqName(k), jumlah:k.jumlah});
  });
  var list = pendingK.concat(groups).map(function(g){
    var st = g.status==='_antre' ? ['bg-slate-100 text-slate-600','Menunggu sinyal'] : (kStat[g.status] || kStat.diajukan);
    var total = g.lines.reduce(function(a,l){ return a+(Number(l.jumlah)||0); },0);
    return '<div class="flex items-start justify-between gap-3 py-2.5 border-t border-slate-100 first:border-0"><div class="min-w-0">'+
      g.lines.map(function(l){ return '<div class="text-sm font-bold truncate">'+esc(l.nama)+' <span class="font-semibold text-slate-500 tabular-nums">· '+fmtIdNum(l.jumlah)+'</span></div>'; }).join('')+
      '<div class="text-xs text-slate-400 truncate">'+esc(g.ket||'')+(g.status==='ditolak'&&g.catatan?' · '+esc(g.catatan):'')+'</div></div>'+
      '<div class="text-right shrink-0"><div class="text-sm font-extrabold tabular-nums">'+fmtIdNum(total)+'</div><span class="text-[10px] font-bold px-2 py-0.5 rounded-full '+st[0]+'">'+st[1]+'</span></div></div>';
  }).join('');
  var more = (hidden || ABSEN.kAll) ? '<button type="button" id="abKRiwayat" class="w-full text-center text-xs font-bold text-indigo-600 py-2.5 border-t border-slate-100">'+(ABSEN.kAll ? 'Sembunyikan riwayat' : 'Lihat riwayat minggu lalu ('+hidden+')')+'</button>' : '';
  return (list || more) ? '<div class="bg-white rounded-2xl border border-slate-200 shadow-sm px-4 py-2 mb-3"><div class="text-[11px] font-extrabold uppercase tracking-wide text-slate-400 pt-1.5">Pengajuan kasbon</div>'+(list || '<div class="text-xs text-slate-500 py-2.5">Belum ada pengajuan minggu ini.</div>')+more+'</div>' : '';
}

/* The big "Ajukan" box. One glance tells the state by colour:
   grey = nothing to submit yet · amber = some days still empty · green = complete, ready ·
   blue / green / dark pill = already with the office (no button). */
function renderAjukanBox(){
  var box = document.getElementById('abAjukanBox'); if(!box) return;
  var html = '', stNow = ABSEN.period ? ABSEN.period.status : 'draft';
  if(ABSEN.workers.length){
    if(stNow === 'draft'){
      var hasData = absenWeekHasData(), n = absenCounts();
      var gaps = absenMissing().length + (ABSEN.tgl <= today() && n.belum > 0 ? 1 : 0);
      var kind = !hasData ? ['bg-slate-100 text-slate-400 border-slate-200','send','Belum ada absen minggu ini','Isi absen dulu, lalu ajukan di sini'] :
                 gaps ? ['bg-amber-500 text-white border-amber-500 shadow-amber-200','send','Ajukan ke pusat · '+gaps+' hari belum lengkap','Hari kosong dianggap tidak kerja · ketuk untuk mengajukan'] :
                        ['bg-emerald-600 text-white border-emerald-600 shadow-emerald-200','send','Ajukan minggu ini ke pusat','Semua hari sudah terisi · siap diajukan'];
      html = '<button type="button" id="abAjukan" '+(hasData?'':'data-empty="1"')+' class="w-full rounded-2xl border px-4 py-3 text-left flex items-center gap-3 mb-3 shadow-md '+kind[0]+'"><i data-lucide="'+kind[1]+'" class="w-5 h-5 shrink-0"></i>'+
        '<span class="min-w-0"><span class="block font-extrabold text-[15px] leading-tight">'+kind[2]+'</span><span class="block text-[11.5px] opacity-90 mt-0.5">'+kind[3]+'</span></span></button>';
    } else {
      var done = {diajukan:['bg-sky-50 border-sky-200 text-sky-800','Sudah diajukan · menunggu pusat'], disetujui:['bg-emerald-50 border-emerald-200 text-emerald-800','Disetujui pusat · siap dibayar'], dibayar:['bg-slate-100 border-slate-200 text-slate-600','Sudah dibayar · minggu ini selesai']}[stNow] || ['bg-slate-100 border-slate-200 text-slate-600', stNow];
      html = '<div class="w-full rounded-2xl border px-4 py-3 flex items-center gap-3 mb-3 '+done[0]+'"><i data-lucide="check-circle-2" class="w-5 h-5 shrink-0"></i><span class="font-extrabold text-[14px]">'+done[1]+'</span></div>';
    }
  }
  // Update the existing button in place when only its look changes: replacing it while the
  // user is tapping it (typing a value, then tapping) would swallow the tap.
  var cur = document.getElementById('abAjukan'), tmp = document.createElement('div'); tmp.innerHTML = html;
  var nb = tmp.firstElementChild;
  if(cur && nb && nb.id === 'abAjukan'){ cur.className = nb.className; cur.innerHTML = nb.innerHTML; if(nb.getAttribute('data-empty')) cur.setAttribute('data-empty','1'); else cur.removeAttribute('data-empty'); }
  else { box.innerHTML = html; }
  icons();
  var aj = document.getElementById('abAjukan');
  if(aj) aj.onclick = function(){ if(aj.getAttribute('data-empty')){ toast('Belum ada absen minggu ini. Isi absen dulu.', true); return; } openAjukan(document.getElementById('mContent')); };
}
function renderAbSummary(){
  renderAjukanBox();
  var n = absenCounts(), ed = ABSEN.editable;
  var tile = function(label, val, cls){ return '<div class="rounded-xl px-2 py-2.5 text-center '+cls+'"><div class="text-xl font-extrabold leading-none tabular-nums">'+val+'</div><div class="text-[11px] font-semibold mt-1 opacity-80">'+label+'</div></div>'; };
  var tiles = document.getElementById('abTiles');
  if(tiles) tiles.innerHTML = '<div class="grid grid-cols-4 gap-2">'+
      tile('Hadir', n.hadir, 'bg-emerald-50 text-emerald-700')+tile('½ Hari', n.setengah, 'bg-amber-50 text-amber-700')+
      tile('Absen', n.absen, 'bg-red-50 text-red-600')+tile('Belum', n.belum, n.belum? 'bg-slate-800 text-white' : 'bg-slate-100 text-slate-500')+'</div>'+
      (n.lembur>0 ? '<div class="text-xs text-slate-500 mt-2 text-center">Total lembur hari ini: <b class="text-slate-700">'+fmtJam(n.lembur)+' jam</b></div>' : '');
  var f = document.getElementById('abFilters');
  if(f){
    var cnt = {all:ABSEN.workers.length, belum:n.belum, hadir:n.hadir, setengah:n.setengah, absen:n.absen};
    f.innerHTML = ABSEN_FILTERS.map(function(x){
      var on = ABSEN.filter===x[0];
      return '<button type="button" data-flt="'+x[0]+'" class="h-10 rounded-lg text-[12.5px] font-bold '+(on?'bg-white text-emerald-700 shadow-sm':'text-slate-500')+'">'+x[1]+(x[0]==='all'?'':' <span class="opacity-60">'+cnt[x[0]]+'</span>')+'</button>';
    }).join('');
    f.querySelectorAll('[data-flt]').forEach(function(b){ b.onclick = function(){ ABSEN.filter = b.getAttribute('data-flt'); renderAbSummary(); renderAbList(); }; });
  }
  var bar = document.getElementById('abBar');
  if(bar){
    var dirty = absenDirty();
    var cls = 'w-full h-14 rounded-2xl text-white font-extrabold text-[16px] shadow-lg shadow-emerald-200 transition '+(dirty?'bg-emerald-600':'bg-slate-300 shadow-none');
    var label = dirty ? 'Simpan Absen'+(n.belum?' · '+n.belum+' belum diisi':'') : (n.belum? n.belum+' pekerja belum diisi' : 'Tersimpan ✓');
    var sv = document.getElementById('abSave');
    if(!(ed && ABSEN.workers.length)){ bar.innerHTML = ''; }
    else if(sv){ sv.className = cls; sv.disabled = !dirty; sv.textContent = label; } // in place: never swap the button under a finger
    else { bar.innerHTML = '<div class="sticky bottom-20 z-10"><button type="button" id="abSave" '+(dirty?'':'disabled')+' class="'+cls+'">'+label+'</button></div>'; sv = document.getElementById('abSave'); }
    if(sv) sv.onclick = function(){ saveAbsen(document.getElementById('mContent')); };
  }
}

function renderAbList(){
  var host = document.getElementById('abList'); if(!host) return;
  var ed = ABSEN.editable, groups = [], idx = {};
  ABSEN.workers.filter(absenRowMatch).forEach(function(w){
    var k = w.tim || '';
    if(!(k in idx)){ idx[k] = groups.length; groups.push({tim:k, list:[]}); }
    groups[idx[k]].list.push(w);
  });
  if(!groups.length && ABSEN.workers.length){ host.innerHTML = '<div class="text-center text-sm text-slate-400 py-8">Tidak ada pekerja yang cocok.</div>'; return; }
  var sq = function(w, v, active, cls, inner){
    return '<button type="button" '+(ed?'':'disabled')+' data-ab="'+esc(w.id)+'|'+v+'" aria-label="'+({1:'Hadir',0.5:'Setengah hari',0:'Absen'}[v])+'" class="w-11 h-11 rounded-xl flex items-center justify-center text-[16px] font-extrabold transition '+(active?cls:'bg-slate-100 text-slate-300')+'">'+inner+'</button>';

    var all = ABSEN.workers.filter(function(w){ return (w.tim||'')===g.tim; });

    return '<div class="mb-4"><div class="flex items-center justify-between px-1 mb-2"><div class="text-xs font-extrabold uppercase tracking-wide text-slate-500">'+esc(g.tim||'Tanpa tim')+
      ' <span class="font-semibold text-slate-400 normal-case">· '+all.length+' orang'+(open?' · '+open+' belum':'')+'</span></div>'+
      (ed ? '<button type="button" data-ab-tim="'+esc(g.tim)+'" class="text-xs font-bold text-emerald-700 bg-emerald-50 rounded-lg px-3 py-2">Semua hadir</button>' : '')+'</div>'+
      g.list.map(function(w){
        var x = ABSEN.cur[w.id], isOpen = !!ABSEN.open[w.id] && x.h>0;
        return '<div class="bg-white rounded-xl border '+(x.h===null?'border-slate-200':'border-slate-100')+' shadow-sm mb-1.5 overflow-hidden">'+

function bindAbsen(c){
  document.getElementById('abPrev').onclick = function(){ ABSEN.tgl = addDays(ABSEN.tgl, -1); renderTab(); };
  document.getElementById('abNext').onclick = function(){ if(ABSEN.tgl < today()){ ABSEN.tgl = addDays(ABSEN.tgl, 1); renderTab(); } };
  var dp = document.getElementById('abDate');
  if(dp) dp.addEventListener('click', function(){ try{ if(dp.showPicker) dp.showPicker(); }catch(e){} });
  if(dp) dp.onchange = function(){
    var v = dp.value;
    if(!/^\d{4}-\d{2}-\d{2}$/.test(v)) return;
    if(v > today()){ toast('Tanggal ini belum tiba.', true); dp.value = ABSEN.tgl; return; }
    if(v !== ABSEN.tgl){ ABSEN.tgl = v; renderTab(); }
  };
  c.querySelectorAll('[data-ab-add]').forEach(function(b){ b.onclick = function(){ openAddWorker(c); }; });
  var upd = function(){ renderAbSummary(); renderAbList(); };

  c.querySelectorAll('[data-ab-goto]').forEach(function(b){ b.onclick = function(){ ABSEN.tgl = b.getAttribute('data-ab-goto'); renderTab(); }; });
  var all = document.getElementById('abAll');
  if(all) all.onclick = function(){
    ABSEN.workers.forEach(function(w){ var x = ABSEN.cur[w.id]; if(x.h===null && (!ABSEN.tim || (w.tim||'')===ABSEN.tim)){ x.h = 1; x.l = ABSEN.defL||0; } });
    toast((ABSEN.tim ? ABSEN.tim+': ' : '')+'yang belum diisi ditandai Hadir. Ubah yang berbeda saja.'); upd();
  };
  document.querySelectorAll('#abDefL [data-defl]').forEach(function(b){ b.onclick = function(){
    ABSEN.defL = Number(b.getAttribute('data-defl')); lsSet('ms_def_lembur', ABSEN.defL);
    ABSEN.workers.forEach(function(w){ var x = ABSEN.cur[w.id]; if(x.h>0) x.l = ABSEN.defL; });
    document.querySelectorAll('#abDefL [data-defl]').forEach(function(o){ var on = Number(o.getAttribute('data-defl'))===ABSEN.defL; o.className = 'h-10 rounded-lg text-[13px] font-bold '+(on?'bg-indigo-600 text-white':'bg-slate-100 text-slate-500'); });
    upd(); }; });
  var lt = document.getElementById('abLiburToday');

    confirmModal('Tandai libur / hujan', 'Semua pekerja ditandai <b>tidak masuk</b> pada '+esc(fmtTglPanjang(ABSEN.tgl))+' dan disimpan sekarang. Hari ini tidak dihitung gaji.', function(){
      ABSEN.workers.forEach(function(w){ ABSEN.cur[w.id].h = 0; ABSEN.cur[w.id].l = 0; });
      ABSEN.markLibur = true; closeModal(); saveAbsen(c);
    });
  };
  var kb = document.getElementById('abKasbon');
  if(kb) kb.onclick = function(){ openKasbonRequest(c); };
}

function saveAbsen(c){
  var pid = STATE.projectId, tgl = ABSEN.tgl, entries = [];
  ABSEN.workers.forEach(function(w){
    var x = ABSEN.cur[w.id], o = ABSEN.orig[w.id];
    var ver = (ABSEN.rev && ABSEN.rev[w.id] !== undefined) ? ABSEN.rev[w.id] : null;
    if(x.h !== null) entries.push({worker_id:w.id, hari:x.h, lembur_jam: x.h>0 ? x.l : 0, ver:ver, ket: ABSEN.markLibur ? 'LIBUR' : ''});
    else if(o.h !== null) entries.push({worker_id:w.id, hari:null, ver:ver});
  });
  if(!entries.length){ toast('Belum ada yang diisi.', true); return; }
  var payload = {project_id:pid, tgl:tgl, entries:entries};
  var done = function(msg){
    ABSEN.workers.forEach(function(w){ ABSEN.orig[w.id] = {h:ABSEN.cur[w.id].h, l:ABSEN.cur[w.id].l}; });
    if(ABSEN.weekFilled && entries.some(function(e){ return e.hari !== null; })) ABSEN.weekFilled[tgl] = true;
    toast(msg); drawAbsen(c);
  };
  var btn = document.getElementById('abSave'); if(btn){ btn.disabled = true; btn.textContent = 'Menyimpan…'; }
  apiFetch('/attendance.php', {method:'POST', body:JSON.stringify(payload)})
    .then(function(r){
      // Update the screen from the answer right away — no second round trip to reload everything.
      ABSEN.rev = ABSEN.rev || {};
      Object.keys(ABSEN.rev).forEach(function(k){ if(!(r.revs && k in r.revs)) delete ABSEN.rev[k]; });
      Object.keys(r.revs||{}).forEach(function(k){ ABSEN.rev[k] = r.revs[k]; });
      if(r.periode_status && ABSEN.period) ABSEN.period.status = r.periode_status;
      var wasLibur = ABSEN.markLibur; ABSEN.markLibur = false;
      if(wasLibur){ toast('Hari '+fmtTglPendek(tgl)+' ditandai libur ✓'); ABSEN.libur = true; ABSEN.workers.forEach(function(w){ ABSEN.orig[w.id] = {h:0, l:0}; }); if(ABSEN.weekFilled) ABSEN.weekFilled[tgl] = true; drawAbsen(c); }
      else done('Absen '+fmtTglPendek(tgl)+' tersimpan ✓');
      if(r.peringatan_ganda && r.peringatan_ganda.length) setTimeout(function(){ toast('Perhatian: '+r.peringatan_ganda.slice(0,3).join(', ')+' tercatat lebih dari 1 hari di proyek lain pada tanggal ini.', true); }, 1400);
    })
    .catch(function(e){
      if(e.network || e.auth){
        outboxAdd({endpoint:'/attendance.php', payload:payload, label:'Absen '+fmtTglPendek(tgl)});
        done(e.auth ? 'Sesi berakhir. Absen disimpan di perangkat dan terkirim otomatis setelah Anda masuk lagi.' : 'Tidak ada sinyal. Absen disimpan di perangkat dan dikirim otomatis saat sinyal kembali.');
      } else if(e.status === 409 && /diubah orang lain/.test(e.message)){ toast(e.message, true); renderTab(); }
      else { toast(e.message, true); drawAbsen(c); }
    });
}

var GRADE_SORT = function(g){ var i = GRADE_ORDER.indexOf(g); return i < 0 ? 99 : i; };
function openAddWorker(c){
  var tims = []; ABSEN.workers.forEach(function(w){ if(!w.borongan && w.tim && tims.indexOf(w.tim)<0) tims.push(w.tim); });
  var firstTim = (ABSEN.tim && tims.indexOf(ABSEN.tim)>=0) ? ABSEN.tim : (tims.length ? tims[tims.length-1] : '');

          GRADE_ORDER.map(function(g){ return '<option value="'+g+'"'+(g==='TK'?' selected':'')+'>'+esc(GRADE_NAMA[g])+'</option>'; }).join('')+'</select></div>'+
        '<div><label class="'+lbl+'">Tim</label><select id="nw_timsel" class="'+inputCls+'">'+timOpts+'</select>'+
          '<input id="nw_timbaru" type="text" autocomplete="off" maxlength="80" class="'+inputCls+' mt-2 hidden" placeholder="Nama tim baru, mis. Tim Pondasi"></div>'+
        '<div id="nw_induk_wrap" class="hidden"><label class="'+lbl+'">Orang ini juga bekerja di proyek lain?</label><select id="nw_induk" class="'+inputCls+'"></select>'+
          '<div class="text-xs text-slate-400 mt-1.5">Pilih bila orang yang sama bekerja setengah hari di sini dan setengah hari di proyek lain. Aplikasi memberi peringatan bila totalnya lebih dari 1 hari.</div></div>'+
      '</div>'+
      '<div id="nw_note" class="rounded-xl bg-slate-50 border border-slate-200 px-4 py-3 text-xs text-slate-500">Upah mengikuti tarif status (dan tarif tim bila ada) yang diatur Admin Pusat/Akuntan.</div>'+
      '<button type="button" id="nw_kelola" class="text-sm font-bold text-emerald-700 underline underline-offset-2 py-1">Ada yang sudah tidak bekerja? Kelola daftar pekerja</button>'+
    '</div>',
    function(){
      var borong = document.getElementById('nw_borong').checked;
      var nama = fv('nw_nama'), grade = fv('nw_grade'), sel = fv('nw_timsel');
      var tim = borong ? '' : (sel === '__new__' ? fv('nw_timbaru') : (sel === '__none__' ? '' : sel));
      if(!nama){ toast(borong ? 'Nama tim borongan wajib diisi.' : 'Nama pekerja wajib diisi.', true); return; }
      if(!borong && sel === '__new__' && !tim){ toast('Isi nama tim baru.', true); return; }
      var id = 'wrk_'+Math.random().toString(36).slice(2,8)+Date.now().toString(36);
      var body = {id:id, project_id:STATE.projectId, nama:nama, grade:borong?'LAIN':grade, tim:tim};
      if(borong) body.borongan = true;
      var induk = borong ? '' : fv('nw_induk'); if(induk) body.induk_id = induk;
      var sv = document.getElementById('mSave'); if(sv){ sv.disabled = true; sv.textContent = 'Menyimpan…'; }
      apiFetch('/workers.php', {method:'POST', body:JSON.stringify(body)}).then(function(r){
        var w = {id:r.id || id, project_id:STATE.projectId, nama:nama.replace(/\s+/g,' '), grade:r.grade||body.grade, tim:(r.tim!=null?r.tim:tim), aktif:1, diverifikasi:1, borongan:r.borongan?1:0, induk_id:r.induk_id||null};
        // Show the new person at once (same order the server uses: tim, status, nama) instead of reloading the screen.
        ABSEN.workers.push(w); ABSEN.cur[w.id] = {h:null, l:0}; ABSEN.orig[w.id] = {h:null, l:0};
        ABSEN.workers.sort(function(a,b){ return (a.tim||'').localeCompare(b.tim||'') || GRADE_SORT(a.grade)-GRADE_SORT(b.grade) || a.nama.localeCompare(b.nama); });
        lsSet('ms_workers_'+STATE.projectId, ABSEN.workers);
        closeModal(); toast('"'+w.nama+'" ditambahkan'+(w.borongan?' sebagai tim borongan':'')+'.'); drawAbsen(c);

          var nid = e.data.nonaktif_id;

          confirmModal('Pernah ada di proyek ini', '<b>'+esc(e.data.nama||nama)+'</b> pernah ada dan sedang tidak aktif. Aktifkan kembali orang yang sama (riwayat absen tetap)?', function(){
            apiFetch('/workers.php', {method:'POST', body:JSON.stringify({action:'set_aktif', id:nid, aktif:true})})
              .then(function(){ toast('"'+(e.data.nama||nama)+'" aktif kembali.'); if(absenDirty()) { drawAbsen(c); toast('Muat ulang layar Absen setelah menyimpan agar nama muncul.'); } else renderAbsen(c); })
              .catch(function(e2){ toast(e2.message, true); });
          });
          return;

        toast(e.network ? 'Tambah pekerja butuh sinyal. Coba lagi saat ada sinyal.' : e.message, true);

  var syncTim = function(){ var nb = document.getElementById('nw_timbaru'); nb.classList.toggle('hidden', ts.value !== '__new__'); if(ts.value === '__new__') nb.focus(); };
  ts.addEventListener('change', syncTim);
  var bor = document.getElementById('nw_borong');
  bor.addEventListener('change', function(){
    var on = bor.checked;
    document.getElementById('nw_biasa').classList.toggle('hidden', on);
    document.getElementById('nw_namalbl').textContent = on ? 'Nama tim borongan *' : 'Nama pekerja *';
    document.getElementById('nw_nama').placeholder = on ? 'mis. Tim Cat' : 'mis. Asep';
    document.getElementById('nw_note').textContent = on ? 'Tim borongan dibayar langsung per tim. Nominal borongannya diisi Akuntan/Admin Pusat; kasbon tim ikut dipotong otomatis. Menandai hadir hanya catatan (opsional).' : 'Upah mengikuti tarif status (dan tarif tim bila ada) yang diatur Admin Pusat/Akuntan.';
  });
  document.getElementById('nw_kelola').onclick = function(){ closeModal(); openManageWorkers(c); };
  // "Orang ini juga bekerja di proyek lain?" appears only when someone else's project has people to pick from.
  apiFetch('/workers.php?kandidat=1&project_id='+encodeURIComponent(STATE.projectId)).then(function(list){
    if(!Array.isArray(list) || !list.length || !document.getElementById('nw_induk')) return;
    var si = document.getElementById('nw_induk');
    si.innerHTML = '<option value="">Tidak, orang baru</option>'+list.map(function(w){ return '<option value="'+esc(w.id)+'" data-g="'+esc(w.grade)+'">'+esc(w.nama)+' · '+esc(w.project_nama)+'</option>'; }).join('');
    document.getElementById('nw_induk_wrap').classList.remove('hidden');
    if(si._enhanced) si.dispatchEvent(new Event('ss-refresh')); else enhanceSelect(si);
