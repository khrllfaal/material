      var g = o.getAttribute('data-g'); if(g && document.getElementById('nw_grade')){ document.getElementById('nw_grade').value = g; document.getElementById('nw_grade').dispatchEvent(new Event('ss-refresh')); }
    });
  }).catch(function(){});
}

/* Stop / resume workers from the phone: only the "aktif" switch changes, so the absen history stays and the
   same person can be brought back later. */
function openManageWorkers(c){
  openModal('Kelola Daftar Pekerja', '<div id="mw_body" class="text-sm text-slate-400 py-6 text-center">Memuat…</div>', null);
  var cancel = document.getElementById('mCancel'); if(cancel) cancel.textContent = 'Tutup';
  var load = function(){
    apiFetch('/workers.php?all=1&project_id='+encodeURIComponent(STATE.projectId)).then(function(all){
      var host = document.getElementById('mw_body'); if(!host) return;
      var act = all.filter(function(w){ return w.aktif; }), off = all.filter(function(w){ return !w.aktif; });
      var row = function(w, on){
        return '<div class="flex items-center gap-2 py-2 border-b border-slate-100 last:border-0"><div class="min-w-0 flex-1"><div class="font-bold text-[15px] truncate">'+esc(w.nama)+'</div>'+
          '<div class="text-[11.5px] text-slate-400 truncate">'+(w.borongan?'Tim borongan':esc(GRADE_NAMA[w.grade]||w.grade))+(w.tim && !w.borongan ? ' · '+esc(w.tim) : '')+'</div></div>'+
          '<button type="button" data-mw="'+esc(w.id)+'|'+(on?0:1)+'" class="shrink-0 h-10 px-4 rounded-xl text-sm font-bold '+(on?'bg-red-50 text-red-600 border border-red-100':'bg-emerald-600 text-white')+'">'+(on?'Berhenti':'Aktifkan')+'</button></div>';
      };
      host.className = 'text-left';
      host.innerHTML = '<div class="text-xs font-extrabold uppercase tracking-wide text-slate-500 mb-1">Bekerja ('+act.length+')</div>'+(act.length?act.map(function(w){ return row(w,true); }).join(''):'<div class="text-sm text-slate-400 py-3">Belum ada.</div>')+
        '<div class="text-xs font-extrabold uppercase tracking-wide text-slate-500 mt-5 mb-1">Tidak bekerja lagi ('+off.length+')</div>'+(off.length?off.map(function(w){ return row(w,false); }).join(''):'<div class="text-sm text-slate-400 py-3">Tidak ada.</div>')+
        '<div class="text-xs text-slate-400 mt-4">Riwayat absen dan gaji tidak hilang. Bila orangnya bekerja lagi, ketuk Aktifkan.</div>';
      host.querySelectorAll('[data-mw]').forEach(function(b){ b.onclick = function(){
        if(absenDirty()){ toast('Simpan absen dulu sebelum mengubah daftar pekerja.', true); return; }
        var p = b.getAttribute('data-mw').split('|'); b.disabled = true;
        apiFetch('/workers.php', {method:'POST', body:JSON.stringify({action:'set_aktif', id:p[0], aktif:p[1]==='1'})})
          .then(function(){ toast(p[1]==='1' ? 'Pekerja aktif kembali ✓' : 'Ditandai tidak bekerja lagi ✓'); load(); renderAbsen(c); })
          .catch(function(e){ b.disabled = false; toast(e.network ? 'Butuh sinyal.' : e.message, true); });
      }; });
    }).catch(function(e){ var host = document.getElementById('mw_body'); if(host) host.textContent = e.network ? 'Butuh sinyal untuk mengelola daftar.' : e.message; });
  };
  load();
}

/* Kasbon: ONE request can hold several lines (e.g. Tim A and Tim B). "Atas nama" = a whole tim first, then
   individual workers, all searchable. One request per name per week (the server enforces it too). */
function openKasbonRequest(c){
  var tims = []; ABSEN.workers.forEach(function(w){ if(!w.borongan && w.tim && tims.indexOf(w.tim)<0) tims.push(w.tim); });
  var wkNow = weekOf(today()), asked = {};
  (ABSEN.kreqAll||[]).forEach(function(k){
    var d = String(k.tgl_wib || k.created_at || '').slice(0,10);
    if(k.status !== 'ditolak' && d >= wkNow.from && d <= wkNow.to) asked[k.worker_id ? 'w:'+k.worker_id : (k.tim ? 't:'+k.tim : 'g')] = true;
  });
  var tag = function(key){ return asked[key] ? ' · sudah diajukan minggu ini' : ''; };
  var opts = [];
  tims.forEach(function(t){ opts.push(['t:'+t, 'Tim · '+t+tag('t:'+t)]); });
  if(!tims.length) opts.push(['g', 'Grup / penanggung jawab'+tag('g')]);
  ABSEN.workers.forEach(function(w){ opts.push(['w:'+w.id, (w.borongan ? 'Tim borongan · '+w.nama+tag('w:'+w.id) : 'Pekerja · '+w.nama+' ('+(GRADE_NAMA[w.grade]||w.grade)+(w.tim?', '+w.tim:'')+')'+tag('w:'+w.id))]); });
  var free = opts.filter(function(o){ return !asked[o[0]]; });
  var lines = [{who:(free[0]||opts[0])[0], jum:''}];
  function rowHtml(i){
    var ln = lines[i];
    return '<div class="rounded-xl border border-slate-200 bg-slate-50/60 p-3" data-kl="'+i+'">'+
      '<div class="flex items-center justify-between mb-1.5"><label class="block text-xs font-bold text-slate-500">Atas nama (tim atau pekerja)</label>'+(lines.length>1?'<button type="button" data-kl-del="'+i+'" class="text-xs font-bold text-red-500">Hapus</button>':'')+'</div>'+
      '<select data-kl-who="'+i+'" class="'+inputCls+'">'+opts.map(function(o){ return '<option value="'+esc(o[0])+'"'+(o[0]===ln.who?' selected':'')+'>'+esc(o[1])+'</option>'; }).join('')+'</select>'+
      '<div class="mt-2">'+numInputHtml('kl_j'+i, ln.jum, inputCls, ' data-money placeholder="Jumlah (Rp), mis. 500.000" data-kl-jum="'+i+'"')+'</div></div>';
  }
  function draw(){
    document.getElementById('kl_rows').innerHTML = lines.map(function(_, i){ return rowHtml(i); }).join('<div class="h-2"></div>');
    document.querySelectorAll('#kl_rows select').forEach(enhanceSelect);
    document.querySelectorAll('#kl_rows [data-kl-who]').forEach(function(el){ el.addEventListener('change', function(){ lines[+el.getAttribute('data-kl-who')].who = el.value; }); });
    document.querySelectorAll('#kl_rows [data-kl-jum]').forEach(function(el){ el.addEventListener('input', function(){ lines[+el.getAttribute('data-kl-jum')].jum = el.value; updTotal(); }); });
    document.querySelectorAll('#kl_rows [data-kl-del]').forEach(function(el){ el.onclick = function(){ lines.splice(+el.getAttribute('data-kl-del'), 1); draw(); updTotal(); }; });
    updTotal();
  }
  function updTotal(){ var t = lines.reduce(function(a,l){ var v = parseIdNum(l.jum); return a+(Number.isNaN(v)?0:v); },0); var el = document.getElementById('kl_total'); if(el) el.textContent = t>0 ? 'Total Rp '+fmtIdNum(t) : ''; }
  openModal('Ajukan Kasbon',
    '<div class="space-y-3"><div id="kl_rows"></div>'+
      '<div class="flex items-center justify-between"><button type="button" id="kl_add" class="text-sm font-bold text-emerald-700">＋ Tambah tim / pekerja lain</button><span id="kl_total" class="text-sm font-extrabold text-slate-700 tabular-nums"></span></div>'+
      '<div><label class="block text-xs font-bold text-slate-500 mb-1.5">Keperluan</label><input id="kr_ket" type="text" autocomplete="off" class="'+inputCls+'" placeholder="Opsional"></div>'+
      '<div class="rounded-xl bg-slate-50 border border-slate-200 px-4 py-3 text-xs text-slate-500">Satu pengajuan boleh untuk beberapa tim. Satu nama hanya sekali per minggu. Setelah disetujui Akuntan, kasbon dipotong otomatis dari gaji sampai lunas.</div>'+
    '</div>',
    function(){
      var items = [], used = {};
      for(var i=0;i<lines.length;i++){
        var ln = lines[i], j = parseIdNum(ln.jum);
        if(Number.isNaN(j) || j<=0){ toast('Isi jumlah kasbon di baris '+(i+1)+'.', true); return; }
        if(asked[ln.who]){ toast('Nama di baris '+(i+1)+' sudah mengajukan kasbon minggu ini (satu kali per minggu).', true); return; }
        if(used[ln.who]){ toast('Nama yang sama dipilih dua kali.', true); return; }
        used[ln.who] = true;
        items.push({id:'ksr_'+Math.random().toString(36).slice(2,8)+Date.now().toString(36)+i, jumlah:j,
          worker_id: ln.who.indexOf('w:')===0 ? ln.who.slice(2) : null, tim: ln.who.indexOf('t:')===0 ? ln.who.slice(2) : ''});
      }
      var payload = {project_id:STATE.projectId, ket:fv('kr_ket'), items:items};
      var sv = document.getElementById('mSave'); if(sv){ sv.disabled = true; sv.textContent = 'Mengirim…'; }
      apiFetch('/kasbon_requests.php', {method:'POST', body:JSON.stringify(payload)})
        .then(function(r){
          var rows = items.map(function(it){
            var wn = it.worker_id ? ((ABSEN.workers.find(function(w){ return w.id===it.worker_id; })||{}).nama||'') : '';
            return {id:it.id, project_id:STATE.projectId, worker_id:it.worker_id, worker_nama:wn, tim:it.tim, batch_id:r.batch_id||null, jumlah:it.jumlah, ket:payload.ket, status:'diajukan', catatan:'', created_at:new Date().toISOString(), tgl_wib:today()};
          });
          ABSEN.kreqAll = rows.concat(ABSEN.kreqAll||[]); ABSEN.kreq = ABSEN.kreqAll.slice(0,12);
          closeModal(); toast('Pengajuan kasbon terkirim ✓'); drawAbsen(c); })
        .catch(function(e){
          if(e.network || e.auth){ outboxAdd({endpoint:'/kasbon_requests.php', payload:payload, label:'Kasbon'}); closeModal(); toast(e.auth ? 'Sesi berakhir. Pengajuan disimpan dan terkirim otomatis setelah Anda masuk lagi.' : 'Tidak ada sinyal. Pengajuan disimpan dan dikirim otomatis saat sinyal kembali.'); renderTab(); }
          else { if(sv){ sv.disabled = false; sv.textContent = 'Simpan'; } toast(e.message, true); }
        });
    });
  draw();
  document.getElementById('kl_add').onclick = function(){
    if(lines.length >= 6){ toast('Maksimal 6 baris per pengajuan.', true); return; }
    var taken = lines.map(function(l){ return l.who; });
    var nxt = opts.find(function(o){ return !asked[o[0]] && taken.indexOf(o[0])<0; });
    if(!nxt){ toast('Semua nama sudah dipilih / sudah mengajukan minggu ini.', true); return; }
    lines.push({who:nxt[0], jum:''}); draw();
  };
}

function openAjukan(c){
  var wk = perSpan(ABSEN.tgl), p = ABSEN.period || {};
  if(absenDirty()){ toast('Simpan absen dulu sebelum mengajukan.', true); return; }
  var gaps = absenMissing();
  openModal('Ajukan Absen Minggu Ini',
    '<div class="space-y-4">'+
      '<div class="rounded-xl bg-slate-50 border border-slate-200 px-4 py-3 text-sm text-slate-600">Periode <b>'+esc(fmtTglPendek(wk.from))+' – '+esc(fmtTglPendek(wk.to))+'</b>. Satu pengajuan untuk <b>seluruh tim</b> di proyek ini. Setelah diajukan, absen minggu ini dikunci untuk Anda dan diteruskan ke pusat untuk dibayar.</div>'+
      '<div class="rounded-xl bg-sky-50 border border-sky-100 px-4 py-2.5 text-xs text-sky-800">Proyek berhenti sebelum akhir minggu (mis. di hari ke-4)? Tidak apa-apa — ajukan sekarang. Hari yang tidak diisi dianggap tidak kerja. Bila minggu yang sama ternyata masih ada kerja, hari berikutnya tetap bisa diisi dan dibayar sebagai periode susulan.</div>'+
      (gaps.length ? '<div class="rounded-xl bg-amber-50 border border-amber-200 px-4 py-3 text-xs text-amber-900"><b>Hari yang masih kosong:</b> '+gaps.map(function(d){ return esc(HARI_NAMA[parseISO(d).getDay()].slice(0,3)+' '+parseISO(d).getDate()); }).join(', ')+'. Hari kosong dihitung tidak kerja (tanpa gaji).</div>' : '')+
      '<div><label class="block text-xs font-bold text-slate-500 mb-1.5">Penanggung jawab *</label><input id="aj_pj" type="text" autocomplete="off" class="'+inputCls+'" value="'+esc(p.pj_nama||'')+'" placeholder="mis. Arya"></div>'+
      '<div><label class="block text-xs font-bold text-slate-500 mb-1.5">Keterangan pekerjaan <span class="font-normal text-slate-400">(opsional)</span></label><input id="aj_cat" type="text" autocomplete="off" maxlength="200" class="'+inputCls+'" placeholder="mis. cor lantai 2, bongkar gudang"></div>'+
    '</div>',
    function(){
      var pj = fv('aj_pj');
      if(!pj){ toast('Nama penanggung jawab wajib diisi.', true); return; }
      var sv = document.getElementById('mSave'); if(sv){ sv.disabled = true; sv.textContent = 'Mengirim…'; }
      apiFetch('/payroll_periods.php', {method:'POST', body:JSON.stringify({action:'ajukan', project_id:STATE.projectId, tgl:ABSEN.tgl, pj_nama:pj, catatan:fv('aj_cat')})})
        .then(function(){ closeModal(); toast('Absen sudah diajukan ✓'); renderAbsen(c); })
        .catch(function(e){ if(sv){ sv.disabled = false; sv.textContent = 'Simpan'; } toast(e.network ? 'Mengajukan butuh sinyal.' : e.message, true); });
    });
  var sv0 = document.getElementById('mSave'); if(sv0) sv0.textContent = 'Ajukan';
}


function renderStok(c){
  c.innerHTML = card('<div class="text-center text-sm text-slate-400 py-4">Memuat stok…</div>');
  apiFetch('/material_stock.php').then(function(rows){
    var mine = rows.filter(function(r){ return r.project_id === STATE.projectId; });
    if(!mine.length){ c.innerHTML = card('<div class="text-center text-sm text-slate-400 py-4">Belum ada data bahan masuk/pemakaian untuk proyek ini.</div>'); return; }
    c.innerHTML = mine.map(function(r){
      return card(
        '<div class="flex items-start justify-between gap-3">'+
          '<div><div class="font-bold text-[15px]">'+esc(r.material_nama)+'</div>'+
          '<div class="text-xs text-slate-400 mt-0.5">Masuk '+fmtNum(r.total_masuk)+' · Keluar '+fmtNum(r.total_keluar)+' '+esc(r.satuan)+'</div></div>'+
          statusBadge(r.status)+
        '</div>'+
        '<div class="text-2xl font-extrabold mt-3">'+fmtNum(r.stok)+' <span class="text-sm font-medium text-slate-400">'+esc(r.satuan)+'</span></div>'
      );
    }).join('');
  }).catch(function(e){
    c.innerHTML = card(e.network
      ? '<div class="text-center text-sm text-slate-500 py-4">Stok hanya bisa dilihat saat ada sinyal.<br><span class="text-xs text-slate-400">Input Anda tetap tersimpan di perangkat.</span></div>'
      : '<div class="text-center text-sm text-red-500 py-4">Gagal memuat: '+esc(e.message)+'</div>');
  });
}

/* Riwayat — one tidy table (not a card list): Tanggal, Jenis, Bahan,
   Qty, Referensi/Pekerjaan, Keterangan, Aksi. Scrolls horizontally on
   narrow phones rather than losing columns. */
function renderRiwayat(c){
  c.innerHTML = card('<div class="text-center text-sm text-slate-400 py-4">Memuat riwayat…</div>');
  var offlineView = false;
  var noSignal = function(e){ if(e.network){ offlineView = true; return []; } throw e; };
  Promise.all([
    apiFetch('/material_receipts.php').catch(noSignal),
    apiFetch('/material_usage.php').catch(noSignal),
  ]).then(function(r){
    var matName = function(id){ var m = STATE.materials.find(function(x){ return x.id===id; }); return m ? m.nama : id; };
    var pkName = function(id){ var pk=(STATE.pekerjaanAll||[]).find(function(x){ return x.id===id; }); return pk?pk.nama:''; };
    var pending = outboxGet().filter(function(o){ return o.payload.project_id === STATE.projectId; })
      .map(function(o){ return {pending:true, jenis:o.endpoint.indexOf('receipts')>-1?'Masuk':'Pemakaian', tgl:o.payload.tgl, material_id:o.payload.material_id, qty:Number(o.payload.qty)||0, ref:o.payload.no_referensi||'', ket:o.payload.ket||'', id:o.payload.id}; });
    var allMasuk = r[0].filter(function(x){ return x.project_id === STATE.projectId; })
      .map(function(x){ return {jenis:'Masuk', tgl:x.tgl, material_id:x.material_id, qty:Number(x.qty)||0, ref:x.no_referensi||'', ket:x.ket||'', id:x.id}; });
    var allPakai = r[1].filter(function(x){ return x.project_id === STATE.projectId; })
      .map(function(x){ return {jenis:'Pemakaian', tgl:x.tgl, material_id:x.material_id, qty:Number(x.qty)||0, ref:x.pekerjaan_id?pkName(x.pekerjaan_id):'', ket:x.ket||'', id:x.id}; });
    var all = pending.concat(allMasuk, allPakai).sort(function(a,b){
      if(!!a.pending !== !!b.pending) return a.pending ? -1 : 1;
      return a.tgl<b.tgl?1:(a.tgl>b.tgl?-1:0);
    });

    c.innerHTML = card(
      (offlineView ? '<div class="text-xs text-slate-500 bg-slate-50 rounded-xl px-3 py-2 mb-3">Tidak ada sinyal. Riwayat server belum bisa dimuat; yang tampil hanya data yang menunggu dikirim.</div>' : '')+
      '<div class="mb-3"><input type="text" id="rw_q" placeholder="Cari nama bahan…" class="'+inputCls+' mb-2.5"></div>'+
      '<div class="grid grid-cols-2 gap-2.5 mb-1">'+
        '<div><label class="block text-[11px] font-bold text-slate-500 mb-1">Dari Tanggal</label><input type="date" id="rw_from" class="'+inputCls+' text-sm"></div>'+
        '<div><label class="block text-[11px] font-bold text-slate-500 mb-1">Sampai Tanggal</label><input type="date" id="rw_to" class="'+inputCls+' text-sm"></div>'+
      '</div>'
    ) + '<div id="rw_tbl_wrap"></div>';

    function applyFilter(){
      var q=fv('rw_q').toLowerCase(), from=fv('rw_from'), to=fv('rw_to');
      return all.filter(function(x){
        if(from && x.tgl<from) return false;
        if(to && x.tgl>to) return false;
        if(q && matName(x.material_id).toLowerCase().indexOf(q)===-1) return false;
        return true;
      });
    }
    var shown = 30;
    var BULAN=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
    function fmtTgl(t){ var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(t||''); return m ? (parseInt(m[3],10)+' '+BULAN[parseInt(m[2],10)-1]+' '+m[1]) : (t||''); }
    function draw(more){
      if(more!==true) shown = 30;
      var full = applyFilter(), list = full.slice(0, shown);
      // Read-only log for Admin Lapangan — no edit/delete here. A wrong
      // entry gets fixed by Admin Pusat (who can see it in Riwayat
      // Transaksi), not silently removed by whoever typed it in the
      // field; that's also the only honest record if a correction is
      // ever questioned later.
      var html = '', lastTgl = null;
      list.forEach(function(x){
        if(x.tgl !== lastTgl){
          html += '<div class="text-xs font-bold text-slate-400 uppercase tracking-wide px-1 pt-4 pb-2">'+esc(fmtTgl(x.tgl))+'</div>';
          lastTgl = x.tgl;
        }
        var masuk = x.jenis==='Masuk';
        html += '<div class="bg-white rounded-2xl border border-slate-100 shadow-sm px-4 py-3 mb-2 flex items-start gap-3">'+
          '<span class="shrink-0 mt-0.5 w-9 h-9 rounded-xl flex items-center justify-center font-extrabold text-lg '+(masuk?'bg-emerald-50 text-emerald-600':'bg-amber-50 text-amber-600')+'">'+(masuk?'+':'−')+'</span>'+
          '<div class="min-w-0 flex-1">'+
            '<div class="flex items-start justify-between gap-2"><div class="font-bold text-[15px] text-slate-800 leading-snug">'+esc(matName(x.material_id))+'</div>'+
            '<div class="font-extrabold text-[15px] whitespace-nowrap '+(masuk?'text-emerald-600':'text-amber-600')+'">'+(masuk?'+':'−')+fmtNum(x.qty)+'</div></div>'+
            '<div class="text-xs text-slate-500 mt-0.5">'+(masuk?'Bahan Masuk':'Pemakaian')+
              (x.pending?' <span class="font-bold px-2 py-0.5 rounded-full bg-slate-100 text-slate-600">Menunggu sinyal</span>':'')+
              (x.ref?' · '+esc(x.ref):'')+'</div>'+
            (x.ket?'<div class="text-xs text-slate-400 mt-1 break-words">'+esc(x.ket)+'</div>':'')+
          '</div></div>';
      });
      if(!list.length) html = '<div class="text-center text-slate-400 text-sm py-10">Tidak ada data.</div>';
      if(full.length > list.length) html += '<button type="button" id="rw_more" class="w-full mt-2 py-3 rounded-2xl bg-white border border-slate-200 text-sm font-bold text-slate-600">Tampilkan lebih banyak ('+(full.length-list.length)+' lagi)</button>';
      document.getElementById('rw_tbl_wrap').innerHTML = html;
      var mb = document.getElementById('rw_more');
      if(mb) mb.onclick = function(){ shown += 30; draw(true); };
      icons();
    }
    icons();
    draw();
    enhanceClearable(document.getElementById('rw_q'));
    document.getElementById('rw_q').addEventListener('input', draw);
    document.getElementById('rw_from').addEventListener('change', draw);
    document.getElementById('rw_to').addEventListener('change', draw);
  }).catch(function(e){ c.innerHTML = card('<div class="text-center text-sm text-red-500 py-4">Gagal memuat: '+esc(e.message)+'</div>'); });
}
</script>
