<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Material & Stok — Admin</title>
<link rel="stylesheet" href="vendor/tailwind.css">
<script src="vendor/icons.js"></script>
<style>
  body{font-family:'Inter',ui-sans-serif,system-ui,sans-serif;}
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:8px;}
  table{border-collapse:collapse;}
</style>
</head>
<body class="bg-slate-50 text-slate-800">

<div id="loginScreen" class="min-h-screen flex items-center justify-center p-6">
  <div class="bg-white rounded-3xl shadow-lg shadow-slate-200 p-9 w-full max-w-sm">
    <div class="w-12 h-12 rounded-2xl bg-blue-600 text-white flex items-center justify-center mb-5">
      <i data-lucide="boxes" class="w-6 h-6"></i>
    </div>
    <h1 class="text-xl font-extrabold text-slate-800">Material & Stok</h1>
    <p class="text-slate-500 text-sm mt-1 mb-6">Admin Pusat / Owner</p>
    <div id="loginErr" class="hidden bg-red-50 text-red-700 border border-red-200 rounded-xl px-3.5 py-2.5 text-sm mb-4"></div>
    <form id="loginForm" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-500 mb-1.5">Email</label>
        <input type="email" id="loginEmail" required class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-100 focus:border-blue-500">
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-500 mb-1.5">Password</label>
        <input type="password" id="loginPassword" required class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-100 focus:border-blue-500">
      </div>
      <button class="w-full bg-blue-600 hover:bg-blue-700 active:scale-[.98] transition text-white font-bold py-3 rounded-xl text-sm disabled:opacity-60" id="loginSubmit" type="submit">Masuk</button>
    </form>
  </div>
</div>

<div id="shell" class="hidden">
  <div id="sidebar" class="w-60 bg-slate-900 text-slate-300 fixed top-0 bottom-0 left-0 overflow-y-auto flex flex-col">
    <div class="px-5 py-5 flex items-center gap-2.5 border-b border-white/10">
      <div class="w-8 h-8 rounded-lg bg-blue-600 text-white flex items-center justify-center shrink-0"><i data-lucide="boxes" class="w-4.5 h-4.5"></i></div>
      <span class="font-extrabold text-white text-[15px] tracking-tight">Material & Stok</span>
    </div>
    <div class="px-5 py-3.5 text-xs text-slate-400 border-b border-white/10" id="whoInfo">—</div>
    <div id="navList" class="py-2 flex-1"></div>
    <a id="btnLogout" class="mx-3 mb-4 mt-2 flex items-center gap-2 px-3 py-2.5 rounded-xl text-sm text-slate-400 hover:bg-white/5 hover:text-white cursor-pointer transition-colors">
      <i data-lucide="log-out" class="w-4 h-4"></i> Keluar
    </a>
  </div>
  <div class="ml-60 p-8 max-w-6xl"><div id="content"></div></div>
</div>

<div id="modalBack" class="hidden fixed inset-0 bg-slate-900/50 z-30 items-center justify-center p-5">
  <div id="modalBody" class="bg-white rounded-2xl p-7 w-full max-w-md max-h-[88vh] overflow-y-auto shadow-xl"></div>
</div>
<div id="toastWrap"></div>

<script src="backend-config.js"></script>
<script>
/* ============================================================
   Standalone Material & Stok admin dashboard. Same PHP+MySQL
   session/API contract as frontend/lapangan.html — plain fetch,
   no build step, no framework.
   ============================================================ */
var STATE = { user:null, page:'dashboard', cache:{} };

function apiFetch(path, opts){
  opts = opts || {};
  opts.credentials = 'include';
  opts.headers = Object.assign({'Content-Type':'application/json'}, opts.headers||{});
  return fetch((window.API_BASE_URL||'') + path, opts).then(async function(res){
    var data = {}; try{ data = await res.json(); }catch(e){}
    if(!res.ok) throw new Error(data.error || ('HTTP '+res.status));
    return data;
  });
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function num0(n){ if(n==null||Number.isNaN(n)) return '0'; return Math.round(Number(n)).toLocaleString('id-ID'); }
function numSigned(n){ n=Number(n)||0; return (n<0?'-':'')+Math.round(Math.abs(n)).toLocaleString('id-ID'); }
function pct(n){ if(n==null||Number.isNaN(n)) return '–'; return (n*100).toFixed(1)+'%'; }
function uid(p){ return p + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function today(){ return new Date().toISOString().slice(0,10); }
function icons(){ if(window.lucide) lucide.createIcons(); }
function toast(msg, danger){
  var d=document.createElement('div');
  d.className='fixed right-5 bottom-5 text-white text-sm px-4 py-3.5 rounded-xl shadow-lg z-50 '+(danger?'bg-red-600':'bg-slate-900');
  d.textContent = msg;
  document.getElementById('toastWrap').appendChild(d);
  setTimeout(function(){ d.remove(); }, 2800);
}
function isOwner(){ return !!(STATE.user && STATE.user.role==='owner'); }
function fv(id){ var e=document.getElementById(id); return e?String(e.value||'').trim():''; }

function openModal(title, html, onSave){
  document.getElementById('modalBody').innerHTML =
    '<h2 class="text-lg font-bold mb-5">'+esc(title)+'</h2>'+html+
    '<div class="flex justify-end gap-2.5 mt-6">'+
    '<button class="px-4 py-2.5 rounded-xl text-sm font-semibold bg-slate-100 hover:bg-slate-200 transition" id="mCancel">Batal</button>'+
    (onSave?'<button class="px-4 py-2.5 rounded-xl text-sm font-semibold bg-blue-600 hover:bg-blue-700 text-white transition" id="mSave">Simpan</button>':'')+'</div>';
  document.getElementById('modalBack').classList.remove('hidden');
  document.getElementById('modalBack').classList.add('flex');
  document.getElementById('mCancel').onclick = closeModal;
  if(onSave) document.getElementById('mSave').onclick = onSave;
}
function closeModal(){ document.getElementById('modalBack').classList.add('hidden'); document.getElementById('modalBack').classList.remove('flex'); }
function confirmModal(title, msg, onYes){
  openModal(title, '<p class="text-sm text-slate-600">'+msg+'</p>', function(){ closeModal(); onYes(); });
}
var fieldCls = "w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-100 focus:border-blue-500";

/* ---------------- auth ---------------- */
document.getElementById('loginForm').addEventListener('submit', function(e){
  e.preventDefault();
  var email=fv('loginEmail'), password=document.getElementById('loginPassword').value;
  var btn=document.getElementById('loginSubmit'), err=document.getElementById('loginErr');
  err.classList.add('hidden'); btn.disabled=true; btn.textContent='Memproses…';
  apiFetch('/auth_login.php', {method:'POST', body:JSON.stringify({email:email,password:password})})
    .then(function(res){ boot(res.user); })
    .catch(function(e){ err.textContent=e.message||'Login gagal.'; err.classList.remove('hidden'); })
    .finally(function(){ btn.disabled=false; btn.textContent='Masuk'; });
});
document.getElementById('btnLogout').onclick=function(){
  apiFetch('/auth_logout.php', {method:'POST'}).catch(function(){}).finally(function(){ location.reload(); });
};
apiFetch('/auth_me.php').then(function(res){ if(res.user) boot(res.user); }).catch(function(){});

function boot(user){
  if(user.role==='lapangan'){ location.href='lapangan.html'; return; }
  STATE.user = user;
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('shell').classList.remove('hidden');
  document.getElementById('shell').style.display='block';
  document.getElementById('whoInfo').innerHTML = '<div class="font-semibold text-slate-200">'+esc(user.nama)+'</div>'+
    '<div class="mt-0.5">'+({admin:'Admin Pusat',owner:'Owner (read-only)'}[user.role]||user.role)+'</div>';
  renderNav();
  icons();
  go('dashboard');
}

var NAV=[
  {id:'dashboard', label:'Dashboard', icon:'layout-dashboard'},
  {id:'proyek', label:'Master Proyek', icon:'briefcase'},
  {id:'bahan', label:'Master Bahan', icon:'box'},
  {id:'pekerjaan', label:'Master Pekerjaan', icon:'hammer'},
  {id:'rap', label:'Konfigurasi RAP', icon:'file-spreadsheet'},
  {id:'stock', label:'Monitor Stok', icon:'layers'},
  {id:'rap_report', label:'Analisis RAP Bahan', icon:'trending-up'},
  {id:'users', label:'Kelola User', icon:'users'},
];
function renderNav(){
  document.getElementById('navList').innerHTML = NAV.map(function(n){
    return '<a data-page="'+n.id+'" class="nav-link flex items-center gap-2.5 mx-3 my-0.5 px-3 py-2.5 rounded-xl text-[13.5px] font-medium cursor-pointer transition-colors">'+
      '<i data-lucide="'+n.icon+'" class="w-4 h-4"></i>'+esc(n.label)+'</a>';
  }).join('');
  document.querySelectorAll('.nav-link').forEach(function(a){
    a.onclick=function(){ go(a.getAttribute('data-page')); };
  });
}
function go(page){
  STATE.page=page;
  document.querySelectorAll('.nav-link').forEach(function(a){
    var on = a.getAttribute('data-page')===page;
    a.classList.toggle('bg-blue-600', on);
    a.classList.toggle('text-white', on);
    a.classList.toggle('text-slate-300', !on);
    a.classList.toggle('hover:bg-white/5', !on);
  });
  var c=document.getElementById('content');
  c.innerHTML='';
  (PAGES[page]||function(c){ c.innerHTML='<div class="text-slate-400">Halaman tidak ditemukan.</div>'; })(c);
  icons();
}
function pageHead(title, sub, actionsHTML){
  return '<div class="flex justify-between items-start flex-wrap gap-3 mb-6">'+
    '<div><h1 class="text-xl font-extrabold text-slate-800">'+esc(title)+'</h1>'+(sub?'<div class="text-sm text-slate-500 mt-1">'+esc(sub)+'</div>':'')+'</div>'+
    (actionsHTML?'<div>'+actionsHTML+'</div>':'')+'</div>';
}
var btnPrimary = 'inline-flex items-center gap-1.5 bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold px-4 py-2.5 rounded-xl transition-colors';
var btnGhostSm = 'text-xs font-semibold px-2.5 py-1.5 rounded-lg bg-slate-100 hover:bg-slate-200 transition-colors';
var btnDangerSm = 'text-xs font-semibold px-2.5 py-1.5 rounded-lg bg-red-50 text-red-600 hover:bg-red-100 transition-colors';
function panel(inner){ return '<div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-5">'+inner+'</div>'; }
function badge(kind, label){
  var map={aman:'bg-emerald-50 text-emerald-700', warn:'bg-amber-50 text-amber-700', danger:'bg-red-50 text-red-700', neutral:'bg-slate-100 text-slate-500'};
  return '<span class="text-[11px] font-bold px-2.5 py-1 rounded-full whitespace-nowrap '+(map[kind]||map.neutral)+'">'+esc(label)+'</span>';
}

/* ---------------- generic master-data CRUD page ---------------- */
/* cfg: {title, sub, endpoint, addLabel, fields:[{key,label,type,required,optionsFn}], columns:[{key,label,render}] } */
function masterPage(cfg){
  return function(c){
    c.innerHTML = pageHead(cfg.title, cfg.sub, isOwner()?'':'<button class="'+btnPrimary+'" id="btnAdd"><i data-lucide="plus" class="w-4 h-4"></i>'+esc(cfg.addLabel||'Tambah')+'</button>') +
      panel(
        '<div class="flex justify-between items-center mb-4 gap-3 flex-wrap">'+
          '<div class="relative flex-1 min-w-[220px] max-w-xs"><i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2"></i>'+
          '<input type="text" id="q" placeholder="Cari…" class="w-full pl-9 pr-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-100"></div>'+
          '<span class="text-xs text-slate-400" id="cnt"></span>'+
        '</div>'+
        '<div class="overflow-x-auto -mx-5 px-5"><table class="w-full text-sm" id="tbl"></table></div>'
      );

    var rows=[];
    function draw(){
      var q=fv('q').toLowerCase();
      var list = q ? rows.filter(function(r){ return (cfg.searchFn?cfg.searchFn(r):r.nama).toLowerCase().indexOf(q)>-1; }) : rows;
      document.getElementById('cnt').textContent = list.length+' data';
      var cols = cfg.columns.concat(isOwner()?[]:[{key:'_act',label:'Aksi',render:function(r){
        return '<button class="'+btnGhostSm+'" data-edit="'+esc(r.id)+'">Edit</button> '+
          '<button class="'+btnDangerSm+'" data-del="'+esc(r.id)+'">Hapus</button>';
      }}]);
      var tbl=document.getElementById('tbl');
      tbl.innerHTML = '<thead><tr class="border-b border-slate-200">'+cols.map(function(cl){ return '<th class="text-left text-[11px] font-bold uppercase tracking-wide text-slate-400 py-2.5 pr-4 whitespace-nowrap">'+esc(cl.label)+'</th>'; }).join('')+'</tr></thead>'+
        '<tbody>'+(list.length?list.map(function(r){
          return '<tr class="border-b border-slate-100 hover:bg-slate-50">'+cols.map(function(cl){ return '<td class="py-2.5 pr-4">'+cl.render(r)+'</td>'; }).join('')+'</tr>';
        }).join(''):'<tr><td colspan="'+cols.length+'" class="text-center text-slate-400 text-sm py-10">Belum ada data.</td></tr>')+'</tbody>';
      tbl.querySelectorAll('[data-edit]').forEach(function(b){ b.onclick=function(){ form(b.getAttribute('data-edit')); }; });
      tbl.querySelectorAll('[data-del]').forEach(function(b){ b.onclick=function(){ del(b.getAttribute('data-del')); }; });
    }
    function refresh(){
      apiFetch(cfg.endpoint).then(function(data){ rows=data; draw(); })
        .catch(function(e){ document.getElementById('tbl').innerHTML=''; toast('Gagal memuat: '+e.message, true); });
    }
    function del(id){
      confirmModal('Hapus Data','Yakin mau menghapus data ini? Tindakan ini tidak bisa dibatalkan.', function(){
        apiFetch(cfg.endpoint+'?id='+encodeURIComponent(id), {method:'DELETE'})
          .then(function(){ toast('Data dihapus.'); refresh(); })
          .catch(function(e){ toast('Gagal menghapus: '+e.message, true); });
      });
    }
    function form(id){
      var rec = id ? rows.find(function(x){ return x.id===id; }) : null;
      var html = '<div class="space-y-4">'+cfg.fields.map(function(f){
        var val = rec ? (rec[f.key]!==undefined?rec[f.key]:'') : (f.default!==undefined?f.default:'');
        if(f.type==='select-dyn'){
          var opts=f.optionsFn();
          return '<div><label class="block text-xs font-semibold text-slate-500 mb-1.5">'+esc(f.label)+(f.required?' *':'')+'</label><select id="f_'+f.key+'" class="'+fieldCls+'">'+
            (f.placeholder?'<option value="">'+esc(f.placeholder)+'</option>':'')+
            opts.map(function(o){ return '<option value="'+esc(o.value)+'"'+(String(val)===String(o.value)?' selected':'')+'>'+esc(o.label)+'</option>'; }).join('')+
            '</select></div>';
        }
        return '<div><label class="block text-xs font-semibold text-slate-500 mb-1.5">'+esc(f.label)+(f.required?' *':'')+'</label>'+
          '<input id="f_'+f.key+'" type="'+(f.type||'text')+'" value="'+esc(val)+'" class="'+fieldCls+'"></div>';
      }).join('')+'</div>';
      openModal((id?'Edit ':'Tambah ')+cfg.title.replace(/^Master\s+/i,''), html, function(){
        var obj = id ? Object.assign({}, rec) : {id: uid(cfg.idPrefix||'x')};
        for(var i=0;i<cfg.fields.length;i++){
          var f=cfg.fields[i], v=fv('f_'+f.key);
          if(f.required && !v){ toast('Kolom "'+f.label+'" wajib diisi.', true); return; }
          obj[f.key] = (f.type==='number') ? (parseFloat(v)||0) : v;
        }
        apiFetch(cfg.endpoint, {method:'POST', body:JSON.stringify(obj)})
          .then(function(){ closeModal(); toast(id?'Data diperbarui.':'Data ditambahkan.'); refresh(); })
          .catch(function(e){ toast('Gagal menyimpan: '+e.message, true); });
      });
    }
    refresh();
    document.getElementById('q').addEventListener('input', draw);
    var btnAdd=document.getElementById('btnAdd');
    if(btnAdd) btnAdd.onclick=function(){ form(null); };
  };
}

var PAGES={};

/* ---------------- dashboard (summary) ---------------- */
function statCard(icon, colorCls, label, value, sub){
  return '<div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-5 flex items-start gap-4">'+
    '<div class="w-11 h-11 rounded-xl flex items-center justify-center shrink-0 '+colorCls+'"><i data-lucide="'+icon+'" class="w-5 h-5"></i></div>'+
    '<div><div class="text-2xl font-extrabold text-slate-800 leading-tight">'+value+'</div>'+
    '<div class="text-sm text-slate-500 mt-0.5">'+esc(label)+'</div>'+
    (sub?'<div class="text-xs text-slate-400 mt-1">'+sub+'</div>':'')+'</div></div>';
}
PAGES.dashboard = function(c){
  c.innerHTML = pageHead('Dashboard', 'Ringkasan cepat lintas semua proyek') +
    '<div class="grid sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-8" id="statGrid">'+
      '<div class="col-span-full text-center text-sm text-slate-400 py-8">Memuat ringkasan…</div>'+
    '</div>'+
    '<div class="grid lg:grid-cols-2 gap-5">'+
      '<div>'+panelTitle('layers','Perlu Perhatian — Stok')+'<div id="stockPreview"></div></div>'+
      '<div>'+panelTitle('trending-up','Perlu Perhatian — RAP Bahan')+'<div id="rapPreview"></div></div>'+
    '</div>';
  function panelTitle(icon, label){ return '<h2 class="text-sm font-bold text-slate-600 mb-3 flex items-center gap-2"><i data-lucide="'+icon+'" class="w-4 h-4"></i>'+esc(label)+'</h2>'; }

  Promise.all([
    apiFetch('/projects.php'), apiFetch('/materials.php'),
    apiFetch('/material_stock.php'), apiFetch('/material_rap_report.php'),
  ]).then(function(r){
    var projects=r[0], materials=r[1], stock=r[2], rapReport=r[3];
    var critical = stock.filter(function(s){ return s.status==='MENIPIS'||s.status==='HABIS'; });
    var over = rapReport.filter(function(s){ return s.status==='MELEBIHI'; });

    document.getElementById('statGrid').innerHTML =
      statCard('briefcase','bg-blue-50 text-blue-600','Total Proyek', projects.length) +
      statCard('box','bg-indigo-50 text-indigo-600','Total Bahan Terdaftar', materials.length) +
      statCard('layers','bg-amber-50 text-amber-600','Bahan Perlu Restock', critical.length, critical.length?'di '+new Set(critical.map(function(x){return x.project_id;})).size+' proyek':null) +
      statCard('trending-up','bg-red-50 text-red-600','Pekerjaan Melebihi RAP', over.length, over.length?'potensi pemborosan bahan':null);

    var stockPrev=document.getElementById('stockPreview');
    stockPrev.innerHTML = critical.length ? panel(critical.slice(0,6).map(function(r){
      return '<div class="flex justify-between items-center py-2.5 border-b border-slate-100 last:border-0 text-sm">'+
        '<div><b>'+esc(r.material_nama)+'</b><div class="text-xs text-slate-400">'+esc(r.project_nama)+'</div></div>'+
        badge(r.status==='HABIS'?'danger':'warn', r.status==='HABIS'?'Habis':'Perlu Dikirim')+'</div>';
    }).join('')) : panel('<div class="text-center text-sm text-slate-400 py-6">Semua stok aman ✓</div>');

    var rapPrev=document.getElementById('rapPreview');
    rapPrev.innerHTML = over.length ? panel(over.slice(0,6).map(function(r){
      return '<div class="flex justify-between items-center py-2.5 border-b border-slate-100 last:border-0 text-sm">'+
        '<div><b>'+esc(r.material_nama)+'</b><div class="text-xs text-slate-400">'+esc(r.pekerjaan_nama)+' · '+esc(r.project_nama)+'</div></div>'+
        '<span class="font-bold text-red-600">+'+num0(r.deviasi)+'</span></div>';
    }).join('')) : panel('<div class="text-center text-sm text-slate-400 py-6">Tidak ada pemborosan bahan ✓</div>');
    icons();
  }).catch(function(e){ document.getElementById('statGrid').innerHTML='<div class="col-span-full text-center text-sm text-red-500 py-8">Gagal memuat: '+esc(e.message)+'</div>'; });
};

PAGES.proyek = masterPage({
  title:'Master Proyek', sub:'Daftar proyek — dasar semua data bahan & RAP', endpoint:'/projects.php', addLabel:'Proyek', idPrefix:'proj_',
  fields:[{key:'nama', label:'Nama Proyek', required:true}],
  searchFn:function(r){ return r.nama; },
  columns:[{key:'nama', label:'Nama Proyek', render:function(r){ return '<b>'+esc(r.nama)+'</b>'; }}],
});

PAGES.bahan = masterPage({
  title:'Master Bahan', sub:'Katalog material — dipakai di semua proyek', endpoint:'/materials.php', addLabel:'Bahan', idPrefix:'mat_',
  fields:[
    {key:'kode', label:'Kode Bahan', required:true},
    {key:'nama', label:'Nama Bahan', required:true},
    {key:'satuan', label:'Satuan', required:true},
    {key:'kategori', label:'Kategori'},
    {key:'stok_minimum', label:'Stok Minimum (Reorder Point)', type:'number', default:0},
  ],
  searchFn:function(r){ return r.kode+' '+r.nama+' '+r.kategori; },
  columns:[
    {key:'kode', label:'Kode', render:function(r){ return '<span class="text-slate-500">'+esc(r.kode)+'</span>'; }},
    {key:'nama', label:'Nama Bahan', render:function(r){ return '<b>'+esc(r.nama)+'</b>'; }},
    {key:'satuan', label:'Satuan', render:function(r){ return esc(r.satuan); }},
    {key:'kategori', label:'Kategori', render:function(r){ return r.kategori?esc(r.kategori):'<span class="text-slate-300 italic">–</span>'; }},
    {key:'stok_minimum', label:'Stok Min.', render:function(r){ return num0(r.stok_minimum); }},
  ],
});

PAGES.pekerjaan = function(c){
  apiFetch('/projects.php').then(function(projects){
    STATE.cache.projects = projects;
    masterPage({
      title:'Master Pekerjaan', sub:'Item pekerjaan (BOQ) per proyek — dasar RAP bahan', endpoint:'/pekerjaan.php', addLabel:'Pekerjaan', idPrefix:'pk_',
      fields:[
        {key:'project_id', label:'Proyek', type:'select-dyn', required:true, placeholder:'— Pilih proyek —',
         optionsFn:function(){ return projects.map(function(p){ return {value:p.id, label:p.nama}; }); }},
        {key:'nama', label:'Nama Pekerjaan', required:true},
        {key:'satuan', label:'Satuan', required:true},
        {key:'volume_kontrak', label:'Volume Kontrak (BQ)', type:'number', default:0},
      ],
      searchFn:function(r){ var p=projects.find(function(x){ return x.id===r.project_id; }); return r.nama+' '+(p?p.nama:''); },
      columns:[
        {key:'project_id', label:'Proyek', render:function(r){ var p=projects.find(function(x){ return x.id===r.project_id; }); return p?esc(p.nama):'<span class="text-slate-300 italic">–</span>'; }},
        {key:'nama', label:'Nama Pekerjaan', render:function(r){ return '<b>'+esc(r.nama)+'</b>'; }},
        {key:'satuan', label:'Satuan', render:function(r){ return esc(r.satuan); }},
        {key:'volume_kontrak', label:'Volume Kontrak', render:function(r){ return num0(r.volume_kontrak); }},
      ],
    })(c);
  }).catch(function(e){ c.innerHTML=pageHead('Master Pekerjaan','')+panel('<div class="text-red-500 text-sm">Gagal memuat proyek: '+esc(e.message)+'</div>'); });
};

PAGES.rap = function(c){
  Promise.all([apiFetch('/pekerjaan.php'), apiFetch('/materials.php'), apiFetch('/projects.php')]).then(function(r){
    var pekerjaanList=r[0], materials=r[1], projects=r[2];
    masterPage({
      title:'Konfigurasi RAP Bahan', sub:'Koefisien bahan ideal per satuan volume pekerjaan', endpoint:'/rap_material.php', addLabel:'Koefisien', idPrefix:'rap_',
      fields:[
        {key:'pekerjaan_id', label:'Pekerjaan', type:'select-dyn', required:true, placeholder:'— Pilih pekerjaan —',
         optionsFn:function(){ return pekerjaanList.map(function(pk){
           var p=projects.find(function(x){ return x.id===pk.project_id; });
           return {value:pk.id, label:(p?p.nama+' — ':'')+pk.nama};
         }); }},
        {key:'material_id', label:'Bahan', type:'select-dyn', required:true, placeholder:'— Pilih bahan —',
         optionsFn:function(){ return materials.map(function(m){ return {value:m.id, label:m.nama+' ('+m.satuan+')'}; }); }},
        {key:'koefisien', label:'Koefisien (qty bahan / 1 satuan volume)', type:'number', required:true},
      ],
      searchFn:function(r){
        var pk=pekerjaanList.find(function(x){ return x.id===r.pekerjaan_id; });
        var m=materials.find(function(x){ return x.id===r.material_id; });
        return (pk?pk.nama:'')+' '+(m?m.nama:'');
      },
      columns:[
        {key:'pekerjaan_id', label:'Pekerjaan', render:function(r){ var pk=pekerjaanList.find(function(x){ return x.id===r.pekerjaan_id; }); return pk?esc(pk.nama):'<span class="text-slate-300 italic">–</span>'; }},
        {key:'material_id', label:'Bahan', render:function(r){ var m=materials.find(function(x){ return x.id===r.material_id; }); return m?esc(m.nama):'<span class="text-slate-300 italic">–</span>'; }},
        {key:'koefisien', label:'Koefisien', render:function(r){ return Number(r.koefisien||0).toLocaleString('id-ID',{maximumFractionDigits:6}); }},
      ],
    })(c);
  }).catch(function(e){ c.innerHTML=pageHead('Konfigurasi RAP Bahan','')+panel('<div class="text-red-500 text-sm">Gagal memuat: '+esc(e.message)+'</div>'); });
};

/* ---------------- read-only cross-project reports ---------------- */
PAGES.stock = function(c){
  c.innerHTML = pageHead('Monitor Stok Bahan (Semua Proyek)',
    'Stok berjalan (bahan masuk − pemakaian) per proyek, seperti stok minimarket.') +
    panel(
      '<div class="flex justify-between items-center mb-4 gap-3 flex-wrap">'+
        '<div class="relative flex-1 min-w-[220px] max-w-xs"><i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2"></i>'+
        '<input type="text" id="q" placeholder="Cari proyek / bahan…" class="w-full pl-9 pr-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-100"></div>'+
        '<span class="text-xs text-slate-400" id="cnt"></span>'+
      '</div>'+
      '<div class="overflow-x-auto -mx-5 px-5"><table class="w-full text-sm" id="tbl"></table></div>'
    );
  var rows=[];
  var cols=[
    {label:'Proyek', get:function(r){ return esc(r.project_nama); }},
    {label:'Bahan', get:function(r){ return '<b>'+esc(r.material_nama)+'</b>'; }},
    {label:'Total Masuk', get:function(r){ return num0(r.total_masuk)+' '+esc(r.satuan); }},
    {label:'Total Pemakaian', get:function(r){ return num0(r.total_keluar)+' '+esc(r.satuan); }},
    {label:'Sisa Stok', get:function(r){ return '<b>'+num0(r.stok)+' '+esc(r.satuan)+'</b>'; }},
    {label:'Stok Minimum', get:function(r){ return num0(r.stok_minimum); }},
    {label:'Status', get:function(r){
      var map={AMAN:['aman','Aman'],MENIPIS:['warn','Perlu Dikirim'],HABIS:['danger','Stok Habis']};
      var m=map[r.status]||['neutral',r.status];
      return badge(m[0], m[1]);
    }},
  ];
  function draw(){
    var q=fv('q').toLowerCase();
    var list=q?rows.filter(function(r){ return (r.project_nama+' '+r.material_nama).toLowerCase().indexOf(q)>-1; }):rows;
    document.getElementById('cnt').textContent=list.length+' data';
    document.getElementById('tbl').innerHTML='<thead><tr class="border-b border-slate-200">'+cols.map(function(cl){ return '<th class="text-left text-[11px] font-bold uppercase tracking-wide text-slate-400 py-2.5 pr-4 whitespace-nowrap">'+esc(cl.label)+'</th>'; }).join('')+'</tr></thead>'+
      '<tbody>'+(list.length?list.map(function(r){ return '<tr class="border-b border-slate-100 hover:bg-slate-50">'+cols.map(function(cl){ return '<td class="py-2.5 pr-4">'+cl.get(r)+'</td>'; }).join('')+'</tr>'; }).join(''):
      '<tr><td colspan="'+cols.length+'" class="text-center text-slate-400 text-sm py-10">Belum ada data bahan masuk/pemakaian.</td></tr>')+'</tbody>';
  }
  apiFetch('/material_stock.php').then(function(data){ rows=data; draw(); document.getElementById('q').addEventListener('input',draw); })
    .catch(function(e){ toast('Gagal memuat: '+e.message, true); });
};

    document.getElementById('cnt').textContent=list.length+' data';
    document.getElementById('tbl').innerHTML='<thead><tr class="border-b border-slate-200">'+cols.map(function(cl){ return '<th class="text-left text-[11px] font-bold uppercase tracking-wide text-slate-400 py-2.5 pr-4 whitespace-nowrap">'+esc(cl.label)+'</th>'; }).join('')+'</tr></thead>'+
      '<tbody>'+(list.length?list.map(function(r){ return '<tr class="border-b border-slate-100 hover:bg-slate-50">'+cols.map(function(cl){ return '<td class="py-2.5 pr-4">'+cl.get(r)+'</td>'; }).join('')+'</tr>'; }).join(''):
      '<tr><td colspan="'+cols.length+'" class="text-center text-slate-400 text-sm py-10">Belum ada konfigurasi RAP / progress pekerjaan.</td></tr>')+'</tbody>';
  }
  apiFetch('/material_rap_report.php').then(function(data){ rows=data; draw(); document.getElementById('q').addEventListener('input',draw); })
    .catch(function(e){ toast('Gagal memuat: '+e.message, true); });

/* ---------------- user management (admin only) ---------------- */
PAGES.users = function(c){
  if(!STATE.user || STATE.user.role!=='admin'){
    c.innerHTML = pageHead('Kelola User','') + panel('<div class="text-sm text-slate-500">Hanya Admin Pusat yang bisa mengelola user.</div>');
    return;
  }
  c.innerHTML = pageHead('Kelola User', 'Admin Lapangan hanya bisa input Bahan Masuk & Pemakaian, dibatasi ke proyek yang ditugaskan.',
    '<button class="'+btnPrimary+'" id="btnAdd"><i data-lucide="plus" class="w-4 h-4"></i>User</button>') +
    panel('<div class="overflow-x-auto -mx-5 px-5"><table class="w-full text-sm" id="tbl"></table></div>');

  var rows=[], projects=[];
  var cols=[
    {label:'Nama', get:function(r){ return '<b>'+esc(r.nama)+'</b>'; }},
    {label:'Email', get:function(r){ return esc(r.email); }},
    {label:'Role', get:function(r){ return {admin:'Admin Pusat',owner:'Owner',lapangan:'Admin Lapangan'}[r.role]||esc(r.role); }},
    {label:'Proyek Ditugaskan', get:function(r){
      if(r.role!=='lapangan') return '<span class="text-slate-300 italic">Semua (akses penuh)</span>';
      var names=(r.projectIds||[]).map(function(id){ var p=projects.find(function(x){ return x.id===id; }); return p?p.nama:id; });
      return names.length?esc(names.join(', ')):'<span class="text-slate-300 italic">Belum ada proyek</span>';
    }},
    {label:'Aksi', get:function(r){
      return '<button class="'+btnGhostSm+'" data-edit="'+esc(r.id)+'">Edit</button> '+
        '<button class="'+btnDangerSm+'" data-del="'+esc(r.id)+'">Hapus</button>';
    }},
  ];
  function draw(){
    document.getElementById('tbl').innerHTML='<thead><tr class="border-b border-slate-200">'+cols.map(function(cl){ return '<th class="text-left text-[11px] font-bold uppercase tracking-wide text-slate-400 py-2.5 pr-4 whitespace-nowrap">'+esc(cl.label)+'</th>'; }).join('')+'</tr></thead>'+
      '<tbody>'+(rows.length?rows.map(function(r){ return '<tr class="border-b border-slate-100 hover:bg-slate-50">'+cols.map(function(cl){ return '<td class="py-2.5 pr-4">'+cl.get(r)+'</td>'; }).join('')+'</tr>'; }).join(''):
      '<tr><td colspan="'+cols.length+'" class="text-center text-slate-400 text-sm py-10">Belum ada user.</td></tr>')+'</tbody>';
    document.querySelectorAll('[data-edit]').forEach(function(b){ b.onclick=function(){ form(b.getAttribute('data-edit')); }; });
    document.querySelectorAll('[data-del]').forEach(function(b){ b.onclick=function(){ del(b.getAttribute('data-del')); }; });
  }
  function refresh(){
    Promise.all([apiFetch('/users.php'), apiFetch('/projects.php')]).then(function(r){ rows=r[0]; projects=r[1]; draw(); })
      .catch(function(e){ toast('Gagal memuat: '+e.message, true); });
  }
  function del(id){
    confirmModal('Hapus User', 'Yakin mau menghapus user ini?', function(){
      apiFetch('/users.php?id='+encodeURIComponent(id), {method:'DELETE'})
        .then(function(){ toast('User dihapus.'); refresh(); }).catch(function(e){ toast('Gagal menghapus: '+e.message, true); });
    });
  }
  function form(id){
    var rec = id ? rows.find(function(x){ return x.id===id; }) : null;
    var html =
      '<div class="space-y-4">'+
      '<div><label class="block text-xs font-semibold text-slate-500 mb-1.5">Nama *</label><input id="f_nama" value="'+esc(rec?rec.nama:'')+'" class="'+fieldCls+'"></div>'+
      '<div><label class="block text-xs font-semibold text-slate-500 mb-1.5">Email *</label><input id="f_email" type="email" value="'+esc(rec?rec.email:'')+'" class="'+fieldCls+'"></div>'+
      '<div><label class="block text-xs font-semibold text-slate-500 mb-1.5">Role *</label><select id="f_role" class="'+fieldCls+'">'+
        ['lapangan','admin','owner'].map(function(r){ return '<option value="'+r+'"'+(rec&&rec.role===r?' selected':'')+'>'+
          {admin:'Admin Pusat',owner:'Owner',lapangan:'Admin Lapangan'}[r]+'</option>'; }).join('')+
      '</select></div>'+
      '<div><label class="block text-xs font-semibold text-slate-500 mb-1.5">Password '+(id?'(kosongkan jika tidak diubah)':'*')+'</label><input id="f_password" type="password" placeholder="Min. 10 karakter" class="'+fieldCls+'"></div>'+
      '<div><label class="block text-xs font-semibold text-slate-500 mb-1.5">Proyek yang Ditugaskan (khusus Admin Lapangan)</label>'+
        '<select id="f_projectIds" multiple size="6" class="'+fieldCls+'">'+
          projects.map(function(p){ return '<option value="'+esc(p.id)+'"'+((rec&&rec.projectIds||[]).indexOf(p.id)>-1?' selected':'')+'>'+esc(p.nama)+'</option>'; }).join('')+
        '</select><div class="text-xs text-slate-400 mt-1">Ctrl/Cmd+klik untuk pilih lebih dari satu.</div></div>'+
      '</div>';
    openModal((id?'Edit ':'Tambah ')+'User', html, function(){
      var nama=fv('f_nama'), email=fv('f_email'), role=fv('f_role'), password=fv('f_password');
      if(!nama||!email){ toast('Nama dan email wajib diisi.', true); return; }
      if(!id && password.length<10){ toast('Password minimal 10 karakter.', true); return; }
      var projectIds=Array.from(document.getElementById('f_projectIds').selectedOptions).map(function(o){ return o.value; });
      apiFetch('/users.php', {method:'POST', body:JSON.stringify({id:id||'', nama:nama, email:email, role:role, password:password, projectIds:projectIds})})
        .then(function(){ closeModal(); toast(id?'User diperbarui.':'User ditambahkan.'); refresh(); })
        .catch(function(e){ toast('Gagal menyimpan: '+e.message, true); });
    });
  }
  refresh();
  document.getElementById('btnAdd').onclick=function(){ form(null); };
};
</script>
